  function closing(c){
    const col=(nm,x)=>`<div><span class="nm">${nm}</span><span class="px ${dir(x.pct)}">${x.v}<small>${arrow(x.pct)} ${x.chg.replace(/^[+-]/,"")} ${sign(x.pct)}</small></span>
      <dl><dt>개인</dt><dd class="${dir(x.ind)}">${won(x.ind)}원</dd><dt>외국인</dt><dd class="${dir(x.frg)}">${won(x.frg)}원</dd><dt>기관</dt><dd class="${dir(x.inst)}">${won(x.inst)}원</dd>${x.prog!=null?`<dt>${x.progLabel||"프로그램"}</dt><dd class="${dir(x.prog)}">${won(x.prog)}원</dd>`:""}${x.vol?`<dt>거래대금</dt><dd>${x.vol}</dd>`:""}</dl>
      ${x.adv!=null?`<span class="brd">상승 ${x.adv} · 하락 ${x.dec}</span>`:""}</div>`;
    return `<div class="sub-block"><h4>오늘 장 마감 숫자</h4><div class="close">${col("코스피",c.kospi)}${col("코스닥",c.kosdaq)}</div>${c.text?`<p>${c.text}</p>`:""}</div>`;
  }

  function render(I){
    const latest = ISSUES[0], isOld = I !== latest, idx = ISSUES.indexOf(I);
    document.title = "말타노트";
    app.innerHTML = `
    <header class="mast">
      <p class="disc">이 레터는 공개된 자료를 정리한 시장 정보예요. 특정 금융투자상품의 매수·매도 권유나 개인별 투자 조언이 아니에요.</p>
      <div class="mast-top"><div class="brand">말타노트<small>by @malta_note</small></div><div class="meta">제${I.no}호 · ${I.date}</div></div>
      <h1>${I.headline}</h1>
      ${I.lede?`<p class="lede">${I.lede}</p>`:""}
    </header>
    ${isOld?`<div class="old-banner"><span>지난 호를 보고 있어요.</span><button type="button" class="linkbtn" data-go="${latest.id}">최신 호(제${latest.no}호) 보기 →</button></div>`:""}
    <div class="inner">
      <section class="sec" id="s1">${h2(0)}
        ${I.notice?`<p class="notice">${I.notice}</p>`:""}
        <div class="board${I.indicators.length===10?" b10":""}">${I.indicators.map(x=>`<div class="tile"><span class="k">${x.k}</span><span class="v">${x.v}</span><span class="c ${dir(x.pct)}">${arrow(x.pct)} ${sign(x.pct).replace(/^[+-]/,"")}</span><span class="d">${x.d}</span></div>`).join("")}</div>
        ${I.indicatorNotes?`<ul class="notes">${I.indicatorNotes.map(n=>`<li><b>${n.t}</b><span>${n.x}</span></li>`).join("")}</ul>`:""}
        ${I.gold?goldBlock(I.gold):""}
        ${I.bigNumber?`<div class="big"><div class="fig ${I.bigNumber.dir}">${I.bigNumber.value}<small>${I.bigNumber.unit}</small></div><div class="txt"><b>${I.bigNumber.title}</b>${I.bigNumber.text}</div></div>`:""}
      </section>

      <section class="sec" id="s2">${h2(1)}<h3>${I.us.title}</h3>
        ${I.us.heat&&I.us.heat.length?heat(I.us.heat)+`<p class="small center">${I.us.heatNote||""}</p>`:""}
        <div class="body">${ps(I.us.paras)}</div>
        ${I.us.fear?gauge(I.us.fear):""}
      </section>

      <section class="sec" id="s3">${h2(2)}<h3>${I.kr.title}</h3>
        ${I.kr.heat&&I.kr.heat.length?heat(I.kr.heat)+`<p class="small center">${I.kr.heatNote||""}</p>`:""}
        <div class="body">${ps(I.kr.paras)}</div>
        ${I.kr.flow?flow(I.kr.flow):""}
        ${I.kr.close?closing(I.kr.close):""}
      </section>

      <section class="sec" id="s4">${h2(3)}
        <p class="quote">“${I.comment.quote}”</p>
        ${I.comment.intro?`<p>${I.comment.intro}</p>`:""}
        ${(I.comment.points||[]).map(p=>`<div class="pt"><h4>${p.t}</h4>${ps(p.paras)}</div>`).join("")}
      </section>

      <section class="sec" id="s5">${h2(4)}
        <div class="news">${I.news.map(n=>`<article><span class="tag">${n.tag}</span><h3>${n.title}</h3><p>${n.body}</p>${n.more?`<p>${n.more}</p>`:""}<p class="why"><b>왜 중요할까요?</b> ${n.why}</p><a class="more" href="${n.url}" target="_blank" rel="noopener">원문 보기 (${n.src}) →</a></article>`).join("")}</div>
      </section>

      <section class="sec" id="s6">${h2(5)}<h3>${I.term.name}</h3>
        ${I.term.card?`<div class="tcard"><span class="eyebrow">${I.term.card.eyebrow}</span><div class="tt">${I.term.card.title}</div><span class="ts">${I.term.card.sub}</span><ol class="steps">${I.term.card.steps.map(s=>`<li><b>${s.k}</b>${s.x}</li>`).join("")}</ol></div>`:""}
        ${I.term.note?`<p class="tip">${I.term.note}</p>`:""}
        ${I.term.intro?`<p>${I.term.intro}</p>`:""}
        ${(I.term.points||[]).map(p=>`<div class="pt"><h4>${p.t}</h4><ul>${p.items.map(t=>`<li>${t}</li>`).join("")}</ul>${p.box?`<div class="box"><span class="lb">${p.box.label}</span><p>${p.box.text}</p></div>`:""}${p.arrow?`<p class="arrow">→ ${p.arrow}</p>`:""}</div>`).join("")}
      </section>

      <section class="sec" id="s7">${h2(6)}
        ${I.calendarIntro?`<p>${I.calendarIntro}</p>`:""}
        <div class="cal">${I.calendar.map(c=>`<div class="${c.key?"key":""}"><div class="h"><span class="dt">${c.d}${c.key?`<span class="badge">가장 중요</span>`:""}</span><span class="t">${c.t}</span></div><p>${c.n}</p></div>`).join("")}</div>
      </section>

      <section class="sec" id="s8">${h2(7)}
        ${I.quizIntro?`<p>${I.quizIntro}</p>`:""}
        <div class="quiz">${I.quiz.map((q,qi)=>`<div class="q" data-q="${qi}"><h3>Q${qi+1}. ${q.q}${q.tag?`<span class="badge">${q.tag}</span>`:""}</h3><div class="opts">${q.opts.map((o,i)=>`<button type="button" id="quiz-${qi}-${i}" data-i="${i}">${"①②③④"[i]} ${o}</button>`).join("")}</div><p class="res" id="quiz-res-${qi}" hidden></p></div>`).join("")}</div>
      </section>

      <section class="sec" id="archive"><h2>지난 호 보기 <span class="small">지금까지 ${ISSUES.length}호</span></h2>
        <ul class="arch" id="arch-list"></ul>
        <p class="center" id="arch-more-wrap" hidden><button type="button" class="linkbtn" id="arch-more">지난 호 전체 보기 →</button></p>
      </section>

      <footer>
        <p><b>이미지 · 자료 출처</b></p>
        <ul>${I.sources.map(s=>`<li><a href="${s[1]}" target="_blank" rel="noopener">${s[0]}</a></li>`).join("")}</ul>
        <p>이 글은 정보 전달을 목적으로 한 정리 노트예요. 특정 종목을 사거나 팔라는 권유가 아니고, 모든 투자의 책임은 본인에게 있어요. 수치는 위 기사에서 가져왔고, 발표 기관 수치와 차이가 날 수 있어요.</p>
        <p>© 2026 말타노트 · @malta_note</p>
      </footer>
    </div>`;

    // 지난 호 목록 (최신순, 처음엔 5개)
    let showAll = false;
    const list = document.getElementById("arch-list"), moreWrap = document.getElementById("arch-more-wrap");
    const drawArch = () => {
      const items = showAll ? ISSUES : ISSUES.slice(0,5);
      list.innerHTML = items.map(x=>`<li><button type="button" data-go="${x.id}" aria-current="${x===I}"><span class="no">제${x.no}호</span><span class="ti">${x.headline}</span><span class="dt">${x.date}</span></button></li>`).join("");
      moreWrap.hidden = showAll || ISSUES.length<=5;
    };
    drawArch();
    document.getElementById("arch-more").addEventListener("click",()=>{ showAll=true; drawArch(); });

    // 퀴즈
    app.querySelectorAll(".q").forEach(el=>{
      const q = I.quiz[+el.dataset.q], res = el.querySelector(".res");
      el.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{
        const pick=+b.dataset.i;
        el.querySelectorAll("button").forEach(x=>{ x.classList.toggle("right", +x.dataset.i===q.answer); x.classList.toggle("wrong", +x.dataset.i===pick && pick!==q.answer); });
        res.hidden=false; res.innerHTML=`<b>${pick===q.answer?"맞았어요.":"아쉬워요. 정답은 "+"①②③④"[q.answer]+"번이에요."}</b> ${q.explain}`;
      }));
    });
    toc.innerHTML = SECTIONS.map((s,i)=>`<a href="#${s[0]}"><span>${String(i+1).padStart(2,"0")}</span>${s[1]}</a>`).join("") + `<a href="#archive"><span>··</span>지난 호 보기</a>`;
  }

  const find = id => ISSUES.find(x=>x.id===id);
  function go(id, scroll){
    const I = find(id) || ISSUES[0];
    render(I);
    try{ history.replaceState(null,"", I===ISSUES[0] ? location.pathname+location.search : "#ho"+I.id); }catch(e){}
    if(scroll) window.scrollTo({top:0});
  }
  document.addEventListener("click",e=>{
    const g = e.target.closest("[data-go]");
    if(g){ go(g.dataset.go,true); return; }
    const a = e.target.closest(".toc a");
    if(a){ e.preventDefault(); const t=document.getElementById(a.getAttribute("href").slice(1)); if(t) t.scrollIntoView({behavior:"smooth"}); toc.hidden=true; tocBtn.setAttribute("aria-expanded","false"); return; }
    if(e.target===tocBtn){ toc.hidden=!toc.hidden; tocBtn.setAttribute("aria-expanded",String(!toc.hidden)); return; }
    if(!toc.hidden && !e.target.closest(".toc")){ toc.hidden=true; tocBtn.setAttribute("aria-expanded","false"); }
  });
  const m = (location.hash||"").match(/^#ho(\d+)$/);
  go(m?m[1]:ISSUES[0].id,false);
})();
</script>
</body>
</html>
