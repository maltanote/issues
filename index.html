<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>말타노트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 레이아웃: 가운데 한 단 종이. 형광펜색 머리띠(안내·제호·날짜·헤드라인) 아래로 01~08 번호 섹션이 차례로 이어지고, 맨 아래에 지난 호 목록. 오름=빨강, 내림=파랑(국내 증시 관례). */
:root{
  --bg:#e9ecf2; --paper:#ffffff; --soft:#f4f6fa; --ink:#131c2e; --sub:#56617a; --line:#d9dee8;
  --marker:#ffe45c; --band:#ffe45c; --band-ink:#131c2e; --band-note:#fff3a8;
  --accent:#1f4fd8; --up:#d92b3a; --down:#1e5fd0; --flat:#6b7385;
  --up-soft:#fde8ea; --down-soft:#e6eefc; --tip:#fff8d6;
  --heat-base:#2b3345; --heat-ink:#ffffff; --panel:#1a2233; --panel-ink:#eef1f7; --panel-sub:#a3adc2; --panel-up:#ff7a85; --panel-down:#7fb0ff;
  --f-display:"Hahmlet","Noto Serif KR",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0b0f18; --paper:#171e2d; --soft:#1e2637; --ink:#e9edf5; --sub:#9aa5bb; --line:#2a3447;
  --marker:#6b5a00; --band:#e6c93a; --band-ink:#131c2e; --band-note:#f3dd6e;
  --accent:#8fb0ff; --up:#ff6b78; --down:#6fa2ff; --flat:#9aa5bb;
  --up-soft:#3a1c22; --down-soft:#17284a; --tip:#2e2a14;
  --heat-base:#2b3345; --heat-ink:#ffffff; --panel:#0f1522; --panel-ink:#eef1f7; --panel-sub:#a3adc2; --panel-up:#ff7a85; --panel-down:#7fb0ff;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0b0f18; --paper:#171e2d; --soft:#1e2637; --ink:#e9edf5; --sub:#9aa5bb; --line:#2a3447;
  --marker:#6b5a00; --band:#e6c93a; --band-ink:#131c2e; --band-note:#f3dd6e;
  --accent:#8fb0ff; --up:#ff6b78; --down:#6fa2ff; --flat:#9aa5bb;
  --up-soft:#3a1c22; --down-soft:#17284a; --tip:#2e2a14;
  --heat-base:#2b3345; --heat-ink:#ffffff; --panel:#0f1522; --panel-ink:#eef1f7; --panel-sub:#a3adc2; --panel-up:#ff7a85; --panel-down:#7fb0ff;
  color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.75;padding-inline:16px;padding-block:24px 72px;word-break:keep-all}
p,h1,h2,h3,h4,ul{margin:0}
a{color:var(--accent)}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}
.small{font-size:12.5px;color:var(--sub)}
.center{text-align:center}

.sheet{max-width:720px;margin:0 auto;background:var(--paper);border-radius:10px;overflow:hidden}
/* 머리띠 */
.mast{background:var(--band);color:var(--band-ink);padding:22px 28px 24px;display:flex;flex-direction:column;gap:10px}
.mast .disc{font-size:12px;background:var(--band-note);border-radius:6px;padding:6px 12px}
.mast-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px 16px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:-.02em;line-height:1.25}
.brand small{font-family:var(--f-body);font-weight:500;font-size:13px;letter-spacing:0;margin-left:6px}
.mast .meta{font-size:13px;font-family:var(--f-num)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(19px,4.6vw,24px);line-height:1.4;text-wrap:balance}
.mast .lede{font-size:14.5px;max-width:60ch}
.old-banner{background:var(--soft);border-bottom:1px solid var(--line);padding:10px 28px;font-size:13.5px;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.linkbtn{font:inherit;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;font-weight:600}

.inner{padding:8px 28px 32px;display:flex;flex-direction:column}
.sec{display:flex;flex-direction:column;gap:16px;padding-block:30px;border-top:1px solid var(--line);scroll-margin-top:12px}
.sec:first-child{border-top:0}
h2{font-size:15.5px;font-weight:600;line-height:1.4;border-left:4px solid var(--marker);padding-left:10px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
h2 .n{font-family:var(--f-num);color:var(--sub);font-size:14px}
h3{font-family:var(--f-display);font-size:18px;font-weight:700;line-height:1.5;text-wrap:balance}
h4{font-size:14px;font-weight:600;line-height:1.5;border-left:3px solid var(--marker);padding-left:8px}
.body{display:flex;flex-direction:column;gap:12px}
.notice{font-size:13.5px;background:var(--tip);border-radius:6px;padding:10px 14px}
mark{background:linear-gradient(transparent 55%,var(--marker) 55%);color:inherit}

/* 01 지표 */
.board{display:grid;grid-template-columns:repeat(20,1fr);gap:8px}
.tile{grid-column:span 4;border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:1px;min-width:0}
.tile:nth-child(n+6){grid-column:span 5}
.tile .k{font-size:12px;color:var(--sub)}
.tile .v{font-family:var(--f-num);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.4}
.tile .c{font-family:var(--f-num);font-size:12.5px;font-variant-numeric:tabular-nums}
.tile .d{font-size:10.5px;color:var(--sub);line-height:1.4}
.board.b10 .tile:nth-child(n+6){grid-column:span 4}
@media (max-width:600px){.board{grid-template-columns:repeat(3,1fr);gap:6px}.tile,.tile:nth-child(n+6),.board.b10 .tile:nth-child(n+6){grid-column:span 1;padding:8px 9px}.tile .v{font-size:14px}.board.b10{grid-template-columns:repeat(2,1fr)}}
.notes{list-style:none;padding:0;display:flex;flex-direction:column;gap:12px}
.notes li{padding-left:12px;border-left:2px solid var(--line)}
.notes b{display:block;font-weight:600;font-size:14.5px}
.notes span{font-size:14px;color:var(--sub)}
.gold{display:flex;flex-direction:column;gap:12px}
.gstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.gstats>div{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:1px;min-width:0}
.gstats .k{font-size:12px;color:var(--sub)} .gstats .v{font-family:var(--f-num);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere} .gstats .s{font-size:11.5px;color:var(--sub);line-height:1.45}
.grange{border:1px solid var(--line);border-radius:8px;padding:14px 16px 10px;display:flex;flex-direction:column;gap:6px}
.grange .ttl{font-size:12.5px;color:var(--sub)}
.grange .trk{position:relative;height:10px;border-radius:999px;background:linear-gradient(to right,var(--down-soft),var(--up-soft));margin:26px 0 30px}
.grange .mk{position:absolute;top:50%;transform:translate(-50%,-50%);width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--sub)}
.grange .mk.now{width:16px;height:16px;background:var(--marker);border-color:var(--ink)}
.grange .lb{position:absolute;transform:translateX(-50%);font-size:11px;line-height:1.3;text-align:center;white-space:nowrap;color:var(--sub)}
.grange .lb.top{bottom:18px} .grange .lb.bot{top:18px}
.grange .lb b{display:block;font-family:var(--f-num);color:var(--ink);font-weight:600}
.grange .lb.e0{transform:none;text-align:left} .grange .lb.e1{transform:translateX(-100%);text-align:right}
.big{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:8px;padding:16px 18px}
.big .fig{font-family:var(--f-num);font-weight:600;font-size:clamp(36px,10vw,52px);line-height:1;letter-spacing:-.03em}
.big .fig small{font-family:var(--f-body);font-size:16px;font-weight:600;margin-left:4px;letter-spacing:0}
.big .txt{flex:1 1 240px;min-width:0;font-size:14.5px}
.big .txt b{display:block;font-size:15px}

/* 히트맵 */
.heat{display:flex;flex-wrap:wrap;gap:3px;background:var(--heat-base);padding:3px;border-radius:8px}
.heat div{color:var(--heat-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px 4px;min-width:0;line-height:1.3;border-radius:4px}
.heat .w1{flex:1 1 15%;min-height:58px;font-size:12px}
.heat .w2{flex:2 1 22%;min-height:72px;font-size:14px}
.heat .w3{flex:3 1 32%;min-height:96px;font-size:18px}
.heat b{font-weight:600;overflow-wrap:anywhere}
.heat span{font-family:var(--f-num);font-size:.82em;font-variant-numeric:tabular-nums}
@media (max-width:600px){.heat .w1{flex-basis:22%}.heat .w2{flex-basis:30%}.heat .w3{flex-basis:46%;font-size:16px}}

.sub-block{display:flex;flex-direction:column;gap:12px}
.card{border:1px solid var(--line);border-radius:8px;padding:16px}
/* 공포탐욕 */
.fg{display:flex;gap:8px 20px;align-items:center;flex-wrap:wrap}
.fg svg{flex:0 1 250px;min-width:200px;max-width:100%;height:auto}
.fg .side{flex:1 1 180px;min-width:0;display:flex;flex-direction:column;gap:4px;font-size:14px}
.fg .score{font-family:var(--f-num);font-weight:600;font-size:40px;line-height:1}
/* 수급 막대 */
.flow{display:flex;flex-direction:column;gap:14px}
.flow .r{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:baseline;font-size:15px}
.flow .track{position:relative;height:18px;grid-column:1/-1;order:3}
.flow .zero{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--sub)}
.flow .bar{position:absolute;top:0;bottom:0;border-radius:3px}
.flow .bar.up{background:var(--up)} .flow .bar.down{background:var(--down)}
.flow .val{text-align:right;font-family:var(--f-num);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.tip{background:var(--tip);border-left:4px solid var(--marker);border-radius:0 6px 6px 0;padding:10px 14px;font-size:14px}
.tip b{font-weight:600}
/* 장 마감 숫자 */
.close{background:var(--panel);color:var(--panel-ink);border-radius:8px;display:grid;grid-template-columns:1fr 1fr;gap:1px;overflow:hidden}
.close>div{padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.close .nm{font-weight:600;font-size:14px}
.close .px{font-family:var(--f-num);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums}
.close .px small{font-size:12.5px;margin-left:6px;font-weight:500}
.close dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0;font-size:13px}
.close dt{color:var(--panel-sub)} .close dd{margin:0;text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.close .up{color:var(--panel-up)} .close .down{color:var(--panel-down)}
.close .brd{font-size:12px;color:var(--panel-sub)}
@media (max-width:480px){.close{grid-template-columns:1fr}}

/* 04 한마디 */
.quote{font-family:var(--f-display);font-weight:500;font-size:16.5px;line-height:1.6;background:var(--tip);border-left:4px solid var(--marker);border-radius:0 6px 6px 0;padding:10px 14px}
.pt{display:flex;flex-direction:column;gap:8px}
/* 05 뉴스 */
.news{display:flex;flex-direction:column;gap:12px}
.news article{border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:8px}
.tag{font-size:11.5px;font-weight:600;color:var(--accent);letter-spacing:.02em}
.news h3{font-family:var(--f-body);font-size:15.5px;font-weight:600}
.news p{font-size:14.5px}
.why{background:var(--soft);border-radius:6px;padding:8px 12px}
.why b{font-weight:600}
.more{font-size:13px;font-weight:600;text-decoration:none}
/* 06 상식 카드 */
.tcard{background:var(--panel);color:var(--panel-ink);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:14px}
.tcard .eyebrow{font-size:12px;color:var(--panel-sub);font-family:var(--f-num)}
.tcard .tt{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,6vw,30px);line-height:1.3;text-wrap:balance}
.tcard .tt span{background:linear-gradient(transparent 62%,#8a7400 62%)}
.tcard .ts{font-size:14px;color:var(--panel-sub)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;list-style:none;padding:0;counter-reset:s}
.steps li{counter-increment:s;background:rgba(255,255,255,.07);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.5;display:flex;flex-direction:column;gap:2px}
.steps li::before{content:counter(s);font-family:var(--f-num);font-size:12px;color:#ffe45c}
.steps b{font-size:14px;font-weight:600}
.pt ul{padding-left:18px;display:flex;flex-direction:column;gap:6px}
.box{border:1.5px solid var(--up);border-radius:8px;padding:10px 14px;background:var(--up-soft);font-size:14px;display:flex;flex-direction:column;gap:4px}
.box .lb{align-self:flex-start;background:var(--up);color:var(--paper);font-size:11.5px;font-weight:600;border-radius:999px;padding:1px 8px}
.arrow{font-size:14px;color:var(--sub)}
/* 07 일정 */
.cal{display:flex;flex-direction:column;gap:8px}
.cal>div{border:1px solid var(--line);border-radius:8px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.cal .h{display:flex;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;align-items:baseline}
.cal .dt{font-weight:600;font-size:14px;font-family:var(--f-num)}
.cal .t{font-weight:600;font-size:14px;color:var(--accent);text-align:right}
.cal .key .t{color:var(--up)}
.cal .badge{font-family:var(--f-body);font-size:11px;background:var(--tip);border-radius:4px;padding:1px 6px;margin-left:6px;font-weight:600}
.cal p{font-size:13.5px;color:var(--sub)}
/* 08 퀴즈 */
.quiz{display:flex;flex-direction:column;gap:22px}
.q{display:flex;flex-direction:column;gap:8px}
.q h3{font-family:var(--f-body);font-size:15px;font-weight:600}
.q h3 .badge{font-size:11px;background:var(--tip);border-radius:4px;padding:1px 6px;margin-left:6px;font-weight:600;white-space:nowrap}
.opts{display:flex;flex-direction:column;gap:6px}
.opts button{font:inherit;font-size:14.5px;color:var(--ink);text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 14px;cursor:pointer}
.opts button:hover{border-color:var(--accent)}
.opts button.right{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);font-weight:600}
.opts button.wrong{opacity:.55;text-decoration:line-through}
.q .res{font-size:14px;background:var(--soft);border-radius:6px;padding:8px 12px}
/* 지난 호 */
.arch{list-style:none;padding:0;display:flex;flex-direction:column;gap:6px}
.arch button{width:100%;font:inherit;font-size:14.5px;color:var(--ink);text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 14px;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline}
.arch button:hover{border-color:var(--accent)}
.arch button[aria-current="true"]{background:var(--tip);border-color:transparent}
.arch .no{font-family:var(--f-num);font-weight:600;font-size:13px;color:var(--accent);white-space:nowrap}
.arch .ti{min-width:0}
.arch .dt{font-family:var(--f-num);font-size:12px;color:var(--sub);white-space:nowrap}
footer{border-top:1px solid var(--line);padding-top:20px;display:flex;flex-direction:column;gap:10px;font-size:12.5px;color:var(--sub)}
footer ul{padding-left:18px}
/* 목차 */
.toc-btn{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));font:inherit;font-size:13px;font-weight:600;background:var(--ink);color:var(--paper);border:0;border-radius:999px;padding:8px 14px;cursor:pointer;z-index:5}
.toc{position:fixed;right:16px;bottom:calc(60px + env(safe-area-inset-bottom,0px));background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;z-index:5;max-width:calc(100vw - 32px);box-shadow:0 6px 24px rgba(0,0,0,.18)}
.toc a{color:var(--ink);text-decoration:none;font-size:14px;padding:6px 12px;border-radius:6px}
.toc a:hover{background:var(--soft)}
.toc a span{font-family:var(--f-num);color:var(--sub);font-size:12px;margin-right:8px}
</style>
</head>
<body>

<div class="sheet" id="app"></div>
<button type="button" class="toc-btn" id="toc-btn" aria-expanded="false" aria-controls="toc">☰ 목차</button>
<nav class="toc" id="toc" hidden aria-label="목차"></nav>

<script>
/* =====================================================================
   발행 방법: ISSUES 배열 맨 앞(아래 표시 줄 바로 다음)에 새 호 객체를 하나 추가합니다.
   이전 호 객체와 그 아래 렌더 코드는 건드리지 않습니다. 최신 호가 배열의 첫 번째입니다.
   ===================================================================== */
const ISSUES = [
/*@@NEW_ISSUE_BELOW@@*/
{
  no: 28, id: "261111",
  date: "2026. 11. 11 (수)",
  headline: "미국 물가 '깜짝 상승'에도 코스피 2.60% 오른 5,375, 코스닥은 5.62% 뛰어 700선 회복…AI 기대가 금리 걱정을 이겼어요",
  lede: "미국 10월 소비자물가가 예상보다 0.1%포인트 높게 나와 뉴욕 3대 지수가 내리고 엔비디아는 5% 넘게 떨어졌어요. 그런데 한국 증시는 코어위브 실적과 앤트로픽 상장 기대에 반도체주가 오르며 코스피 5,375.36, 코스닥 705.10으로 마쳤고, 원/달러 환율은 3.9원 내린 1,333.6원이 됐어요.",

        "주로 창업자이면서 오래 회사를 이끈 CEO, 핵심 기술을 가진 연구자, 큰 고객과의 관계를 혼자 쥔 사람이 키맨이 돼요." ] },
      { t:"2) 왜 생기고, 어떻게 주가에 나타나나요?", items:[
        "회사가 빠르게 크는 동안 중요한 결정이 한 사람에게 모이면, 그 사람을 대신할 사람이 길러지지 않을 때가 많아요. 엔비디아도 젠슨 황 CEO에게 60명이 넘는 임원이 직접 보고하고, 공개된 후계 계획이 없다고 해요(MTN, CNBC 인용).",
        "그 사람에게 갑자기 일이 생기면 시장은 '앞으로 누가, 어떻게 이끌까'를 알 수 없게 돼요. 이 모르는 부분을 위험으로 보고 주가를 깎아요. 9일 엔비디아는 장중 8.79%까지 빠졌다가 4.27% 내려 마감했어요." ],
        box:{ label:"실적은 그대로인데 왜 주가가 빠지나요?", text:"주가는 지금 버는 돈뿐 아니라 <b>앞으로 벌 돈에 대한 믿음</b>을 반영해요. 키맨에게 문제가 생기면 당장 매출은 그대로여도, 앞으로의 전략·협상·인재 관리가 흔들릴 수 있다는 걱정이 커져요. 그 걱정의 크기만큼 사람들이 덜 비싸게 사려고 해서 주가가 내려가요." } },
      { t:"3) 왜 중요한가요?", items:[
        "키맨이 뛰어날수록 회사는 빨리 커요. 하지만 그만큼 그 사람이 빠졌을 때의 빈자리도 커요. 번스타인의 스테이시 라스곤은 CNBC에서 '젠슨이 곧 엔비디아'라는 취지로 말했어요(MTN). 장점과 위험이 같은 곳에서 나오는 셈이에요.",
        "그래서 회사들은 후계 계획을 세우거나, 여러 경영진에게 권한을 나누거나, 핵심 인물에게 보험을 드는 방식으로 이 위험을 줄이려고 해요." ],
        arrow:"키맨 리스크는 '그 사람이 있어서 좋은 점'의 뒷면이에요. 둘은 늘 함께 와요." },
      { t:"4) 요즘 왜 뉴스에 나오나요?", items:[
        "젠슨 황 CEO가 중국 정보기관 연관 의혹을 받는 여성과의 관계를 인정했고, 엔비디아 이사회는 그가 외국 정보기관의 표적이 됐는지 독립 조사에 들어갔어요. 트럼프 대통령은 FBI가 살펴보고 있다고 말했어요(MTN·인더스트리뉴스).",
        "로이터에 따르면 퓨추럼 에쿼티스의 셰이 볼루어는 핵심 인물 위험이 매우 크다고 평가했어요(한국일보). 반면 이사회가 여전히 그를 지지하고 있어 물러날 가능성은 낮다는 시각도 많아요." ] },
      { t:"5) 우리에게는 어떤 영향이 있나요?", items:[
        "엔비디아는 한국 투자자들이 많이 가진 해외 주식이고, SK하이닉스·삼성전자의 중요한 고객이에요. 이번처럼 해외 기업의 키맨 문제도 우리 계좌와 한국 증시에 영향을 줄 수 있어요.",
        "한국에도 창업자나 대주주 한 사람의 결정이 큰 영향을 주는 회사가 많아요. 관심 있는 회사가 있다면 '이 회사는 한 사람에게 얼마나 기대고 있나'를 한 번 생각해 보면 좋아요." ] },
      { t:"6) 기사와 숫자는 이렇게 읽어요", items:[
        "<mark>같은 업종과 비교</mark>해요. 어제처럼 다른 반도체주는 오르는데 한 회사만 빠졌다면, 업종 전체 문제가 아니라 그 회사만의 문제일 가능성이 커요.",
        "<mark>회사의 공식 대응</mark>을 봐요. 이사회가 조사를 하는지, CEO가 자리를 지키는지, 후계 계획을 밝히는지에 따라 불확실성의 크기가 달라져요.",
        "<mark>사업 숫자가 바뀌었는지</mark> 확인해요. 계약이 취소됐거나 실적 전망이 낮아졌다면 단순한 걱정이 아니라 실제 영향이 생긴 거예요." ],
        box:{ label:"키맨 리스크 기사에서 볼 세 가지", text:"<b>다른 회사와 비교</b>: 같은 업종 중 이 회사만 빠졌나? <b>회사의 대응</b>: 조사·해명·후계 계획이 나왔나? <b>사업 영향</b>: 매출·계약·전망에 실제 변화가 있나? 어제 엔비디아는 '다른 반도체주는 상승 → 이사회 독립 조사, CEO 유지 → 공급 계약 변화는 확인 안 됨'으로 읽을 수 있어요." } },
      { t:"7) 어디서 직접 확인할 수 있나요?", items:[
        "<b>미국 증권거래위원회(SEC) EDGAR</b>: 미국 상장사가 내는 연간 보고서의 '위험 요인(Risk Factors)'에서 핵심 인물 의존 위험을 어떻게 적었는지 볼 수 있어요. <a href='https://www.sec.gov/edgar/search/' target='_blank' rel='noopener'>sec.gov/edgar →</a>",
        "<b>금융감독원 전자공시시스템(DART)</b>: 한국 상장사의 사업보고서에서 임원 현황과 위험 요인, 최대주주 정보를 확인할 수 있어요. <a href='https://dart.fss.or.kr' target='_blank' rel='noopener'>dart.fss.or.kr →</a>" ],
        arrow:"한 회사만 이유 없이 크게 빠졌다면, '혹시 사람 문제인가?'를 떠올려 보세요." }

  headline: "외국인 7거래일째 '팔자'에 코스피 0.81% 내린 5,018, 장중 한때 5,000선 아래로 밀렸어요",
  lede: "미국 반도체주가 하루 만에 반등했지만, 예상보다 훨씬 좋은 미국 고용지표에 금리 인상 걱정이 커지고 AI 데이터센터 규제 불안도 이어졌어요. 코스피는 장중 2% 넘게 오르다 4,990선까지 밀린 끝에 5,018.85로 마쳤고, 원/달러 환율은 9.5원 내린 1,347.1원이었어요.",
  notice: "미국 증시는 11월 6일(금) 종가예요. 다우 종가는 대부분의 매체가 전한 51,285.73을 썼어요(파이낸셜뉴스 본문은 51,258.73). 코스피 투자자별 금액은 매체마다 차이가 커서 한국거래소 기준이라고 밝힌 핀포인트뉴스 값(외국인 6,930억 원·개인 4,887억 원 순매도, 기관 7,204억 원 순매수)으로 맞췄어요. 아시아경제는 외국인 순매도를 6,470억 원, 서울파이낸스는 6,586억 원, 이투데이는 6,925억 원으로 전했어요. 외국인 수급 그래프의 11월 9일 값은 장 마감 시점 집계이고, 11월 3일~6일 값도 저녁 집계를 찾지 못해 장 마감 집계를 그대로 썼어요. 코스피·코스닥 거래대금, 프로그램 매매, 코스피 변동성지수(VKOSPI), CNN 공포 탐욕 지수는 확인하지 못해 뺐어요. 미국 종목 등락률은 파이낸셜뉴스·프리진경제 기준이에요. 원/달러 환율은 오후 3시 30분 기준(이투데이·아시아경제)이고, 달러인덱스는 세계일보가 전한 9일 오후 3시 30분 값이에요. 국제 금은 코멕스 12월물 정산가(지디넷코리아·톱스타뉴스)예요. KRX 금 1g은 발행 시점에 9일 장 마감 값을 찾지 못해 오전 11시 11분 시세(톱스타뉴스)를, 한국금거래소 순금 1돈은 오전 11시 41분 값(톱스타뉴스)을 실었어요. 비트코인은 9일 오후 3시 59분 시세(토큰포스트, 전날 대비)예요.",

      more:"외국인은 갖고 있던 주식을 판 데 그치지 않고, 주가가 더 떨어질 것에 대비해 빌린 주식을 먼저 파는 공매도도 늘렸어요. 공매도가 가장 많았던 종목은 LG에너지솔루션(2,471억 원)이었어요. 외국인이 판 주식은 SK하이닉스(5조 4,219억 원)와 삼성전자(2조 1,943억 원)에 몰려, 지난주 코스피는 11.71% 떨어졌어요(뉴스핌).",
      why:"외국인은 코스피 대형주의 큰 주인이에요. 6일 기준 외국인 지분율은 삼성전자 45.95%, SK하이닉스 48.27%예요(노컷뉴스). 외국인이 돌아오느냐가 한국 증시 방향을 가르는 핵심 변수예요.",
      url:"https://www.newspim.com/news/view/20261109000485", src:"뉴스핌" }

    note: "<b>이 코너는 특정 상품 추천이 아니라 경제 기본 지식을 공부하는 자료예요.</b> 본문에 나오는 사이트 이름은 숫자를 직접 확인하는 방법을 설명하기 위한 예시예요.",
    intro: "지난주 외국인은 코스피에서 주식을 10조 원 넘게 팔았을 뿐 아니라, '공매도'도 5조 원 넘게 했어요. 공매도는 주가가 내릴 때 돈을 버는 방법이라 급락장 뉴스마다 등장해요. 차례로 풀어볼게요.",
    points: [
      { t:"1) 공매도가 뭐예요?", items:[
        "공매도(空賣渡)는 '없는 것을 판다'는 뜻이에요. <mark>갖고 있지 않은 주식을 빌려서 먼저 팔고, 나중에 다시 사서 갚는 거래</mark>예요.",
        "보통 투자는 '싸게 사서 비싸게 팔기'예요. 공매도는 순서를 뒤집어 '비싸게 먼저 팔고 싸게 나중에 사기'예요. 그래서 주가가 내려야 돈을 벌어요." ] },
      { t:"2) 어떻게 돈을 벌고, 어떻게 잃나요?", items:[
        "예를 들어 1주에 10만 원인 주식을 빌려 팔았다고 해 볼게요. 주가가 8만 원으로 내리면 8만 원에 사서 갚고 2만 원을 남겨요. 반대로 12만 원으로 오르면 12만 원에 사서 갚아야 해서 2만 원을 잃어요.",
        "주식을 사는 투자는 최악의 경우 산 돈만큼 잃어요. 하지만 공매도는 주가가 오르는 데 끝이 없어서 이론적으로 손실에 한계가 없어요. 빌린 주식에 대한 이자(대차 수수료)도 내야 해요." ],
        box:{ label:"숏커버링이 뭐예요?", text:"공매도한 사람은 언젠가 주식을 다시 사서 갚아야 해요. 주가가 갑자기 오르면 손실이 커질까 봐 서둘러 주식을 사들이는데, 이걸 <b>숏커버링</b>이라고 해요. 이 매수가 몰리면 주가가 더 빠르게 오르기도 해요. 6일 미국 반도체주 반등도 이런 움직임이 섞였을 수 있다는 분석이 나왔어요(연합뉴스)." } },
      { t:"3) 왜 이런 제도가 있나요?", items:[

        arrow:"공매도는 '떨어질 것'에 거는 투자예요. 많다고 꼭 떨어지는 것도, 적다고 꼭 오르는 것도 아니에요." },
      { t:"4) 요즘 왜 뉴스에 나오나요?", items:[

      { t:"5) 우리에게는 어떤 영향이 있나요?", items:[

        "공매도는 손실이 끝없이 커질 수 있어서 초보자에게는 위험이 큰 거래예요. 공매도 숫자는 '다른 투자자들이 이 종목을 어떻게 보고 있나'를 엿보는 참고 자료로 쓰는 게 좋아요." ] },

        box:{ label:"공매도 기사에서 볼 세 가지", text:"<b>누가</b>: 외국인인지 기관인지? <b>얼마나 늘었나</b>: 지난주나 평소와 비교해 늘었나 줄었나? <b>어디에</b>: 어떤 종목에 몰렸나? 오늘 기사는 '외국인이 → 한 주 전보다 11.9% 늘려 5조 3,127억 원 → LG에너지솔루션 등 2차전지·반도체 관련주에 몰렸어요'로 읽을 수 있어요." } },

      why:"유가는 물가를 거쳐 금리에 영향을 줘요. 유가가 다시 오르면 미국 연준이 금리를 올릴 이유가 커지고, 원유를 대부분 수입하는 한국은 물가와 무역수지 부담이 커져요.",
      url:"https://ajunews.com/view/20261106072236593", src:"아주경제" },
    { tag:"한국 · 금융정책", title:"코스피 서킷브레이커 '검은 금요일'…정부, 신용융자 담보비율 유지 의무 3개월 면제",
      body:"6일 코스피는 장중 8% 넘게 떨어져 오전 9시 3분 서킷브레이커가 걸렸고, 6.02% 내린 5,059.69로 마감했어요. 이형일 부총리 겸 재정경제부 장관은 관계기관 회의를 열고, 증권사의 신용융자 담보비율 140% 유지 의무를 9일부터 3개월 동안 면제하기로 했어요(아시아투데이).",
      more:"신용융자는 증권사에서 돈을 빌려 주식을 사는 거예요. 주가가 떨어져 담보로 잡힌 주식의 값이 빌린 돈의 140% 아래로 내려가면, 투자자가 돈을 더 넣지 못할 경우 증권사가 주식을 강제로 팔 수 있어요(반대매매). 급락장에서 이런 강제 매도가 쏟아지면 주가가 더 떨어지고, 그게 또 다른 강제 매도를 부르는 악순환이 생겨요. 이번 조치는 이 고리를 잠시 느슨하게 하려는 거예요.",
      why:"빚을 내 투자한 사람이 많을수록 급락장에서 하락 폭이 커질 수 있어요. 다만 담보 기준이 느슨해져도 빌린 돈과 이자는 그대로 남아요. 빚투의 위험이 사라지는 건 아니라는 점을 기억해야 해요.",
      url:"https://www.asiatoday.co.kr/kn/view.php?key=20261106010002606", src:"아시아투데이" }
  ],
  term: {
    name: "서킷브레이커, 시장 전체를 잠시 멈추는 '비상 정지 버튼' 읽는 법",
    card: { eyebrow:"경제 상식 한 조각 · 2026.11.06", title:"너무 빨리 떨어지면<br><span>시장이 잠시 멈춰요</span>", sub:"서킷브레이커가 무엇이고, 언제 걸리며, 뉴스에서 어떻게 읽는지 차례로 알아봐요",

    note: "<b>이 코너는 특정 상품 추천이 아니라 경제 기본 지식을 공부하는 자료예요.</b> 본문에 나오는 사이트 이름은 숫자를 직접 확인하는 방법을 설명하기 위한 예시예요.",
    intro: "오늘 코스피는 장이 열린 지 3분 만에 20분 동안 거래가 멈췄어요. 이렇게 지수가 너무 빨리 떨어질 때 시장 전체를 잠시 세우는 장치를 '서킷브레이커'라고 해요. 지난 호들에서 다룬 사이드카보다 한 단계 더 센 장치예요. 차례로 풀어볼게요.",
    points: [
      { t:"1) 서킷브레이커가 뭐예요?", items:[
        "서킷브레이커는 원래 전기가 너무 많이 흐를 때 자동으로 전기를 끊는 '차단기'를 뜻해요. 주식시장에서는 <mark>지수가 짧은 시간에 너무 크게 떨어질 때 시장 전체의 거래를 잠시 멈추는 제도</mark>예요.",
        "거래가 멈추면 주식을 사거나 팔 수 없어요. 코스피에 걸리면 코스피 시장 전체가, 코스닥에 걸리면 코스닥 시장 전체가 멈춰요. 오늘은 코스피에 걸렸어요." ] },
      { t:"2) 언제, 어떻게 걸리나요?", items:[
        "토스뱅크 설명에 따르면 서킷브레이커는 세 단계예요. 지수가 전날보다 8% 넘게 떨어진 상태가 1분 이어지면 1단계, 15% 넘게 떨어지고 1단계 때보다 1% 넘게 더 내리면 2단계가 걸려요. 1·2단계는 각각 20분 동안 거래가 멈췄다가 다시 열려요.",
        "20% 넘게 떨어지고 2단계 때보다 1% 넘게 더 내리면 3단계가 걸리는데, 이때는 그날 장이 바로 끝나요. 또 장이 열리고 5분이 지난 뒤부터 장 마감 40분 전까지만 걸릴 수 있어요." ],
        box:{ label:"사이드카와 무엇이 다른가요?", text:"<b>사이드카</b>는 선물 가격이 크게 움직일 때 컴퓨터가 자동으로 내는 '프로그램 매매' 주문만 5분 동안 멈춰요. 사람들의 일반 주문은 그대로 이어져요. <b>서킷브레이커</b>는 지수 자체가 8% 넘게 떨어질 때 시장 전체 거래를 20분 동안 멈춰요. 사이드카가 '경고등'이라면 서킷브레이커는 '비상 정지 버튼'에 가까워요." } },
      { t:"3) 왜 필요한가요?", items:[

        "서킷브레이커는 이 고리를 잠시 끊어 줘요. 20분 동안 뉴스를 확인하고, 정말 팔아야 하는지 차분히 생각할 시간을 주는 거예요. 오늘도 거래가 다시 열린 뒤 낙폭이 8%대에서 6%대로 줄었어요." ],
        arrow:"서킷브레이커는 하락을 막는 장치가 아니라, '생각할 시간'을 주는 장치예요." },
      { t:"4) 요즘 왜 뉴스에 나오나요?", items:[
        "오늘 코스피는 간밤 미국 반도체지수가 12% 넘게 폭락한 충격에 장 초반 8% 넘게 떨어졌고, 오전 9시 3분 1단계 서킷브레이커가 걸렸어요(뉴스핌).",
        "올해는 서킷브레이커가 자주 걸린 해예요. 파이낸셜뉴스에 따르면 미·이란 전쟁이 시작된 직후인 3월 4일에 걸렸고, 6월 8일에는 코스피와 코스닥에 모두 걸렸어요. YTN에 따르면 6월 26일에도 코스피에 걸렸어요. 그만큼 올해 시장이 크게 출렁였다는 뜻이에요." ] },
      { t:"5) 우리에게는 어떤 영향이 있나요?", items:[

        "거래가 다시 열리는 순간에는 쌓였던 주문이 한꺼번에 처리되면서 값이 크게 움직이기도 해요. 그래서 공포에 휩쓸려 거래 재개 직후 서둘러 주문을 넣기보다, 왜 시장이 멈췄는지 먼저 확인하는 게 중요해요. 특히 빚을 내 투자했다면 급락장에서 강제 매도(반대매매) 위험이 커져요." ] },
      { t:"6) 숫자와 기사는 이렇게 읽어요", items:[
        "<mark>몇 단계인지</mark>를 봐요. 대부분은 1단계예요. 2단계나 3단계가 걸렸다면 훨씬 더 심각한 상황이에요.",

        "<mark>누가 샀는지</mark>를 봐요. 오늘은 외국인이 2조 7천억 원 넘게 팔았지만 기관(1조 7,042억 원)과 개인(6,010억 원)이 받아 냈어요. 급락장에서 누가 받아 주는지가 다음 날 흐름의 실마리가 돼요." ],
        box:{ label:"서킷브레이커 기사에서 볼 세 가지", text:"<b>왜 걸렸나</b>: 해외 증시 폭락, 전쟁, 정책 같은 계기는? <b>얼마나 회복했나</b>: 장중 저점에서 종가까지 얼마나 올라왔나? <b>그다음은</b>: 외국인 매도가 줄어드는지, 정부나 한국은행이 대책을 내놓는지? 오늘은 '미국 AI 규제 걱정 → 장중 -8.78% → -6.02%로 마감, 정부는 신용융자 담보 규제를 잠시 풀어 줬어요'." } },

    { tag:"미국 · 주식", title:"美 블루웨이브에 다우 3% 급등…텍사스 '데이터센터 모라토리엄' 공약에 반도체지수 6개월 만의 최저",
      body:"4일(현지시간) 다우는 3.03% 올라 약 19개월 만에 하루 상승 폭이 가장 컸지만, 필라델피아 반도체지수는 3.13% 내려 6개월 만의 최저로 떨어졌어요. 민주당이 데이터센터가 몰린 텍사스와 조지아에서 이겼고, 텍사스 주지사 당선인이 신규 데이터센터 건설을 잠시 멈추는 모라토리엄을 공약했기 때문이에요. 데이터센터 운영사 헛8은 20% 넘게, 아이렌은 11% 넘게 떨어졌어요.",
      more:"모라토리엄은 '일시 중지'라는 뜻이에요. 데이터센터는 전기와 냉각용 물을 아주 많이 써서, 주민들 사이에서 전기요금과 물 부족 걱정이 커지고 있어요. 텍사스에는 2030년까지 계획된 미국 데이터센터 용량의 25% 이상이 몰려 있어서, 이곳에서 건설이 늦어지면 반도체·전력장비 같은 공급업체 주문에도 영향이 갈 수 있어요. 반대로 이미 데이터센터를 많이 가진 마이크로소프트·아마존은 투자 부담이 줄 수 있다는 기대에 크게 올랐어요.",
      why:"한국 증시의 대표 종목인 삼성전자·SK하이닉스는 AI 데이터센터에 들어가는 메모리를 만들어요. 미국 데이터센터 건설 속도에 대한 걱정이 곧바로 한국 증시를 흔드는 이유예요.",
      url:"https://www.kmjournal.net/news/articleView.html?idxno=14103", src:"KMJ" },
    { tag:"거시경제 · 원자재", title:"이란전 종식 기대에 국제유가 8% 넘게 급락…WTI 88달러, 두 달 만의 최저",
      body:"4일(현지시간) WTI 12월물은 8.29% 내린 배럴당 88.12달러, 브렌트유 1월물은 8.67% 내린 94.62달러로 마감했어요. 중간선거에서 공화당이 지자 이란 전쟁이 빨리 끝날 수 있다는 기대가 커졌어요. JD 밴스 부통령은 전쟁이 선거 패배의 주요 원인이었다는 취지의 글을 올렸고, 트럼프 대통령도 당장 이란을 공격할 계획은 없다고 밝혔어요.",
      more:"전쟁은 원유 공급을 막을 수 있다는 걱정 때문에 기름값에 '위험 프리미엄'을 붙여요. 전쟁이 끝날 거라는 기대가 생기면 이 프리미엄이 빠지면서 값이 빠르게 내려요. 내년 1월부터 민주당이 이끄는 의회는 법안과 예산 심사로 전쟁 정책을 압박할 수 있어요. 호르무즈 해협을 지나는 원유 운송이 정상으로 돌아갈 수 있다는 기대도 나와요(뉴데일리·연합뉴스).",
      why:"한국은 원유를 대부분 수입해요. 유가가 내리면 휘발유값과 물가 부담이 줄고, 항공·운송처럼 연료를 많이 쓰는 기업의 비용도 줄어요. 다만 전쟁이 공식적으로 끝난 건 아니라서, 소식에 따라 유가가 다시 크게 출렁일 수 있어요.",
      url:"https://www.newdaily.co.kr/site/data/html/2026/11/05/2026110500008.html", src:"뉴데일리" },
    { tag:"한국 · 주식", title:"美 블루웨이브에 AI 규제 우려 확산…코스피·코스닥 5%대 급락, 양 시장 매도 사이드카",
      body:"5일 코스피는 5.28% 내린 5,383.80, 코스닥은 5.11% 내린 678.41로 마감했어요. 외국인이 코스피에서 3조 3,928억 원을 팔았고, 삼성전자(-7.57%)와 SK하이닉스(-9.46%)가 급락했어요. 코스피는 오전 10시 16분, 코스닥은 오후 2시 27분에 매도 사이드카가 걸렸어요. 반도체에서 시작된 매도는 기판·전력장비 등 AI 공급망 전반으로 번졌어요(뉴스핌).",
      more:"매도 사이드카는 선물 값이 크게 떨어졌을 때 프로그램 매도 주문을 5분 동안 멈추는 장치예요. 선물 급락이 현물 주식의 기계적인 매도로 번지는 것을 잠시 막아 숨 고를 시간을 주는 거예요. 다만 사이드카는 하루 한 번만 걸리고, 5분이 지나면 매매는 다시 이어져요. 오늘도 사이드카 뒤에 낙폭이 더 커졌어요.",
      why:"미국 증시가 크게 오른 날에도 한국 증시는 급락할 수 있다는 걸 보여준 하루예요. 한국 증시가 반도체에 얼마나 크게 기대고 있는지, 외국인 수급이 지수를 얼마나 크게 움직이는지 다시 확인할 수 있어요.",
      url:"https://www.newspim.com/news/view/20261105001219", src:"뉴스핌" }
  ],
  term: {
    name: "순환매(섹터 로테이션), 돈이 업종 사이를 옮겨 다니는 '자리 바꾸기' 읽는 법",
    card: { eyebrow:"경제 상식 한 조각 · 2026.11.05", title:"돈은 사라지지 않고<br><span>자리를 옮겨요</span>", sub:"순환매가 무엇이고, 왜 일어나며, 뉴스에서 어떻게 읽는지 차례로 알아봐요",

    intro: "오늘 코스피는 5% 넘게 빠졌지만 카카오는 10%, NAVER는 8% 넘게 올랐어요. 미국에서도 반도체는 내렸는데 은행·소매주는 올랐어요. 이렇게 투자자들의 돈이 한 업종에서 다른 업종으로 옮겨 가는 걸 '순환매' 또는 '섹터 로테이션'이라고 불러요. 차례로 풀어볼게요.",
    points: [
      { t:"1) 순환매가 뭐예요?", items:[
        "순환매는 <mark>시장에 들어와 있는 돈이 한 업종에서 빠져나와 다른 업종으로 옮겨 가는 흐름</mark>이에요. 영어로는 섹터(업종) 로테이션(돌기)이라고 해요.",
        "주식시장 전체의 돈이 늘거나 줄지 않아도, 돈이 어디에 머무르는지에 따라 오르는 업종과 내리는 업종이 달라져요. 그래서 지수가 크게 내린 날에도 오르는 종목이 나와요." ] },
      { t:"2) 왜 생기나요?", items:[
        "업종마다 좋아하는 환경이 달라요. 금리가 내리면 빚이 많은 성장주가, 경기가 좋아지면 은행·소비주가, 유가가 내리면 항공·운송주가 유리해져요. 정책도 마찬가지예요. 어떤 산업을 지원하거나 규제하느냐에 따라 유불리가 바뀌어요.",
        "그래서 큰 뉴스가 나오면 투자자들은 '이제 어느 업종이 유리할까'를 다시 계산하고, 그 결과에 따라 돈을 옮겨요. 한 업종이 너무 많이 올라 비싸졌다고 느낄 때도 덜 오른 업종으로 돈이 옮겨 가요." ],
        box:{ label:"오늘의 순환매 한눈에 보기", text:"<b>빠져나간 곳</b>: 삼성전자(-7.57%), SK하이닉스(-9.46%), 삼성전기(-15.34%), LS ELECTRIC(-13.87%) 같은 AI 반도체·전력장비. <b>들어간 곳</b>: 카카오(+10.65%), NAVER(+8.26%), 셀트리온(+7.50%), KB금융(+3.63%), 현대차(+3.53%). 업종으로 보면 전기·전자(-8.53%)가 가장 크게 내리고 제약(+4.12%)이 가장 크게 올랐어요(파이낸셜뉴스)." } },
      { t:"3) 왜 중요한가요?", items:[
        "지수만 보면 시장 전체가 같이 움직이는 것처럼 보여요. 하지만 순환매가 일어나는 날에는 지수 아래에서 업종끼리 정반대로 움직여요. 지수 숫자만 보면 이런 흐름을 놓치기 쉬워요.",
        "또 순환매는 시장이 지금 무엇을 걱정하고 무엇을 기대하는지 보여줘요. 오늘처럼 AI 관련주가 빠지고 인터넷·바이오·금융으로 돈이 옮겨 갔다면, 시장이 'AI 투자 속도'를 걱정하고 있다는 뜻으로 읽을 수 있어요." ],
        arrow:"지수는 '시장 전체 온도', 순환매는 '돈이 어디로 움직이는지'를 알려줘요." },
      { t:"4) 요즘 왜 뉴스에 나오나요?", items:[
        "미국 중간선거에서 민주당이 의회를 가져가면서 업종별 유불리가 크게 바뀌었어요. 4일에는 태양광·2차전지가 오르고, 5일에는 반도체가 급락하는 대신 인터넷·바이오·금융이 올랐어요.",
        "센머니는 5일 오전 반도체에서 빠진 돈이 자동차·금융·바이오로 옮겨 가는 흐름을 전했어요. 미국에서도 데이터센터 관련주가 내리는 동안 은행·소매주가 오르는 비슷한 모습이 나타났어요." ] },
      { t:"5) 우리에게는 어떤 영향이 있나요?", items:[
        "한 업종에만 돈을 몰아 넣었다면, 순환매가 일어날 때 그 업종이 빠지는 충격을 고스란히 받아요. 오늘 반도체만 갖고 있었다면 지수보다 더 크게 잃었을 거예요.",

      { t:"6) 숫자와 기사는 이렇게 읽어요", items:[

        "<mark>이유</mark>를 봐요. 순환매에는 금리·유가·정책 같은 계기가 있어요. 그 계기가 하루짜리 소식인지, 오래갈 변화인지 따져 보면 흐름이 얼마나 이어질지 가늠할 수 있어요." ],
        box:{ label:"순환매 기사에서 볼 세 가지", text:"<b>어디서 빠졌나</b>: 가장 많이 내린 업종은? <b>어디로 갔나</b>: 가장 많이 오른 업종은? <b>왜 옮겼나</b>: 정책·금리·유가 가운데 무엇이 계기였나? 오늘은 '반도체·전력장비에서 빠져 인터넷·바이오·금융으로, 계기는 미국 데이터센터 규제 걱정'이었어요." } },
      { t:"7) 어디서 직접 확인할 수 있나요?", items:[

  news: [
    { tag:"미국 · 정치·경제", title:"美 중간선거 '블루 쓰나미'…민주당, 상원 53석·하원 226석으로 의회 모두 탈환",
      body:"3일(현지시간) 치러진 미국 중간선거에서 민주당이 상원과 하원을 모두 가져갔어요. 이투데이가 전한 CNN 집계(4일 오후 4시 기준)로 민주당은 상원 53석, 하원 226석을 얻어 두 곳 모두 과반을 넘겼어요. 하원은 4년 만의 탈환이에요. 텍사스 주지사 선거에서도 민주당 후보가 현직 공화당 주지사를 이겨, 36년 만에 민주당 주지사가 나왔어요.",
      more:"미국 의회는 법을 만들고 예산을 정하며 정부를 감시해요. 하원은 조사와 청문회를 열 수 있고, 상원은 대통령이 지명한 사람의 임명에 동의하는 권한이 있어요. 두 곳을 모두 야당이 가져가면 대통령이 원하는 정책을 밀어붙이기 어려워져요. 트럼프 대통령은 결과를 받아들이고 민주당과 일하겠다고 했지만, 거부권을 쓸 수 있다는 신호도 보냈어요. 남은 2년 동안 정책이 막히는 '교착 상태'가 올 수 있다는 전망도 나와요.",
      why:"의회 권력이 바뀌면 산업별로 받는 영향이 달라요. 시장은 AI·데이터센터 규제가 세질 수 있다고 걱정했고, 친환경·2차전지는 수혜를 기대했어요. 한국 증시에서 반도체와 태양광·2차전지의 희비가 갈린 이유예요.",
      url:"https://www.etoday.co.kr/news/view/2644182", src:"이투데이" },
    { tag:"미국 · 주식", title:"AMD, 3분기 데이터센터 매출 97% 급증…4분기 매출 66% 성장 전망에 시간외 8% 넘게 올라",
      body:"AMD가 3일(현지시간) 장 마감 뒤 3분기 실적을 발표했어요. 매출은 133억 7,700만 달러로 1년 전보다 45% 늘어 시장 예상(130억 9천만 달러)을 넘었고, 조정 주당순이익도 2.09달러로 예상(1.95달러)보다 높았어요. 데이터센터 매출은 85억 4,600만 달러로 97% 늘었어요. 4분기 매출은 170억 달러 안팎으로 1년 전보다 66% 늘 것으로 내다봤어요.",
      more:"데이터센터 매출이 전체에서 차지하는 몫은 1년 전 47%에서 64%로 커졌어요. AI 서버에 들어가는 GPU(인스팅트)와 서버용 CPU(에픽) 수요가 함께 늘었다는 뜻이에요. 리사 수 CEO는 두 제품에 대한 수요가 계속 강해지고 있다고 말했어요. 반면 게임용 칩 매출은 40% 줄었고, 4분기 조정 매출총이익률 전망은 55%로 3분기(56%)보다 조금 낮아요. 잘 팔리는 곳과 덜 팔리는 곳이 뚜렷하게 갈린 실적이에요.",
      why:"AI 칩을 만드는 회사의 데이터센터 매출은 빅테크가 실제로 AI에 돈을 쓰고 있는지 보여주는 숫자예요. 이 숫자가 강하면 AI 서버에 들어가는 메모리를 만드는 삼성전자·SK하이닉스에도 긍정적인 신호로 읽혀요.",
      url:"https://www.hankyung.com/article/202611044193i", src:"한국경제" },
    { tag:"한국 · 주식", title:"美 블루웨이브에 AI 관련주 흔들…한화솔루션 18%·삼성SDI 11% 등 친환경·2차전지주 강세",
      body:"4일 미국 중간선거에서 민주당 압승 흐름이 이어지자 국내 증시에서는 업종별 희비가 크게 갈렸어요. 삼성전자(-0.68%)와 SK하이닉스(-0.14%)는 장중 5~6%대까지 급락했다가 낙폭을 줄였어요. 반대로 태양광 관련주 한화솔루션(+18.64%)과 OCI홀딩스(+10.38%), 2차전지주 삼성SDI(+11.57%)와 LG에너지솔루션(+5.03%), 코스닥의 에코프로비엠(+10.96%)이 크게 올랐어요.",
      more:"주식시장에서는 정부나 의회의 정책 방향에 따라 혜택을 받을 업종이 미리 오르는 일이 많아요. 이런 종목 묶음을 흔히 '정책 수혜주'라고 불러요. 민주당은 그동안 친환경 에너지와 전기차 지원에 적극적이었기 때문에, 의회 권력이 바뀌면 이 산업에 대한 지원이 늘 수 있다는 기대가 반영됐어요. 다만 기대만으로 크게 오른 주가는 실제 정책이 나오기 전까지 출렁이기 쉬워요.",
      why:"선거 결과가 '어떤 산업에 돈이 몰릴까'에 대한 예상을 바꿔 놓은 하루예요. 지수는 0.62% 올랐지만, 업종에 따라 수익이 크게 달랐다는 점을 기억할 만해요.",
      url:"https://www.ntoday.co.kr/news/articleView.html?idxno=130609", src:"투데이신문" }
  ],
  term: {

    note: "<b>이 코너는 특정 상품 추천이 아니라 경제 기본 지식을 공부하는 자료예요.</b> 본문에 나오는 사이트 이름은 숫자를 직접 확인하는 방법을 설명하기 위한 예시예요.",
    intro: "오늘 코스피가 하루에 400포인트 넘게 오르내리는 동안, 변동성지수(VKOSPI)는 56.03까지 올랐어요. 주가지수가 '얼마인지'를 보여준다면, 변동성지수는 '얼마나 흔들릴 것 같은지'를 보여줘요. 뉴스에서 자주 '공포지수'라고 불리는 이 숫자를 차례로 풀어볼게요.",
    points: [
      { t:"1) 변동성지수가 뭐예요?", items:[
        "변동성지수는 <mark>앞으로 30일 동안 주가지수가 얼마나 크게 오르내릴지 시장이 예상하는 정도</mark>를 숫자로 나타낸 거예요. 한국은 코스피200을 바탕으로 한 VKOSPI, 미국은 S&P500을 바탕으로 한 VIX가 대표적이에요.",
        "주가가 오르든 내리든 상관없이 '움직이는 폭'을 재는 지수라서, 방향이 아니라 크기를 알려줘요. 다만 주가가 급하게 떨어질 때 불안이 커지며 숫자가 뛰는 일이 많아 '공포지수'라는 별명이 붙었어요." ] },
      { t:"2) 어떻게 계산되나요?", items:[
        "변동성지수는 옵션 가격으로 만들어요. 옵션은 '정해진 값에 사거나 팔 수 있는 권리'인데, 사람들이 앞으로 시장이 크게 흔들릴 거라고 보면 이 권리에 더 많은 돈을 내려고 해요. 그래서 옵션 값이 비싸지면 변동성지수가 올라가요.",
        "숫자는 1년 기준 %로 표시해요. 이를 한 달이나 하루 기준으로 바꾸려면 기간에 맞게 나눠 줘야 해요. 한 달은 12의 제곱근(약 3.46)으로, 하루는 거래일 수 252의 제곱근(약 15.9)으로 나누면 대략적인 크기를 알 수 있어요." ],
        box:{ label:"숫자로 보는 변동성지수", text:"VKOSPI가 <b>56</b>이면, 시장은 1년 기준으로 약 56% 출렁일 거라고 보는 거예요. 한 달로 바꾸면 56 ÷ 3.46 ≈ <b>약 16%</b>, 하루로 바꾸면 56 ÷ 15.9 ≈ <b>약 3.5%</b>예요. 즉 '앞으로 하루에 3% 넘게 오르내리는 날이 흔할 수 있다'고 보는 셈이에요. 오늘 코스피가 장중 4% 넘게 빠졌다가 되올라온 것도 이런 불안이 반영된 모습이에요." } },
      { t:"3) 왜 중요한가요?", items:[
        "변동성지수는 시장 참여자들의 불안을 한눈에 보여주는 숫자예요. 투데이신문은 VKOSPI가 20 이상이면 불안 심리, 40을 넘으면 패닉 국면으로 해석한다고 전했어요. 오늘 56.03은 그 기준으로 보면 아주 높은 수준이에요.",
        "변동성이 클 때는 하루에도 손익이 크게 바뀌어요. 그래서 빚을 내 투자했거나 짧게 사고파는 사람일수록 위험이 커져요." ],
        arrow:"주가지수는 '어디에 있나', 변동성지수는 '얼마나 흔들리나'를 알려줘요." },
      { t:"4) 요즘 왜 뉴스에 나오나요?", items:[
        "최근 코스피는 하루에 3~6%씩 오르내리는 날이 이어지고 있어요. AI 투자 걱정, 중동 전쟁과 유가, 미국 중간선거 같은 큰 변수가 한꺼번에 겹쳤기 때문이에요.",
        "오늘은 미국 중간선거 개표 결과에 따라 지수가 5,828에서 5,421까지 밀렸다가 5,683으로 마쳤어요. 이렇게 하루 안에서 크게 출렁인 날에는 VKOSPI가 함께 뉴스에 등장해요." ] },
      { t:"5) 우리에게는 어떤 영향이 있나요?", items:[

        "변동성지수가 높은 시기에 무리하게 빚을 내거나, 한 번에 큰돈을 넣었다 빼는 건 손실 위험을 키울 수 있어요. 반대로 변동성지수가 매우 낮을 때는 시장이 너무 안심하고 있다는 신호로 읽히기도 해요.",
        "변동성지수가 높다고 주가가 반드시 내리거나, 낮다고 반드시 오르는 건 아니에요. 지금 시장이 얼마나 긴장했는지를 알려주는 참고 자료로 보는 게 좋아요." ] },
      { t:"6) 숫자와 기사는 이렇게 읽어요", items:[

        "<mark>방향</mark>을 봐요. 주가가 떨어지는데 변동성지수가 오히려 내리면, 하락을 시장이 차분하게 받아들이고 있다는 뜻일 수 있어요.",
        "<mark>무엇을 바탕으로 했는지</mark> 봐요. VKOSPI는 코스피200, VIX는 S&P500을 바탕으로 해요. 미국 VIX가 낮은데 VKOSPI만 높다면 한국 시장만의 불안이 큰 거예요." ],
        box:{ label:"변동성지수 기사에서 볼 세 가지", text:"<b>몇인가</b>: 20·40 같은 기준선과 비교해 어느 수준인가요? <b>어느 쪽으로 움직였나</b>: 주가와 같은 방향인가, 반대인가요? <b>어느 시장인가</b>: 한국(VKOSPI)인가요, 미국(VIX)인가요? 오늘은 'VKOSPI 56.03, 3.61% 상승, 한국 시장'이었어요." } },

    ]

      { t:"2. 한국 증시는 이 걱정을 가장 먼저, 가장 크게 받아요", paras:[

      { t:"3. 물가와 유가는 오히려 나아졌어요, 문제는 이번 주 일정이에요", paras:[

  news: [
    { tag:"미국 · 주식", title:"오라클, AI 데이터센터에 200억 달러 조달…신주·회사채 반반에 주가 8%대 급락",
      body:"오라클이 2일(현지시간) AI 데이터센터와 클라우드 인프라를 넓히기 위해 200억 달러를 조달한다고 밝혔어요. 100억 달러는 새 주식을 발행해서, 나머지 100억 달러는 회사채를 발행해서 마련해요. 주가는 서울신문 집계로 8.85% 급락해 3거래일 연속 내렸어요. 같은 날 마벨은 광통신 장비 회사 루멘텀을 부채 포함 약 1,150억 달러에 주식으로 인수한다고 발표해 두 회사 주가가 함께 크게 내렸어요.",
      more:"투자자들이 실망한 이유는 두 가지예요. 하나는 약속이에요. 미디어펜에 따르면 오라클은 10월 28일 투자자의 날에 2030 회계연도까지 자본시장에서 추가로 조달할 돈을 200억 달러로 묶겠다고 했는데, 며칠 만에 그 한도를 한 번에 채웠어요. 다른 하나는 '희석'이에요. 오라클은 수년 동안 자사주를 사들여 주식 수를 줄여 왔는데, 새 주식을 찍으면 주식 수가 다시 늘어 한 주가 가진 몫이 작아질 수 있어요. 오라클의 잉여현금흐름은 최근 6개 분기 동안 마이너스였어요. 반면 8월 말 기준 수주잔고(앞으로 받을 계약)는 6,640억 달러로 컸어요.",
      why:"AI 투자 경쟁이 '번 돈으로 하는 투자'에서 '빌리고 새 주식을 찍어 하는 투자'로 넘어가고 있다는 신호로 읽혔어요. 이 투자가 이어지면 반도체 주문에는 좋지만, 돈을 마련하는 부담이 커질수록 투자 속도가 줄 수 있다는 걱정도 커져요. 한국 반도체주가 이 소식에 크게 흔들린 이유예요.",
      url:"https://www.mediapen.com/news/view/1134537", src:"미디어펜" },
    { tag:"세계 · 원자재", title:"미·이란 협상 기대에 국제유가 7% 넘게 급락…WTI 96달러, 브렌트유 104달러",
      body:"2일(현지시간) WTI 12월물은 7.66달러(7.36%) 내린 배럴당 96.46달러, 브렌트유 1월물은 8.66달러(7.63%) 내린 104.77달러로 마감했어요. 트럼프 대통령은 이란이 협상을 원하고 실제 대화가 가능하다고 말했고, 카타르 등 중재국은 협상의 돌파구를 찾고 있어요. 이란 아락치 외무장관은 중재국들이 이란이 9월 유엔총회에서 낸 제안을 논의하고 있다고 밝혔어요.",
      more:"이란은 미국에 제재 해제, 중동 지역 미군 규모 축소, 해상 봉쇄 해제를 요구하고 있어요. 루비오 국무장관은 트럼프 대통령이 외교적 해결을 선호하지만, 필요하면 군사적으로 대응할 능력이 있다고 말했어요. 이란 최고지도자 모즈타바 하메네이도 10월 31일 군에 위협이 있으면 즉각 대응하라고 지시했어요. 뉴스웨이에 따르면 유가는 10월 한 달 동안 10% 넘게 올랐는데, 협상 기대 하나로 하루 만에 크게 내린 거예요. 그만큼 지금 유가에는 '전쟁 걱정' 값이 많이 붙어 있다는 뜻이에요.",
      why:"유가는 휘발유값과 물류비를 거쳐 물가를 움직이고, 물가는 중앙은행의 금리 결정으로 이어져요. 원유를 모두 수입하는 한국은 유가가 내리면 무역수지와 물가에 도움이 돼요. 다만 협상이 깨지면 유가가 다시 급등할 수 있어 뉴스 하나하나에 크게 흔들릴 수 있어요.",
      url:"https://newsway.co.kr/news/view?ud=2026110310462662023", src:"뉴스웨이" },
    { tag:"한국 · 경제", title:"10월 소비자물가 2.8% 올라 두 달 연속 둔화…채소는 11% 내렸지만 가공식품·석유류는 고공행진",
      body:"국가데이터처가 3일 발표한 10월 소비자물가는 1년 전보다 2.8% 올라 9월(2.9%)보다 조금 낮아졌어요. 두 달 연속 오름폭이 줄었어요. 날씨가 좋아 수확이 늘면서 채소값이 11.2% 내렸고, 상추(-44.3%)와 오이(-39.5%) 같은 품목이 크게 내렸어요. 반면 석유류는 14.9% 올라 전체 물가를 0.56%포인트 끌어올렸고, 가공식품(2.9%)은 11개월 만에 가장 많이 올랐어요.",
      more:"물가의 기본 흐름을 보여주는 근원물가(식료품·에너지 제외)는 2.8%로 9월과 같았어요. 출렁이는 값을 빼고 봐도 물가가 2%대 후반에 머물러 있다는 뜻이에요. 외식(2.9%)과 축산물(4.8%), 수산물(5.4%)도 오름폭이 커졌어요. 경유(19.7%)와 휘발유(11.6%)가 크게 올랐고, 가격 상한이 적용되지 않는 LPG도 크게 올랐어요. 휴대전화(10.8%)와 컴퓨터(26.2%) 같은 전자제품과 국제선 항공료(20.7%)도 많이 올랐어요.",
      why:"물가는 한국은행이 금리를 정할 때 가장 중요하게 보는 숫자예요. 전체 물가는 조금 낮아졌지만 근원물가가 그대로라, 금리를 쉽게 내리기는 어려운 상황이에요. 2일 국제 유가가 크게 떨어진 만큼 다음 달 석유류 물가가 얼마나 내려올지도 지켜볼 점이에요.",
      url:"https://www.newspim.com/news/view/20261103000181", src:"뉴스핌" }

  term: {

    intro: "오라클이 200억 달러 가운데 100억 달러를 새 주식을 발행해서 마련하겠다고 하자 주가가 8% 넘게 떨어졌어요. 회사로 돈이 들어오는데 왜 주가는 떨어졌을까요? '유상증자'와 '주식 희석'을 차례로 풀어볼게요.",
    points: [

      { t:"2) 어떻게 움직이나요?", items:[

        box:{ label:"숫자로 보는 희석", text:"한 해 순이익이 <b>100억 원</b>, 주식이 <b>1억 주</b>인 회사가 있어요. EPS는 <b>100원</b>이에요. 이 회사가 새 주식 <b>2,500만 주</b>를 발행하면 전체 주식은 1억 2,500만 주가 돼요. 이익이 그대로 100억 원이면 EPS는 <b>80원</b>으로 20% 줄어요. 새로 들어온 돈으로 이익을 125억 원 넘게 만들어야 EPS가 원래대로 돌아와요." } },

        arrow:"유상증자 뉴스를 보면 '몇 주를, 얼마에, 무엇에 쓰려고' 찍는지를 먼저 확인해요." },
      { t:"4) 요즘 왜 뉴스에 나오나요?", items:[

  comment: {
    quote: "미국에서는 '메모리가 너무 비싸다'는 게 악재였지만, 한국에서는 '메모리 값을 우리가 정한다'는 신호로 읽힌 하루였어요",
    intro: "금요일 밤 뉴욕은 무너졌는데 월요일 코스피는 2% 넘게 올랐어요. 같은 뉴스가 어떻게 다르게 읽혔는지 세 가지로 나눠 볼게요.",
    points: [
      { t:"1. 인텔 쇼크의 다른 얼굴은 '메모리 가격 결정력'이에요", paras:[
        "인텔이 무너진 이유 가운데 하나는 메모리값이에요. 메모리 회사들이 AI용 고대역폭메모리(HBM)에 생산을 몰아주면서 PC용 메모리가 귀해지고 비싸졌고, PC값이 오르자 인텔 칩을 쓰는 PC가 덜 팔렸어요. 미국 증시는 이걸 'AI 투자 거품'과 'PC 수요 감소'라는 악재로 받아들였어요.",
        "한국에서는 같은 이야기가 다르게 읽혔어요. 메모리를 만드는 삼성전자·SK하이닉스가 값을 올릴 힘을 갖고 있다는 뜻이기도 하기 때문이에요. 마침 1일 발표된 10월 반도체 수출은 564억 4천만 달러로 역대 두 번째로 많았어요. 다만 PC·스마트폰 수요가 줄면 결국 메모리 주문에도 영향을 줄 수 있어서, 이 해석이 계속 맞을지는 지켜봐야 해요." ] },
      { t:"2. 기관이 받친 반등, 돈은 조선·방산·전력으로도 흘렀어요", paras:[
        "오늘 반등의 주인공은 기관이에요. 장 초반 지수가 5,600선에 가까워지자 금융투자와 연기금, 기타법인이 사들이기 시작했어요. 신한투자증권 강진혁 선임연구원은 이 매수세가 지수를 받쳤고, 조선·방산·전력 인프라 업종으로도 싸게 사려는 돈이 번졌다고 봤어요.",
        "다만 외국인은 이틀 연속 팔았고, 개인도 1조 3천억 원 넘게 팔아 차익을 챙겼어요. 기관 매수가 금융투자 중심이었다는 점에서, 이 힘이 며칠 이어질지는 아직 알 수 없어요. 파이낸셜포스트는 AMD 실적과 미국 중간선거 개표가 겹치는 4일을 기관 매수가 이어질지 가늠할 첫 분기점으로 꼽았어요." ] },
      { t:"3. 수출은 1조 달러를 앞뒀지만, 이번 주는 일정이 빽빽해요", paras:[
        "10월 수출은 1년 전보다 93.7% 늘어난 1,152억 8천만 달러였고, 1~10월 누적은 9,300억 달러를 넘었어요. 정부는 11월 안에 사상 처음 연간 수출 1조 달러를 넘을 것으로 봤어요. 실물 경기가 받쳐 준다는 점은 주가가 크게 흔들릴 때 버팀목이 될 수 있어요.",
        "그래도 바깥 변수가 많아요. 3일 미국 중간선거, 6일 10월 고용보고서가 이어지고, 국제 유가는 브렌트유 기준 6개월 만에 가장 높아요. 원/달러 환율이 하루에 9.5원 오른 것도 선거를 앞둔 조심스러운 분위기를 보여 줘요. 큰 일정을 앞두고는 지수가 위아래로 크게 흔들릴 수 있다는 점을 염두에 두면 좋아요." ] }
    ]

  news: [
    { tag:"미국 · 주식", title:"인텔 하루 28% 폭락…4분기 매출 전망 예상 밑돌고 PC 칩 매출 5% 줄어",
      body:"인텔 주가가 30일(현지시간) 28.58% 폭락했어요. 서울경제에 따르면 장중 낙폭은 30%를 넘어 상장 뒤 가장 컸어요. 3분기 매출은 165억 1천만 달러로 1년 전보다 21% 늘어 예상에 맞았고, 주당순이익(52센트)은 예상(41센트)을 넘었어요. 데이터센터·AI 사업(73억 달러, 78% 증가)과 파운드리(67억 달러, 58% 증가)도 크게 컸어요. 하지만 4분기 매출 전망을 150억~160억 달러로 내놔 시장 예상(171억 달러)을 크게 밑돌았어요.",
      more:"시장이 놀란 건 본업인 PC용 칩이에요. 클라이언트 사업 매출이 81억 달러로 5% 줄었고, 올해 PC 시장이 12%, 내년에 10% 더 줄 것이라는 전망도 나왔어요. 블룸버그통신은 메모리 회사들이 AI용 HBM 생산에 집중하면서 PC용 메모리값이 오르고, 그 탓에 노트북·데스크톱값이 올라 인텔 칩 수요가 줄었다고 분석했어요. 인텔 주가는 실적 발표 전까지 올해 150% 가까이 올라 있었는데, 기대가 컸던 만큼 실망도 컸어요. 인텔의 최대주주인 미국 정부의 지분(10%) 가치는 하루 만에 약 120억 달러 줄었어요.",
      why:"PC용 메모리값이 오른다는 건 메모리를 파는 삼성전자·SK하이닉스에는 가격 결정력이 있다는 뜻이에요. 하지만 메모리값이 너무 올라 PC가 덜 팔리면 결국 메모리 수요도 줄 수 있어요. 반도체 주식을 볼 때 '값'과 '수요'를 함께 봐야 하는 이유예요.",
      url:"https://m.sedaily.com/article/20108553", src:"서울경제" },
    { tag:"한국 · 경제", title:"10월 수출 1,153억 달러로 93.7% 증가…반도체 564억 달러, 연간 1조 달러 눈앞",
      body:"산업통상부가 1일 발표한 10월 수출은 1,152억 8천만 달러로 1년 전보다 93.7% 늘었어요. 두 달 연속 1,100억 달러를 넘었고, 수입(727억 8천만 달러)을 빼면 무역수지는 425억 달러 흑자였어요. 반도체 수출은 564억 4천만 달러로 259.4% 늘어 역대 두 번째로 많았어요. 20대 주력 품목 가운데 18개가 늘었고, 자동차(65억 5천만 달러, 18.1% 증가)는 10월 기준 역대 최대였어요.",
      more:"AI 서버 투자로 컴퓨터(서버용 SSD 포함) 수출이 496.6% 늘었고, 전기기기(74.0% 증가)는 월 기준 역대 최대였어요. 반면 선박은 지난해 해양플랜트 수출이 컸던 탓에 43.6% 줄었어요. 석유제품(80.0%)과 석유화학(27.5%)은 금액이 크게 늘었지만 물량은 각각 7.5%, 6.8% 줄었어요. 값이 올라 금액이 커진 거예요. 1~10월 누적 수출은 9,300억 달러로 처음 9,000억 달러를 넘었고, 김정관 산업통상부 장관은 11월 중 연간 1조 달러 달성이 확실하다고 밝혔어요.",
      why:"수출은 한국 경제 성장과 기업 이익의 큰 축이에요. 특히 반도체 수출이 이렇게 많다는 건 미국 빅테크의 AI 투자가 아직 한국 반도체 주문으로 이어지고 있다는 숫자예요. 오늘 국내 반도체주가 미국과 달리 오를 수 있었던 배경 가운데 하나예요.",
      url:"https://www.newspim.com/news/view/20261031000112", src:"뉴스핌" },
    { tag:"세계 · 원자재", title:"호르무즈 유조선 공격·리비아 송유관 차질에 브렌트유 117달러, 6개월 만에 최고",
      body:"30일(현지시간) 브렌트유 12월물은 2.40% 오른 배럴당 117.64달러로 4월 29일 이후 가장 높았고, WTI 12월물은 2.08% 오른 104.12달러로 9월 15일 이후 가장 높았어요. 이란 혁명수비대는 호르무즈 해협에서 유조선 3척이 폭발했다고 주장했고, 영국 해사무역기구는 소형 선박의 폭발물 공격을 확인했어요. 리비아 국영석유공사는 무장단체가 송유관 밸브를 잠갔다고 밝혔어요.",
      more:"호르무즈 해협은 중동산 원유가 바다로 나가는 가장 중요한 길목이에요. 이 길이 불안해지면 원유가 제때 오지 못할 수 있다는 걱정에 값이 뛰어요. 여기에 미국이 3일 중간선거 뒤 이란에 대한 군사작전을 다시 시작할 수 있다는 경계감도 더해졌어요. WTI는 10월 한 달 동안 15.2% 올라 4개월 연속 올랐어요. UBS의 조반니 스타우노보는 공급 차질이 이어질 수 있다고 봤어요.",
      why:"유가가 오르면 휘발유값·물류비가 올라 물가를 다시 밀어 올려요. 물가가 오르면 연준이 금리를 더 올릴 수 있고, 이는 주식과 금값에도 부담이 돼요. 원유를 모두 수입하는 한국은 유가가 오르면 무역수지와 환율에도 영향을 받아요.",
      url:"https://www.newsis.com/view/NISX20261031_0003849143", src:"뉴시스" }
  ],
  term: {
    name: "기저효과, 작년 숫자가 올해 증가율을 부풀리거나 깎는 '출발선' 읽는 법",
    card: { eyebrow:"경제 상식 한 조각 · 2026.11.02", title:"수출이 이렇게 좋은데<br><span>선박은 왜 43.6% 줄었을까</span>", sub:"'1년 전보다 몇 %'라는 숫자를 바르게 읽는 순서",
      steps: [ { k:"출발선 확인", x:"견주는 기준(작년 같은 달)이 유난히 크거나 작지 않았는지 봐요" }, { k:"증가율 계산", x:"올해 숫자를 작년 숫자로 나눠 몇 % 늘었는지 구해요" }, { k:"특별한 일 찾기", x:"작년이나 올해에 한 번뿐인 큰 일이 있었는지 확인해요" }, { k:"금액·물량 같이 보기", x:"증가율 말고 실제 크기와 물량도 함께 봐요" } ] },
    note: "<b>이 코너는 특정 상품 추천이 아니라 경제 기본 지식을 공부하는 자료예요.</b> 본문에 나오는 사이트 이름은 숫자를 직접 확인하는 방법을 설명하기 위한 예시예요.",
    intro: "1일 나온 10월 수출입동향에서 수출은 93.7% 늘었는데, 선박 수출은 43.6% 줄었어요. 정부는 선박이 줄어든 이유를 '기저효과'라고 설명했어요. 뉴스에 자주 나오는 이 말이 무엇인지 차례로 풀어볼게요.",
    points: [
      { t:"1) 기저효과가 뭐예요?", items:[
        "기저효과는 <mark>비교하는 기준 시점의 숫자가 너무 크거나 작아서, 지금 숫자의 증가율이 실제보다 나빠 보이거나 좋아 보이는 현상</mark>이에요. '기저'는 밑바탕, 즉 출발선이라는 뜻이에요.",
        "달리기에 비유하면 쉬워요. 작년에 다리를 다쳐 느리게 뛰었다면, 올해 보통 속도로만 뛰어도 '기록이 크게 좋아졌다'고 나와요. 반대로 작년에 인생 최고 기록을 냈다면 올해 잘 뛰어도 '기록이 나빠졌다'고 나와요." ] },
      { t:"2) 어떻게 생기나요?", items:[

        "이번 선박 수출이 대표적이에요. 산업통상부는 지난해 10월 해양플랜트(바다 위 원유 생산 설비) 수출이 컸던 탓에 올해 10월 선박 수출이 26억 4천만 달러로 43.6% 줄었다고 설명했어요. 배를 덜 만들었다기보다 작년 출발선이 높았던 거예요." ],
        box:{ label:"같은 100인데 증가율은 다르게", text:"올해 10월 수출이 <b>100</b>이라고 해 볼게요. 작년 10월이 100이었다면 증가율은 <b>0%</b>예요. 작년 10월에 특별한 일로 200이었다면 <b>50% 감소</b>, 작년에 휴일이 많아 50이었다면 <b>100% 증가</b>가 돼요. 올해 숫자는 똑같은데 출발선에 따라 '반 토막'도 되고 '두 배'도 되는 거예요." } },

  news: [
    { tag:"미국 · 주식", title:"아마존 3분기 매출·이익 예상 밑돌아…AWS 39% 성장에도 잉여현금흐름 3분기 연속 적자",
      body:"아마존이 29일(현지시간) 장 마감 뒤 발표한 3분기 매출은 2,019억 4천만 달러로 1년 전보다 12% 늘었지만 시장 예상(2,023억 1천만 달러)에 조금 못 미쳤어요. 주당순이익은 1.89달러로 예상(1.96달러)과 1년 전(1.95달러)보다 낮았어요. 클라우드 AWS 매출은 459억 8천만 달러로 39% 늘어 예상을 넘었지만, 광고 매출(196억 4천만 달러)은 예상(208억 2천만 달러)에 못 미쳤어요. 4분기 매출 전망은 2,400억~2,470억 달러였어요. 주가는 정규장에서 4.25% 내린 243.79달러로 마쳤고, 시간외에서 6%대 더 내렸어요.",

    { tag:"미국 · 경제", title:"미국 3분기 성장률 연율 3.4%로 예상 웃돌아…9월 PCE 물가는 3.6%로 높아져",
      body:"미국의 3분기 실질 국내총생산(GDP)이 연율 3.4% 늘어 시장 예상(3.2%)과 2분기(2.2%)를 넘었어요. GDP의 약 3분의 2를 차지하는 개인 소비가 연율 3.8% 늘었고, 기업 설비투자는 12.7% 늘어 2020년 이후 가장 빨랐어요. 정보 처리 장비와 산업 장비 투자가 크게 늘었어요. 반면 데이터센터 장비 수입이 늘면서 무역적자가 성장률을 3.3%포인트 깎았어요.",

    { tag:"한국 · 경제", title:"9월 생산·소비·투자 모두 늘어…전산업생산 3.0%, 15년 6개월 만에 최대 증가",
      body:"국가데이터처가 30일 발표한 9월 산업활동동향에서 전산업생산은 앞 달보다 3.0% 늘었어요. 2011년 3월(3.4%) 이후 가장 많이 늘었어요. 광공업 생산이 9.0% 늘었는데, 반도체가 19.2%, 자동차가 39.9% 늘었어요. 소매판매는 3.6% 늘어 3년 7개월 만에 가장 많이 늘었고, 설비투자는 5.3%, 건설기성은 5.8% 늘었어요. 생산·소비·투자가 한꺼번에 늘어난 '트리플 증가'예요.",
      more:"자동차 생산이 크게 는 건 여름휴가가 끝나고 파업이 마무리된 영향이 컸어요. 국가데이터처 이두원 경제동향통계심의관은 이 덕분에 제조업 생산이 크게 늘었다고 설명했어요. 승용차 판매도 8월에 13.3% 줄었다가 9월에 18.3% 늘었어요. 다만 앞으로의 경기를 미리 보여주는 선행종합지수 순환변동치는 0.1포인트 내렸어요. 코스피와 장단기 금리차가 내려간 영향이에요. 지금 경기를 보여주는 동행종합지수 순환변동치는 0.5포인트 올랐어요.",
      why:"한 달 숫자는 휴가·파업 같은 일시적인 일로 크게 출렁일 수 있어요. 그래서 앞 달 감소의 되돌림인지, 흐름이 좋아진 건지 함께 따져 봐야 해요. 반도체 생산이 크게 늘었다는 점은 오늘 주가 하락과 달리 실물 경기는 아직 반도체가 끌고 있다는 신호예요.",
      url:"https://www.ajunews.com/view/20261030090004660", src:"아주경제" }
  ],
  term: {
    name: "연율 성장률, 미국 GDP가 한국보다 '커 보이는' 이유 읽는 법",
    card: { eyebrow:"경제 상식 한 조각 · 2026.10.30", title:"같은 석 달 성적인데<br><span>왜 미국은 3.4%라고 할까</span>", sub:"한 분기 성장률을 1년 속도로 바꾸는 순서",
      steps: [ { k:"한 분기 성장", x:"석 달 동안 경제가 앞 분기보다 얼마나 커졌는지 재요" }, { k:"1년 속도로 환산", x:"이 속도가 1년 내내 이어진다고 가정해 네 번 곱해요" }, { k:"연율 발표", x:"미국은 이렇게 바꾼 숫자를 대표 숫자로 발표해요" }, { k:"비교 주의", x:"한국은 앞 분기 대비 숫자를 주로 써서 그대로 견주면 안 돼요" } ] },
    note: "<b>이 코너는 특정 상품 추천이 아니라 경제 기본 지식을 공부하는 자료예요.</b> 본문에 나오는 사이트 이름은 숫자를 직접 확인하는 방법을 설명하기 위한 예시예요.",
    intro: "29일 미국 3분기 성장률이 '연율 3.4%'로 나왔어요. 지난 27일 나온 한국 3분기 성장률은 1.0%였어요. 숫자만 보면 미국이 세 배 넘게 빨리 큰 것 같지만, 두 숫자는 재는 방법이 달라요. 기사마다 나오는 '연율'이 무엇인지 차례로 풀어볼게요.",
    points: [
      { t:"1) 연율 성장률이 뭐예요?", items:[
        "연율(연간 환산율)은 <mark>한 분기(석 달) 동안의 성장 속도가 1년 내내 이어진다고 가정해 바꾼 숫자</mark>예요. 자동차 계기판의 '시속'과 비슷해요. 10분 동안 달린 거리를 보고 '이 속도로 1시간을 달리면 몇 km'라고 말하는 것처럼요.",
        "계산은 앞 분기보다 커진 비율을 네 번 곱하는 방식이에요. 앞 분기보다 1% 컸다면 1.01을 네 번 곱해 약 1.0406, 즉 연율 약 4.06%가 돼요." ] },
      { t:"2) 나라마다 왜 다르게 발표하나요?", items:[
        "미국은 오래전부터 연율을 대표 숫자로 써요. 경제가 1년에 얼마나 커지는 속도인지 한눈에 보여 주고, 연간 목표나 금리와 견주기 쉽다는 이유예요.",
        "한국과 유럽은 주로 <mark>앞 분기 대비(전기 대비) 성장률</mark>을 대표 숫자로 발표해요. 그래서 같은 석 달 성적이라도 미국 기사에는 큰 숫자가, 한국 기사에는 작은 숫자가 나와요." ],
        box:{ label:"미국 3.4%와 한국 1.0%를 같은 자로 재면", text:"미국 연율 3.4%를 앞 분기 대비로 바꾸면 약 <b>0.84%</b>예요(1.034의 네제곱근). 반대로 한국 앞 분기 대비 1.0%를 연율로 바꾸면 약 <b>4.06%</b>예요. 같은 자로 재면 이번 3분기에는 오히려 한국의 성장 속도가 더 빨랐던 셈이에요. 기사 숫자를 견줄 때는 '연율인지, 앞 분기 대비인지'부터 확인하세요." } },
      { t:"3) 왜 중요한가요?", items:[
        "성장률은 경제의 체력을 보여 주는 대표 숫자예요. 중앙은행은 이 숫자를 보고 경기가 너무 뜨거운지, 식는지 판단해 금리를 정해요.",
        "단위를 착각하면 해석이 완전히 달라져요. 미국 0.84%를 '한국보다 느리다'고 보거나, 미국 3.4%를 '한국보다 세 배 빠르다'고 보는 실수가 대표적이에요." ],
        arrow:"연율은 '속도', 전기 대비는 '실제로 간 거리'에 가까워요. 비교할 땐 단위를 맞추는 게 먼저예요." },
      { t:"4) 요즘 왜 뉴스에 나오나요?", items:[
        "29일 나온 미국 3분기 성장률이 연율 3.4%로 예상(3.2%)과 2분기(2.2%)를 넘으면서 크게 보도됐어요. 개인 소비가 연율 3.8%, 기업 설비투자가 연율 12.7% 늘었다는 숫자도 모두 연율이에요.",
        "연준이 12월에 금리를 더 올릴지 따지는 지금, 성장률이 높게 나오면 '경제가 강하니 금리를 올려도 버틴다'는 쪽에 힘이 실려요. 같은 날 9월 PCE 물가도 3.6%로 높아져 두 숫자가 함께 주목받았어요." ] },
      { t:"5) 우리에게는 어떤 영향이 있나요?", items:[
        "미국 경제가 강하다는 숫자는 미국 금리가 높게 오래 머물 수 있다는 뜻으로 읽혀요. 그러면 달러가 강해지기 쉽고, 원/달러 환율과 우리 대출 금리에도 영향을 줘요.",
        "미국 소비와 투자가 강하면 한국의 대미 수출에는 좋은 소식이에요. 이번 미국 성장에서도 데이터센터 장비 투자가 큰 몫을 했는데, 그 안에는 한국산 메모리 반도체도 들어가요.",
        "해외 주식이나 펀드를 볼 때도 도움이 돼요. 나라별 성장률을 비교하는 자료가 어떤 기준을 썼는지 알면, 숫자에 휘둘리지 않고 스스로 판단할 수 있어요." ] },
      { t:"6) 숫자와 기사는 이렇게 읽어요", items:[
        "<mark>기준</mark>을 먼저 봐요. '연율', '전기 대비', '전년 동기 대비' 가운데 무엇인지 확인해요. 전년 동기 대비는 1년 전 같은 분기와 견준 숫자라 또 달라요.",
        "<mark>몇 번째 발표</mark>인지 봐요. 미국 GDP는 속보치, 잠정치, 확정치 순서로 세 번 나오고 그때마다 숫자가 바뀔 수 있어요. 이번 3.4%는 첫 번째인 속보치예요.",
        "<mark>무엇이 끌어올렸나</mark>를 봐요. 소비, 투자, 정부 지출, 순수출 가운데 어디서 성장이 나왔는지 보면 숫자의 질을 알 수 있어요. 이번에는 투자가 크게 늘었지만 수입이 늘어 순수출은 성장률을 3.3%포인트 깎았어요." ],
        box:{ label:"성장률 기사에서 볼 세 가지", text:"<b>기준</b>: 연율인가요, 전기 대비인가요? <b>순서</b>: 속보치인가요, 확정치인가요? <b>내용</b>: 소비·투자·순수출 가운데 무엇이 끌어올렸나요? 이번 미국 3분기는 '연율 3.4%', '속보치', '소비 3.8%·설비투자 12.7%가 끌고 순수출은 3.3%포인트 깎음'이었어요." } },
      { t:"7) 어디서 직접 확인할 수 있나요?", items:[
        "<b>미국 GDP</b>: 미국 경제분석국(BEA) 누리집에서 분기별 GDP 발표 자료와 다음 발표 일정을 볼 수 있어요. <a href='https://www.bea.gov' target='_blank' rel='noopener'>bea.gov →</a>",
        "<b>한국 GDP</b>: 한국은행 경제통계시스템(ECOS)에서 '국내총생산'을 검색하면 앞 분기 대비·전년 동기 대비 성장률을 모두 찾아볼 수 있어요. <a href='https://ecos.bok.or.kr' target='_blank' rel='noopener'>ecos.bok.or.kr →</a>" ],
        arrow:"나라별 성장률을 견줄 때는 숫자 크기보다 '어떤 자로 쟀는지'부터 확인해 보세요." }
    ]

        "숫자 자체에도 작은 실망이 섞였어요. 영업이익 107조 원은 이미 8일 잠정실적으로 알려진 숫자였고, 반도체 부문 영업이익(106조 5천억 원)은 일부가 기대한 110조 원 안팎에 조금 못 미쳤어요. 전날 9% 넘게 오른 뒤라 차익을 챙기려는 매물도 많았어요. 다만 삼성전자는 내년 HBM이 이미 다 팔렸고 2027년 공급 부족이 올해보다 심할 것으로 봤다는 점도 함께 기억해 둘 만해요." ] },
      { t:"2. AI에 쓰는 돈, '현금이 남느냐'가 주가를 갈랐어요", paras:[
        "마이크로소프트와 알파벳은 둘 다 클라우드가 빠르게 컸어요. 애저는 48%, 구글 클라우드는 103% 늘었어요. 그런데 시간외 주가는 마이크로소프트가 3% 안팎 오르고 알파벳은 10% 안팎 빠졌어요. 갈림길은 잉여현금흐름이었어요. 마이크로소프트는 투자하고도 186억 달러가 남았지만, 알파벳은 설비투자(513억 달러)가 영업으로 번 현금(423억 달러)보다 많아 90억 달러 넘게 모자랐어요.",
        "지난주 메타의 현금흐름 적자, 이번 주 오라클의 '외부 조달 200억 달러 상한' 약속과 같은 흐름이에요. 시장은 AI에 큰돈을 쓰는 것 자체보다, 그 돈을 스스로 벌어서 감당할 수 있는지를 따지고 있어요. 삼성전자와 SK하이닉스의 메모리 주문은 이 회사들의 설비투자에서 나오기 때문에, 빅테크의 현금 사정은 한국 반도체에도 중요한 숫자예요." ] },
      { t:"3. '애매한 동결' 뒤에 남은 숙제는 물가예요", paras:[
        "연준은 금리를 그대로 뒀지만 두 위원이 인상을 주장했고, 12월 인상 가능성은 80%대 후반으로 올라갔어요. 단기 금리는 내리고 장기 금리는 5%를 넘게 올라, 시장은 '12월이 마지막 인상일 수 있지만 금리는 오래 높을 것'으로 읽었어요. 원/달러 환율은 0.9원 내려 1,336.8원으로 비교적 차분했어요.",
        "오늘 밤 9시 30분(한국 시간)에는 미국 3분기 성장률과 연준이 가장 중요하게 보는 9월 PCE 물가가 함께 나와요. 8월 PCE 물가는 1년 전보다 3.4% 올랐어요. 숫자가 예상보다 높으면 12월 인상 쪽으로 더 기울 수 있어요. 30일에는 일본은행 금리 결정이, 11월 3일에는 중간선거가 이어져 바깥 변수가 많은 한 주의 끝자락이에요." ] }
    ]

  news: [
    { tag:"한국 · 기업", title:"삼성전자 3분기 영업이익 107조 4,405억 원 확정…배당 30조 원, 남은 주주환원 55조~75조 원은 내년 1월 결정",
      body:"삼성전자가 29일 발표한 3분기 확정 실적에서 매출은 195조 2,532억 원, 영업이익은 107조 4,405억 원, 순이익은 75조 1,361억 원이었어요. 1년 전보다 매출은 126.9%, 영업이익은 783.1% 늘었고, 매출과 영업이익 모두 4분기 연속 사상 최대예요. 반도체(DS) 부문이 영업이익 106조 5천억 원을 냈고, 그 가운데 메모리 매출은 140조 7천억 원으로 앞 분기보다 16% 늘었어요. 스마트폰·가전(DX) 부문은 8천억 원 적자였어요. 회사는 2027년 메모리 공급 부족이 올해보다 심할 것으로 보고, 내년에 HBM4 판매를 늘리고 HBM4E 양산을 시작하겠다고 했어요.",
      more:"주주에게 돌려줄 돈도 내놨어요. 3분기 현금배당은 보통주와 우선주 모두 주당 4,601원, 총 30조 원이에요. 올해 전체 주주환원 목표는 90조~110조 원인데, 이미 실행했거나 정한 35조 원을 빼면 55조~75조 원이 남아요. 이 돈은 현금배당과 자사주 매입·소각에 쓰고 우선주 매입 비중을 늘리겠다고 했지만, 구체적인 규모와 방식은 내년 1월 말 이사회에서 정해요. 한국경제에 따르면 원화 강세로 앞 분기보다 영업이익이 약 10조 원 줄어드는 효과도 있었어요. 올해 설비투자는 84조 4천억 원으로, 그 가운데 반도체에 76조 8천억 원을 써요.",
      why:"삼성전자는 코스피에서 시가총액이 가장 큰 종목이라, 이 회사의 주가가 지수를 크게 움직여요. 오늘 코스피 하락의 상당 부분이 삼성전자에서 나왔어요. 남은 주주환원 규모가 1월에 어떻게 정해지는지에 따라 주가와 외국인 수급이 다시 움직일 수 있어요.",
      url:"https://www.hankyung.com/article/202610292686g", src:"한국경제" },
    { tag:"거시경제 · 금리", title:"미국 연준, 기준금리 연 3.75~4.00% 동결…10대 2, 두 위원은 '인상' 주장",
      body:"미국 연준이 28일(현지시간) 연방공개시장위원회(FOMC)에서 기준금리를 연 3.75~4.00%로 그대로 뒀어요. 9월 16일 0.25%포인트 올린 뒤 이번에는 쉬어 갔어요. 투표권을 가진 12명 가운데 10명이 찬성했고, 리사 쿡 이사와 베스 해맥 클리블랜드 연은 총재는 0.25%포인트 인상을 주장하며 반대했어요. 성명은 경제 활동 평가를 9월의 '탄탄하다(solid)'에서 '강하다(strong)'로 올렸고, 물가를 2%로 되돌리려면 더 많은 정보를 모으는 게 도움이 된다고 적었어요.",
      more:"워시 의장은 9월 인상이 의도대로 작동했다면서도 물가가 여전히 너무 높다고 했고, 12월 결정에 대한 뚜렷한 신호는 주지 않았어요. 또 내년 정례회의를 8번에서 7번으로, 2028년에는 6번으로 줄이겠다고 밝혔어요. 회의 사이에 경제 지표를 더 모아 보겠다는 뜻이에요. 파이낸셜뉴스가 전한 CME 페드워치 기준 12월 인상 가능성은 하루 새 78.3%에서 87.9%로 올랐어요. 한국경제는 그동안 반대표를 낸 적 없던 쿡 이사의 반대가 의외라는 평가와 함께, 시장이 정책결정문은 매파적이지만 방법은 빠진 '애매한 동결'로 받아들였다고 전했어요.",
      why:"미국 기준금리는 세계 금리와 달러의 방향을 정해요. 인상을 주장한 반대표가 나오면서 12월에 한 번 더 올릴 거라는 예상이 커졌고, 미국 장기 금리가 5%를 넘으면 외국인 자금 흐름과 원/달러 환율, 대출 금리에도 영향을 줄 수 있어요.",
      url:"https://www.fnnews.com/news/202610290325510172", src:"파이낸셜뉴스" },
    { tag:"미국 · 주식", title:"클라우드는 둘 다 컸는데…마이크로소프트 '현금 넉넉', 알파벳 '현금 적자'에 시간외 희비",
      body:"28일(현지시간) 장 마감 뒤 마이크로소프트와 알파벳이 실적을 냈어요. 마이크로소프트는 7~9월 매출 923억 달러로 1년 전보다 19% 늘었고, 애저 매출은 331억 6,500만 달러로 48% 늘었어요. 잉여현금흐름은 186억 3,300만 달러로 시장 예상(85억 4,000만 달러)을 크게 넘었고, 다음 분기 애저 성장률을 49~50%로 내다봤어요. 알파벳은 매출 1,276억 달러로 25% 늘었지만 예상에는 못 미쳤어요. 구글 클라우드 매출은 307억 900만 달러로 103% 늘어 예상을 넘었지만, 잉여현금흐름이 90억 6,500만 달러 적자였어요. 마이크로소프트는 시간외에서 3% 안팎 올랐고, 알파벳은 10% 안팎 내렸어요.",
      more:"잉여현금흐름은 회사가 장사로 번 현금에서 설비투자를 빼고 남은 돈이에요(23일 호 '경제 상식 한 조각'). 알파벳은 영업으로 422억 9천만 달러를 벌었지만 설비에 513억 5,500만 달러를 써, 직전 분기(58억 5,500만 달러 적자)에 이어 두 분기 연속 마이너스가 됐어요. 시장 예상은 거의 0(3,600만 달러 적자)이었는데 그보다 약 90억 달러 더 나간 거예요. 뉴스1은 알파벳이 내년 설비투자를 3,000억 달러 넘게 예상했다고 전했어요. 같은 날 오라클은 바깥에서 새로 빌리는 돈을 200억 달러로 묶겠다고 밝혀 10.73% 올랐어요.",
      why:"빅테크가 데이터센터에 쓰는 돈은 엔비디아 칩과 SK하이닉스·삼성전자 메모리 주문의 출발점이에요. 투자를 늘리는 건 반도체에 좋은 신호지만, 현금이 모자라 빚이나 새 주식으로 메워야 하면 투자 속도가 흔들릴 수 있다는 걱정이 커져요. 30일 한국 시간 새벽에는 아마존 실적이 이어져요.",
      url:"https://dealsite.co.kr/articles/171617", src:"딜사이트" }
  ],

    intro: "29일 LG에너지솔루션은 실적 소식 없이 하루에 8.60% 내렸어요. 최대주주인 LG화학이 지분을 2조 5천억 원어치 처분하기로 했기 때문이에요. 기사마다 나온 '오버행'이라는 말이 무엇이고, 왜 주가를 누르는지 차례로 풀어볼게요.",
    points: [
      { t:"1) 오버행이 뭐예요?", items:[

      { t:"2) 어디서 생기나요?", items:[
        "가장 흔한 건 <mark>대주주의 지분 매각 계획</mark>이에요. 모회사가 자회사 지분을 줄이거나, 회사를 키운 초기 투자자가 돈을 회수하려 할 때 생겨요.",
        "상장 뒤 일정 기간 팔지 못하게 묶어 둔 주식(의무보유)이 풀리는 날, 나중에 주식으로 바꿀 수 있는 전환사채·교환사채가 주식으로 바뀌는 때에도 오버행 걱정이 커져요." ],
        box:{ label:"이번 LG화학의 방식, PRS", text:"LG화학은 LG에너지솔루션 주식 653만 5,939주(약 2조 5천억 원)를 <b>주가수익스와프(PRS)</b> 계약으로 처분해요. 주식을 상대방에게 넘기고 돈을 받되, 2년 동안 주가가 기준가격(주당 38만 2,500원)보다 오르면 LG화학이 차익을 얻고 내리면 손실을 메우는 구조예요. 주식은 11월 27일부터 12월 24일 사이에 넘어가요. 시장에 한꺼번에 던지는 방식은 아니지만, 그만큼의 주식이 대주주 손을 떠난다는 점에서 오버행 걱정을 키웠어요." } },
      { t:"3) 왜 중요한가요?", items:[
        "주가는 사려는 돈과 팔려는 주식의 힘겨루기로 정해져요. 오버행이 있으면 회사 실적과 상관없이 <mark>팔려는 쪽의 힘이 커 보이는</mark> 효과가 생겨요.",
        "한 번에 끝나지 않을 수 있다는 점도 커요. 대주주가 '앞으로 몇 년 동안 지분을 얼마까지 줄이겠다'고 밝혀 두면, 그 기간 내내 '또 나오겠지'라는 걱정이 주가를 눌러요." ],
        arrow:"오버행은 '이미 팔린 주식'이 아니라 '앞으로 팔릴 수 있는 주식'에 대한 걱정이에요." },
      { t:"4) 요즘 왜 뉴스에 나오나요?", items:[

  lede: "SK하이닉스가 3분기 영업이익 83조 3,338억 원과 올해 100조 원 규모의 주주환원 계획을 내놓자, 외국인과 기관이 1조 7,700억 원 넘게 사들이며 코스피는 이틀 연속 매수 사이드카 속에 374.10포인트(6.63%) 오른 6,012.44로 마감했어요. 코스닥도 3.69% 오른 771.28이었지만, 원/달러 환율은 미국 금리 결정을 앞둔 경계감에 하루 만에 14원 올라 1,337.7원이 됐어요.",
  notice: "코스피·코스닥 투자자별 금액은 지난 호들처럼 한국거래소 정규장 기준(데일리안 마감 기사, 코스피 외국인 8,157억 원·기관 9,609억 원 순매수)으로 맞췄어요. 대체거래소(NXT)까지 더한 것으로 보이는 뉴스핌 집계로는 코스피 외국인 1조 1,485억 원, 기관 1조 1,519억 원 순매수, 개인 2조 2,970억 원 순매도예요. 외국인 수급 그래프의 10월 28일 값은 장 마감 시점 집계이고, 10월 22~27일 값도 저녁 집계를 찾지 못해 장 마감 집계를 그대로 썼어요. 거래대금·상승·하락 종목 수·프로그램 매매는 위키트리 집계예요. CNN 공포 탐욕 지수는 27일 장 마감 뒤 값을 확인하지 못해 이번 호에서 뺐어요. KRX 금 1g은 발행 시점에 장 마감 값을 확인하지 못해 28일 오전 11시 18분 시세를 실었어요. 27일 KRX 금 종가는 170,390원(0.01% 하락)으로, 지난 호에 실은 오전 시세(170,590원, 0.11% 상승)와 달랐어요. 달러인덱스는 27일 뉴욕 값(블록미디어)이고, 28일 오후 3시 31분에는 102.45까지 올랐어요(뉴시스). 비트코인은 28일 오후 4시 시세예요.",

    { tag:"한국 · 기업", title:"SK하이닉스, 3분기 영업이익 83조 3,338억 원…'2029년까지 사실상 완판', 올해 주주환원 100조 원",
      body:"SK하이닉스가 28일 발표한 3분기 실적에서 매출은 104조 6,155억 원, 영업이익은 83조 3,338억 원으로 모두 사상 최대였어요. 매출이 한 분기에 100조 원을 넘은 건 처음이고, 영업이익률은 약 80%예요. 순이익은 39조 7,756억 원이었어요. 회사는 앞으로 3년(2029년까지) 동안의 D램과 HBM 생산 물량이 협상 중인 물량까지 더해 사실상 다 팔렸고, 메모리 공급 부족이 2030년까지 이어질 것으로 봤어요. 4분기에는 차세대 HBM4가 출하량과 매출 모두 HBM3E를 넘어설 것이라고 했어요.",
      more:"주주에게 돌려줄 돈도 크게 늘렸어요. 올해 전체 주주환원 규모는 약 100조 원으로, 현금배당 30조 원 이상과 자사주 매입·소각 60조 원 이상(8월에 밝힌 40조 원 포함)으로 이뤄져요. 이번 이사회에서는 3분기 현금배당 14조 원(주당 2만 원)과 자사주 20조 원 매입을 결의했어요. 주당 배당 2만 원 가운데 1만 원은 영업 실적에 따른 배당, 1만 원은 일본 키옥시아 투자로 번 돈을 나누는 특별배당이에요. 사들일 자사주 20조 원 가운데 10조 원은 없애고(소각), 나머지 약 10조 원은 직원 보상에 써서 주주환원 금액에서는 뺐어요. 3분기 말 순현금은 98조 7천억 원이에요.",
      why:"SK하이닉스는 코스피에서 시가총액이 두 번째로 큰 종목(약 1,086조 원)이라, 이 회사의 실적과 전망이 지수 전체를 움직여요. 오늘 코스피 상승분 가운데 상당 부분이 반도체 두 종목에서 나왔어요. 회사가 번 돈을 배당과 자사주 소각으로 돌려주는 '주주환원'은 오늘 '경제 상식 한 조각'에서 자세히 풀었어요.",
      url:"https://news.mtn.co.kr/article/2026102811025946081", src:"머니투데이방송" },
    { tag:"미국 · 주식", title:"메타, AI 투자금 975억 달러로 늘려…250억 달러 공모에 5배 주문, 엔비디아·AMD도 투자",
      body:"메타가 AI 인프라 투자를 위해 마련하려는 돈을 950억 달러에서 975억 달러(약 129조 원)로 늘렸어요. 그 가운데 보통주 공모를 225억 달러에서 250억 달러로 키워 주당 625달러에 4,000만 주를 팔았어요. 발표 직전 거래일 종가(642달러)보다 약 2.7% 싼 값이에요. 블룸버그에 따르면 공모에는 판 물량의 약 다섯 배 주문이 몰렸고, 절반 넘게를 장기 투자자와 기존 주주가 가져갔어요. 엔비디아는 이 공모에 30억 달러, AMD는 10억 달러를 넣기로 했어요. 전환우선주(주당 50달러, 2억 5천만 주)도 몇 배 넘게 주문이 들어왔어요.",
      more:"공모는 회사가 새 주식을 만들어 투자자들에게 팔고 돈을 받는 거예요. 회사에는 빚 없이 돈이 들어오지만, 주식 수가 늘어나 기존 주주 한 사람이 가진 몫은 그만큼 줄어요. 메타는 3분기에 영업으로 번 현금보다 설비투자가 많아 잉여현금흐름이 21억 2천만 달러 적자였고, 그 빈자리를 채우려고 의결권 없는 새 주식까지 만들었어요. 이번에 주문이 몰리면서 'AI에 쓸 돈을 구하지 못할 것'이라는 걱정은 줄었어요. 다만 칩을 파는 엔비디아와 AMD가 고객인 메타에 돈을 넣는 구조라, 칩 회사와 고객이 서로 돈으로 얽힌다는 지적도 있어요. 27일 메타 주가는 1.64% 내린 620.19달러로 마감했어요.",
      why:"메타 같은 빅테크가 데이터센터에 쓰는 돈은 엔비디아 칩과 SK하이닉스·삼성전자 메모리 주문으로 이어져요. 투자금 마련 걱정이 줄어든 게 오늘 국내 반도체 강세의 배경 가운데 하나로 꼽혔어요. 반대로 주식을 새로 찍어 내는 일이 잦아지면, 기존 주주의 몫이 줄어든다는 점도 함께 기억해 둘 만해요.",
      url:"https://www.hankyung.com/article/2026102892027", src:"한국경제" },
    { tag:"미국 · 경제", title:"미국 10월 소비자신뢰지수 91.7, 예상 크게 웃돌며 4개월 만에 반등",
      body:"미국 민간 경제조사기관 콘퍼런스보드가 27일(현지시간) 발표한 10월 소비자신뢰지수는 91.7로 9월(84.2, 81.9에서 상향 수정)보다 7.5포인트 올랐어요. 다우존스가 모은 예상치(81)를 크게 넘었고 6월 이후 가장 높아요. 지금의 경기와 일자리 형편을 묻는 현재 상황 지수는 120.4로 8.6포인트, 앞으로 6개월을 묻는 기대 지수는 72.6으로 6.9포인트 올라 석 달 연속 하락을 끊었어요. 다만 앞으로 1년 물가 예상은 5.8%로 여전히 높았어요.",
      more:"콘퍼런스보드 지수는 미국 가계에 경기·일자리·소득을 어떻게 보는지 물어 1985년을 100으로 놓고 숫자를 매겨요. 이달 12일 호에서 다룬 미시간대 소비자심리지수와 비슷하지만, 미시간대가 가계 형편과 물가에 더 무게를 둔다면 콘퍼런스보드는 일자리 사정을 더 많이 반영해요. 이번 반등에 대해 콘퍼런스보드의 퍼거스 매코믹 수석 이코노미스트는 9~10월 휘발유 값이 내린 흐름과 맞물려 있다고 봤어요. 하지만 지수가 지난 몇 년 동안의 긴 하락 흐름에서는 벗어나지 못했고, 앞으로 6개월 동안 서비스와 내구재 지출을 줄이겠다는 응답과 차·집·전자제품 구매 계획도 약해졌다고 짚었어요.",
      why:"소비는 미국 경제의 가장 큰 엔진이에요. 마음이 풀린 건 좋은 소식이지만, 경기가 버틴다는 신호는 연준이 금리를 내리기보다 더 올릴 근거가 되기도 해요. 이 숫자가 나온 뒤 미국 국채 금리와 달러가 올랐고, 28일 원/달러 환율이 14원 오른 배경으로도 꼽혔어요.",
      url:"https://www.ajunews.com/view/20261028062720688", src:"아주경제" }
  ],
  term: {
    name: "주주환원, 회사가 번 돈을 주주에게 돌려주는 '배당과 자사주 소각' 읽는 법",
    card: { eyebrow:"경제 상식 한 조각 · 2026.10.28", title:"번 돈을 돌려준다는데<br><span>왜 '소각'이 붙으면 더 반길까</span>", sub:"회사가 번 돈이 주주에게 돌아오는 두 갈래 길",
      steps: [ { k:"이익", x:"회사가 장사로 돈을 벌어요" }, { k:"배당", x:"현금을 주주에게 나눠 줘요" }, { k:"자사주 매입", x:"시장에서 자기 회사 주식을 사들여요" }, { k:"소각", x:"사들인 주식을 없애 주식 수를 줄여요" } ] },
    note: "<b>이 코너는 특정 상품 추천이 아니라 경제 기본 지식을 공부하는 자료예요.</b> 본문에 나오는 사이트 이름은 숫자를 직접 확인하는 방법을 설명하기 위한 예시예요.",
    intro: "오늘 SK하이닉스 기사마다 '주주환원 100조 원'이라는 말이 나왔어요. 회사가 번 돈을 어떻게 주주에게 돌려주는지, 왜 '배당'과 '자사주 소각'을 나눠 보는지 차례로 풀어볼게요.",
    points: [
      { t:"1) 주주환원이 뭐예요?", items:[
        "주주환원은 <mark>회사가 번 돈의 일부를 회사의 주인인 주주에게 돌려주는 것</mark>이에요. 대표적인 방법이 현금을 나눠 주는 배당, 그리고 시장에서 자기 회사 주식을 사들이는 자사주 매입이에요.",
        "친구들과 돈을 모아 차린 가게가 장사를 잘해 돈이 남았다고 생각해 봐요. 남은 돈을 투자한 친구들에게 나눠 줄 수도 있고(배당), 다른 사람이 가진 가게 지분을 사들여 없애서 남은 친구들의 몫을 키워 줄 수도 있어요(자사주 매입·소각)." ] },
      { t:"2) 배당과 자사주 소각은 어떻게 달라요?", items:[
        "배당은 <mark>현금이 내 계좌로 바로 들어오는</mark> 방법이에요. 대신 국내에서는 배당을 받을 때 세금이 붙어요. 배당을 받으려면 회사가 정한 기준일에 주식을 갖고 있어야 해요.",
        "자사주 소각은 회사가 사들인 주식을 아예 없애는 거예요. 주식 수가 줄면 같은 이익을 더 적은 주식이 나눠 갖게 돼서, <mark>한 주가 가진 몫(주당 가치)이 커져요</mark>. 현금이 바로 들어오지는 않지만 주가에 도움이 되는 방식이에요." ],
        box:{ label:"'매입'과 '소각'은 따로 봐요", text:"회사가 자사주를 사들이기만 하고 없애지 않으면, 그 주식은 나중에 다시 시장에 팔리거나 직원 보상 같은 데 쓰일 수 있어요. 그래서 시장은 <b>사들인 뒤 소각까지 하는지</b>를 중요하게 봐요. 이번 SK하이닉스도 자사주 20조 원을 사들이기로 했는데, 그 가운데 <b>10조 원은 소각</b>하고 약 10조 원은 직원 보상에 쓰기로 해서, 주주환원 금액에는 소각하는 쪽만 넣었어요." } },
      { t:"3) 왜 중요한가요?", items:[
        "회사가 돈을 많이 벌어도 그 돈을 쌓아 두기만 하면 주주에게 돌아오는 몫이 작아요. 주주환원은 <mark>회사의 이익이 실제로 주주의 손에 닿는 통로</mark>예요.",
        "회사가 꾸준히 주주환원을 약속하면, 투자자는 앞으로 받을 몫을 더 믿을 수 있어 그 회사 주식에 더 높은 값을 매기기도 해요. 그동안 한국 주식이 비슷한 외국 회사보다 싸게 거래된다는 '코리아 디스카운트'의 이유로 낮은 주주환원이 자주 꼽혔어요." ],
        arrow:"이익이 '회사가 얼마나 벌었나'라면, 주주환원은 '그중 얼마가 주주에게 오나'예요." },
      { t:"4) 요즘 왜 뉴스에 나오나요?", items:[
        "SK하이닉스가 28일 올해 약 100조 원의 주주환원 계획을 내놨어요. 현금배당이 30조 원 이상, 자사주 매입·소각이 60조 원 이상이에요. 3분기 배당은 주당 2만 원(총 14조 원)인데, 1만 원은 실적에 따른 배당이고 1만 원은 키옥시아 투자로 번 돈을 나누는 특별배당이에요.",
        "이 소식과 사상 최대 실적이 함께 나오면서 SK하이닉스는 10.89% 올랐어요. 29일에는 삼성전자가 확정 실적을 발표해 추가 주주환원 계획을 내놓을지도 관심이에요." ] },
      { t:"5) 우리에게는 어떤 영향이 있나요?", items:[
        "주식을 가진 사람은 배당으로 현금을 받거나, 소각으로 한 주의 가치가 커지는 효과를 누려요. 코스피를 따라가는 펀드나 퇴직연금에도 큰 회사들이 많이 들어 있어서 간접적으로 영향을 받아요.",
        "외환시장에도 이어져요. 외국인 주주가 많은 회사가 큰 배당을 주면, 외국인이 받은 원화를 달러로 바꾸면서 환율에 영향을 줄 수 있어요. 반대로 주주환원을 기대하고 외국인이 한국 주식을 사려고 달러를 원화로 바꾸면 원화가 강해지기도 해요.",
        "다만 주주환원이 크다고 늘 좋은 건 아니에요. 회사가 미래에 쓸 투자금까지 너무 많이 돌려주면 성장이 늦어질 수 있어요. SK하이닉스도 내년 투자를 올해보다 크게 늘리겠다고 함께 밝혔어요." ] },
      { t:"6) 숫자와 기사는 이렇게 읽어요", items:[
        "<mark>총액과 구성</mark>을 나눠 봐요. '100조 원'이라는 큰 숫자 안에 배당이 얼마인지, 자사주가 얼마인지, 이미 발표했던 금액이 포함됐는지를 확인해요. 이번 60조 원에는 8월에 밝힌 40조 원이 들어 있어요.",
        "<mark>정기적인지, 한 번뿐인지</mark>를 봐요. 실적에 따른 정기 배당은 앞으로도 기대할 수 있지만, 투자 이익을 나누는 특별배당은 한 번으로 끝날 수 있어요.",
        "<mark>소각 여부</mark>를 봐요. 자사주 매입 기사에 '소각'이라는 말이 함께 있는지가 주주에게 돌아가는 몫을 가르는 핵심이에요." ],
        box:{ label:"기사에서 볼 세 가지", text:"<b>구성</b>: 배당과 자사주가 각각 얼마인가요? <b>지속성</b>: 정기 배당인가요, 특별배당인가요? <b>소각</b>: 사들인 자사주를 없애나요, 다른 데 쓰나요? 이번 SK하이닉스는 '배당 30조 원 이상·자사주 60조 원 이상', '정기 1만 원+특별 1만 원', '20조 원 가운데 10조 원 소각'이었어요." } },
      { t:"7) 어디서 직접 확인할 수 있나요?", items:[

  comment: {

    intro: "어제 7개월 만의 최저였던 코스피가 오늘 3% 넘게 올랐어요. 상장 신청서 한 부와 성장률 숫자 하나가 바꾼 하루를 세 가지로 나눠 볼게요.",
    points: [
      { t:"1. 보도 속 숫자에서 '공시된 숫자'로 바뀌었어요", paras:[
        "이달 초 시장을 흔든 건 오픈AI의 매출이 보도와 달랐다는 소식, 지난주에는 메타의 첫 현금흐름 적자였어요. 모두 'AI에 쓴 돈이 돌아오느냐'는 질문이었는데, 비상장 AI 회사의 숫자는 늘 보도를 거쳐 전해졌어요. 이번 앤트로픽 상장 신청서는 회사가 규제 기관에 정식으로 낸 서류라는 점이 달라요.",
        "서류에는 상반기 매출이 1년 새 약 14배로 늘었다는 숫자와 함께, 상반기 영업손실이 6억 9,300만 달러로 1년 전(21억 4천만 달러)보다 크게 줄었다는 숫자가 담겼어요. 대신증권 이경민 연구원은 앤트로픽이 2분기에 9억 7천만 달러 영업이익을 내 흑자로 돌아섰다고 짚었어요. 다만 회사 스스로 지금 같은 성장 속도는 이어지지 않을 거라고 위험 요인에 적었다는 점도 함께 봐야 해요." ] },
      { t:"2. 성장률은 깜짝 1.0%, 그런데 소비는 줄었어요", paras:[
        "한국 3분기 성장률 1.0%는 한국은행 전망(0.3%)의 세 배가 넘어요. 반도체 수출과 반도체 장비 투자가 성장을 끌었고, 정부도 상반기에 아껴 둔 예산을 썼어요. 한국은행은 다음 달 올해 성장률 전망(3.3%)을 상당 폭 올리겠다고 했어요.",

      { t:"3. 남은 이번 주는 '확인'의 연속이에요", paras:[

  news: [
    { tag:"미국 · 주식", title:"앤트로픽, 나스닥 상장 신청서 공개…상반기 매출 163억 달러로 1년 새 14배",
      body:"AI 회사 앤트로픽이 26일(현지시간) 미국 증권거래위원회(SEC)에 상장 신청서(S-1)를 공개로 제출했어요. 종목 코드는 'ANT'로, 나스닥 글로벌 셀렉트 시장에 상장할 계획이에요. 상반기 매출은 162억 9천만 달러(약 21조 6천억 원)로 1년 전(11억 6천만 달러)의 약 14배였고, 상반기 영업손실은 6억 9,300만 달러로 1년 전(21억 4천만 달러)보다 줄었어요. 골드만삭스와 모건스탠리 등 20곳 넘는 금융회사가 상장을 맡고, 블룸버그에 따르면 이르면 11월 9일이 낀 주부터 투자자를 만나는 절차(로드쇼)를 시작해요.",
      more:"상장 신청서는 회사가 주식을 시장에 처음 팔기 전에 사업 내용, 실적, 위험 요인을 자세히 적어 내는 서류예요. 앤트로픽은 6월에 비공개로 초안을 냈다가 이번에 공개로 바꿨어요. 상반기 순손실은 807억 달러로 컸는데, AI타임스는 기업가치가 오르면서 전환사채(나중에 주식으로 바꿀 수 있는 채권)의 평가 손실이 커진 영향이라 영업 손실이나 현금 유출과는 다르다고 설명했어요. 상반기 컴퓨팅·인프라에 쓴 돈은 89억 달러로 1년 전보다 283% 늘었어요. 공모 주식 수와 가격 범위는 아직 정해지지 않았어요. 일부 보도는 최대 2조 달러 기업가치와 1,000억 달러 이상 조달을 거론했지만, 투자자들 사이에서는 1조 4천억~1조 5천억 달러를 말하는 의견도 있어 실제 값은 앞으로 정해져요.",
      why:"앤트로픽 같은 AI 회사의 매출은 엔비디아 칩과 SK하이닉스·삼성전자 메모리 주문으로 이어지는 출발점이에요. 비상장 AI 회사의 실적이 처음으로 상장 서류에 공개되면서 AI 투자 걱정이 누그러졌고, 27일 코스피 반도체 강세로 이어졌어요. 앤트로픽에 투자한 SK텔레콤 주가도 장중 크게 흔들렸어요.",
      url:"https://www.aitimes.com/news/articleView.html?idxno=216687", src:"AI타임스" },
    { tag:"한국 · 거시경제", title:"3분기 성장률 1.0% '깜짝 성장'…반도체 수출·설비투자가 끌고 민간소비는 뒷걸음",
      body:"한국은행이 27일 발표한 3분기 실질 국내총생산(GDP) 속보치는 앞 분기보다 1.0%, 1년 전보다 3.4% 늘었어요. 8월 전망(0.3%)을 0.7%포인트 웃돌았어요. 수출은 반도체와 기계·전기장비를 중심으로 2.3%, 설비투자는 반도체 제조장비를 중심으로 4.1%, 정부 소비는 1.9% 늘었어요. 반면 민간소비는 승용차·가전 같은 물건과 금융·음식 서비스가 줄어 0.2% 감소했어요. 업종별로는 제조업이 2.0% 늘었고 서비스업은 0.2% 늘어나는 데 그쳤어요.",
      more:"GDP는 한 나라 안에서 일정 기간 새로 만들어 낸 물건과 서비스의 값을 모두 더한 숫자예요. 속보치는 분기가 끝나고 약 한 달 뒤 처음 나오는 숫자라 나중에 조금 고쳐질 수 있어요. 이번에는 나라 전체가 실제로 손에 쥔 소득을 보여주는 실질 국내총소득(GDI)도 앞 분기보다 3.4%, 1년 전보다 18.8% 늘었어요. 이투데이에 따르면 1977년 4분기(19.0%) 이후 가장 빠른 속도예요. 반도체 값이 올라 같은 양을 팔아도 더 많이 벌었다는 뜻이에요. 한국은행은 다음 달 올해 성장률 전망(3.3%)을 상당 폭 올리겠다고 했고, 4분기 성장률이 0%여도 올해 성장률은 3.6%가 돼요.",
      why:"성장률은 한국은행이 금리를 정할 때 보는 핵심 숫자예요. 경기가 강하면 금리를 내리기 어렵고, 지난주 '긴축을 이어간다'고 했던 한국은행이 11월에 금리를 더 올릴 근거가 될 수 있어요. 반대로 민간소비가 줄어든 건 반도체 호황이 아직 생활 경제로 고르게 번지지 않았다는 신호예요.",
      url:"https://www.etoday.co.kr/news/view/2640332", src:"이투데이" },
    { tag:"거시경제 · 신흥국", title:"룰라 대통령 4선에 브라질 증시 13.88% 폭락…헤알화 하루 8% 급락",
      body:"25일(현지시간) 브라질 대선 결선에서 룰라 대통령이 51.8%를 얻어 플라비우 보우소나루 상원의원(48.2%)을 이겼어요. 다음 날 브라질 대표 주가지수 보베스파는 13.88% 내린 176,608로 마감했고, 장중에는 17.34%까지 빠져 2020년 코로나19 이후 처음으로 거래를 멈추는 서킷브레이커가 걸렸어요. 브라질 돈 헤알화는 달러 대비 8% 떨어져 1달러에 5.41헤알이 됐어요. 1999년 이후 가장 큰 하루 낙폭이에요. 미국에 상장된 브라질 주식 상장지수펀드(ETF)도 19.82% 급락했어요.",
      more:"시장은 1차 투표에서 앞섰던 보우소나루 의원이 이겨 나라 살림을 아끼고 금리를 낮출 거라고 기대했어요. 그런데 결과가 뒤집히자 그 기대에 걸었던 돈이 한꺼번에 빠져나갔어요. 룰라 대통령은 주말 대중교통 무료, 개인 빚 탕감, 복지 확대 같은 공약을 내걸었는데, 국제통화기금(IMF)은 브라질의 올해 재정적자를 GDP의 약 8%, 나랏빚을 약 83%로 보고 있어요. 기준금리도 연 13.75%로 높아요. RBC블루베이의 그레이엄 스톡은 시장이 재정을 바로잡겠다는 정부의 뜻을 기다리고 있고, 그 핵심이 재무장관 임명이라고 짚었어요.",
      why:"나라 살림에 대한 믿음이 흔들리면 주식·돈·채권 값이 하루에 함께 무너질 수 있다는 걸 보여줘요. 브라질 채권과 주식은 국내 투자자도 적지 않게 사는 상품이라, 해외 투자를 할 때는 수익률뿐 아니라 그 나라의 재정과 환율 위험도 함께 따져 봐야 해요.",
      url:"https://www.hankookilbo.com/news/article/A2026102712360003378", src:"한국일보" }
  ],

      { t:"1) 기업공개(IPO)가 뭐예요?", items:[

        "동네 친구들끼리 돈을 모아 차린 가게가, 더 크게 키우려고 지분을 잘게 나눠 아무나 살 수 있게 내놓는 것과 비슷해요. 회사는 큰돈을 모을 수 있고, 처음부터 투자한 사람은 주식을 팔아 돈으로 바꿀 길이 생겨요." ] },
      { t:"2) 어떤 순서로 진행되나요?", items:[
        "먼저 회사는 규제 기관에 <mark>증권신고서</mark>를 내요. 미국에서는 증권거래위원회(SEC)에 내는 S-1, 한국에서는 금융감독원에 내는 증권신고서예요. 이 서류에는 무슨 사업을 하는지, 얼마를 벌고 쓰는지, 어떤 위험이 있는지가 자세히 적혀요.",
        "그다음 회사와 증권사가 큰 투자자들을 찾아다니며 회사를 소개하는 로드쇼를 열고, 사겠다는 수요를 모아 공모 가격을 정해요. 마지막으로 거래소에 상장하면 첫 거래가 시작돼요." ],
        box:{ label:"비공개 제출과 공개 제출", text:"미국에서는 회사가 먼저 <b>비공개로</b> 초안을 내고 규제 기관의 검토를 받은 뒤, 상장을 앞두고 <b>공개로</b> 바꿀 수 있어요. 앤트로픽도 6월에 비공개로 초안을 냈다가 26일에 공개했어요. 그래서 공개 제출은 '상장이 정말 가까워졌다'는 신호로 읽혀요. 공모 주식 수와 가격 범위는 보통 이 뒤에 서류를 고쳐 내면서 채워져요." } },
      { t:"3) 왜 이 서류가 중요한가요?", items:[
        "비상장 회사의 실적은 보통 언론 보도나 회사 관계자의 말로만 전해져요. 그런데 증권신고서는 <mark>거짓으로 쓰면 법적 책임을 지는 공식 서류</mark>예요. 회계 감사를 받은 재무제표도 들어가요.",
        "그래서 같은 매출 숫자라도 보도로 전해질 때와 신고서에 적힐 때 무게가 달라요. 이달 초 오픈AI의 매출이 보도마다 200억 달러나 달라 시장이 흔들렸던 것과 견주면, 이번 앤트로픽 숫자에 시장이 크게 반응한 이유를 알 수 있어요." ],
        arrow:"증권신고서는 회사가 시장에 처음 내미는 '공식 자기소개서'예요. 자랑뿐 아니라 약점도 적어야 해요." },
      { t:"4) 요즘 왜 뉴스에 나오나요?", items:[
        "AI 회사 앤트로픽이 26일(현지) 나스닥 상장을 위한 S-1을 공개했어요. 상반기 매출이 162억 9천만 달러로 1년 새 약 14배가 됐다는 숫자에 AI 투자 걱정이 누그러지면서, 필라델피아 반도체지수가 2.82%, 27일 코스피가 3.09% 올랐어요.",
        "일부 보도는 기업가치 최대 2조 달러, 조달 금액 1,000억 달러 이상을 거론하며 역대 가장 큰 IPO가 될 수 있다고 전했어요. 다만 공모 규모와 가격은 아직 정해지지 않았고, 투자자들이 말하는 기업가치도 1조 4천억 달러부터 여러 숫자가 나와요." ] },
      { t:"5) 우리에게는 어떤 영향이 있나요?", items:[
        "큰 회사가 상장할 때는 주식시장 전체에 영향을 줘요. 기대가 커지면 비슷한 업종 주식이 함께 오르기도 하고, 반대로 새로 상장하는 주식을 사려고 다른 주식을 파는 돈이 나오기도 해요.",
        "국내에서는 앤트로픽에 투자한 SK텔레콤이 장중 8% 넘게 올랐다가 1.94% 상승으로 마쳤어요. 투자한 회사의 가치가 다시 매겨질 거라는 기대가 주가에 먼저 반영된 거예요.",
        "공모주 청약은 2030이 자주 관심을 갖는 투자 방법이기도 해요. 다만 상장 첫날 값이 크게 출렁일 수 있어서, 청약 전에 증권신고서의 위험 요인부터 읽어 보는 습관이 중요해요." ] },
      { t:"6) 신고서와 기사는 이렇게 읽어요", items:[
        "<mark>매출과 함께 손익</mark>을 봐요. 앤트로픽은 매출이 크게 늘었지만 상반기에는 영업손실이었어요. 얼마나 빠르게 손실이 줄고 있는지가 중요해요.",
        "<mark>순손실의 이유</mark>를 따로 봐요. 앤트로픽의 상반기 순손실 807억 달러는 대부분 전환사채 평가 손실 때문이라, 실제로 나간 현금과는 달라요. 숫자가 크다고 바로 놀라기보다 무엇 때문인지 찾아봐요.",
        "<mark>위험 요인</mark>을 꼭 읽어요. 앤트로픽은 지금 같은 매출 성장 속도가 이어지지 않을 거라고 스스로 적었어요. 회사가 직접 적은 약점은 투자 판단에서 가장 솔직한 정보예요." ],
        box:{ label:"기사에서 볼 세 가지", text:"<b>단계</b>: 비공개 제출인가요, 공개 제출인가요, 가격까지 정해졌나요? <b>숫자</b>: 매출만 나왔나요, 영업손익과 현금흐름도 나왔나요? <b>값</b>: 기업가치가 확정된 숫자인가요, 보도나 투자자들의 추정인가요? 이번 앤트로픽은 '공개 제출', '매출·손익 모두 공개', '기업가치는 아직 추정'이었어요." } },
      { t:"7) 어디서 직접 확인할 수 있나요?", items:[
        "<b>미국 상장 신청서(S-1)</b>: 미국 증권거래위원회(SEC)의 공시 검색 시스템 에드거(EDGAR)에서 회사 이름을 검색하면 S-1 원문과 고친 서류를 볼 수 있어요. <a href='https://www.sec.gov/edgar/search/' target='_blank' rel='noopener'>sec.gov/edgar →</a>",
        "<b>국내 공모 일정과 증권신고서</b>: 한국거래소 기업공시채널(KIND)에서 공모 기업과 상장 일정을, 금융감독원 전자공시시스템(DART)에서 증권신고서 원문을 찾을 수 있어요. <a href='https://kind.krx.co.kr' target='_blank' rel='noopener'>kind.krx.co.kr →</a>" ],
        arrow:"'상장 추진' 기사를 보면, 신고서가 실제로 나왔는지와 그 안의 위험 요인부터 확인해 보세요." }

    { tag:"미국 · 주식", title:"스페이스X 이동통신 진출 보도에 AT&T 7.96%·T모바일 7.71% 급락",
      body:"23일(현지시간) 스페이스X가 미국 이동통신 시장에 본격적으로 들어오려 한다는 외신 보도가 나오면서 미국 통신주가 크게 내렸어요. AT&T는 1.81달러(7.96%) 내린 20.93달러로 마감했고, T모바일은 7.71%, 버라이즌은 1.19% 내렸어요. 보도는 스페이스X가 미국 4대 이동통신사로 올라서기 위해 전국 기지국 탑의 절반가량을 확보하려 한다는 내용이에요. 반대로 기지국 탑을 빌려주는 회사들은 수요가 늘 거라는 기대에 크라운캐슬이 9% 넘게, 아메리칸타워가 약 4% 올랐어요.",
      more:"스페이스X는 위성 인터넷 사업을 하는 회사로, 휴대전화가 위성과 바로 연결되는 서비스도 키우고 있어요. 여기에 땅 위의 기지국까지 갖추면 기존 통신사와 정면으로 경쟁하게 돼요. 통신업은 기지국과 주파수에 큰돈이 들어가는 사업이라, 고객을 빼앗기면 그 비용을 나눌 사람이 줄어 이익이 크게 흔들려요. 금리가 높은 지금은 빚 부담도 커서 새 경쟁자에 더 민감해요. 다만 이번 소식은 보도 단계이고, 실제 기지국 확보 규모나 서비스 일정은 아직 확인되지 않았어요.",
      why:"통신주는 꾸준한 배당 때문에 경기를 덜 타는 종목으로 여겨져 왔어요. 그런 업종도 새 기술을 가진 경쟁자가 나타나면 하루에 8% 가까이 흔들릴 수 있다는 걸 보여줘요. 지수를 따라가는 펀드에도 통신주가 들어 있어 영향을 받아요.",
      url:"https://news.jkn.co.kr/post/1045448", src:"재경일보" },
    { tag:"거시경제 · 원자재", title:"브렌트유 116.72달러, 4월 말 이후 최고…'미국 이란 공격 재개' 우려",
      body:"23일(현지시간) 브렌트유 12월물은 3.55달러(3.14%) 오른 배럴당 116.72달러, WTI 12월물은 3.80달러(3.82%) 오른 103.27달러로 마감했어요. 한국석유공사 집계로 중동산 두바이유도 1.50달러 오른 116.90달러였어요. 미국과 이스라엘이 이란 공격 재개를 검토한다는 보도가 나오자, 이란은 공격이 다시 시작되면 이웃 나라의 경제·민간 시설을 칠 수 있다고 경고했어요. 예멘 후티 반군의 사우디 공격과 아랍에미리트 근처 유조선 기름 유출 사고도 중동 바닷길 불안을 키웠어요.",
      more:"유가에는 실제 공급량뿐 아니라 '혹시 막힐지 모른다'는 걱정의 값이 함께 붙어요. 미국과 독일이 전략비축유를 풀고 러시아산 경유 수송이 다시 시작된 건 값을 누르는 쪽이었지만, 공격 소식이 더 크게 작용했어요. 기름값은 이미 미국 물가를 밀어 올리고 있어요. 9월 미국 소비자물가는 1년 전보다 3.7% 올랐는데, 휘발유가 한 달 새 9.1% 뛰어 상승분의 절반 넘게를 차지했어요. 23일 나온 미시간대 소비자심리지수도 중동 분쟁에 따른 물가 부담으로 사상 최저 부근에 머물렀어요.",
      why:"우리나라는 원유를 거의 다 수입해요. 유가가 오르면 주유소 기름값과 전기·가스 요금, 물건값이 시차를 두고 따라 올라요. 미국 물가가 오르면 연준이 금리를 높게 오래 둘 가능성이 커져, 외국인 자금과 환율에도 영향을 줘요.",
      url:"https://www.energy-news.co.kr/news/articleView.html?idxno=229226", src:"에너지신문" },
    { tag:"한국 · 주식", title:"코스피 5,469로 7개월 만에 최저…한 달 하락률 21.6%, 주요 지수 중 가장 커",
      body:"26일 코스피는 80.83포인트(1.46%) 내린 5,469.47로 마감해 4월 6일(5,450.33) 이후 가장 낮은 종가를 기록했어요. 외국인이 6,955억 원을 팔았고, 코스피에서 792개 종목이 내리는 동안 오른 종목은 101개였어요. 서울신문 집계로 23일 기준 최근 한 달 동안 코스피는 21.6% 내려, 같은 기간 나스닥(-4.1%), S&P500(-1.5%), 닛케이225(-5.5%), 항셍(-5.8%)보다 하락폭이 훨씬 컸어요. 코스닥도 3.26% 내린 727.21로 7월 31일 이후 가장 낮았어요.",
      more:"증권가는 코스피 목표치를 잇달아 낮추고 있어요. 앞으로의 흔들림은 미국의 금리 인상이 언제 끝나는지, 물가가 내려오는지, 반도체 경기가 나아지는지에 달려 있다는 분석이에요. 빚을 내 투자한 돈도 줄고 있어요. 아주경제에 따르면 신용거래융자 잔고는 12일 34조 2,887억 원에서 21일 30조 2,710억 원으로 9일 만에 약 4조 원 줄었고, 9월 21일부터 10월 21일까지 담보 부족 등으로 증권사가 강제로 판 반대매매는 5,336억 원이었어요.",
      why:"코스피를 따라가는 펀드나 퇴직연금을 가진 사람은 한 달 새 그만큼 평가액이 줄었을 수 있어요. 지수가 크게 빠진 시기에는 빚을 내 투자한 사람들의 강제 매도가 하락을 키우기도 해서, 무리한 빚투가 위험한 이유를 다시 보여줘요.",
      url:"https://www.seoul.co.kr/news/economy/securities/2026/10/26/20261026500215", src:"서울신문" }
  ],
  term: {
    name: "마진콜, 빚내서 투자한 돈에 날아오는 '담보 보충 요구서' 읽는 법",

    note: "<b>이 코너는 특정 상품 추천이 아니라 경제 기본 지식을 공부하는 자료예요.</b> 본문에 나오는 사이트 이름은 숫자를 직접 확인하는 방법을 설명하기 위한 예시예요.",
    intro: "23일 금값 기사마다 '마진콜'이라는 말이 나왔어요. 안전자산이라는 금이 왜 주식과 함께 팔렸는지, 국내 기사에 자주 나오는 '반대매매'와는 어떻게 이어지는지 차례로 풀어볼게요.",
    points: [

      { t:"2) 어떻게 생기나요?", items:[

        "그런데 산 자산의 값이 떨어지면 담보의 가치도 줄어요. 정해진 기준 아래로 내려가면 마진콜이 오고, 투자자는 정해진 시간 안에 돈을 더 넣거나 가진 자산을 팔아 빚을 줄여야 해요." ],
        box:{ label:"한국 기사에서는 '반대매매'로 나와요", text:"국내에서 증권사 돈을 빌려 주식을 사는 <b>신용거래</b>나, 돈을 다 내지 않고 먼저 사는 <b>미수거래</b>에도 같은 원리가 있어요. 주가가 떨어져 담보가 모자라거나 빌린 돈을 제때 갚지 못하면, 증권사가 투자자 대신 주식을 강제로 팔아요. 이걸 <b>반대매매</b>라고 해요. 마진콜이 '채우라는 요구'라면, 반대매매는 그 요구를 못 채웠을 때 벌어지는 일이에요." } },

        "급히 돈을 마련해야 하는 사람은 손해 본 자산보다 <mark>팔기 쉽고 값이 덜 떨어진 자산</mark>을 먼저 팔기도 해요. 그래서 위기 초반에는 금처럼 안전하다고 여겨지는 자산까지 함께 빠지는 일이 생겨요." ],
        arrow:"마진콜은 '이 자산이 나빠서'가 아니라 '당장 현금이 필요해서' 나오는 매도라는 점을 기억해요." },
      { t:"4) 요즘 왜 뉴스에 나오나요?", items:[

        box:{ label:"기사에서 볼 세 가지", text:"<b>쌓인 빚</b>: 신용거래융자 잔고가 많은가요, 줄고 있나요? <b>강제 매도</b>: 반대매매 금액이 늘고 있나요? <b>함께 빠짐</b>: 금처럼 안전자산까지 같이 내렸나요? 이번에는 '고점에서 4조 원 감소', '10월 중순 하루 893억 원까지 증가', '금도 3개월 만에 4,000달러 아래'였어요." } },

  calendarIntro: "이번 주는 한국 성장률, 미국 금리 결정, SK하이닉스·삼성전자 실적, 미국 빅테크 실적이 한꺼번에 몰린 '슈퍼위크'예요. 미국 일정은 현지 날짜이고, 한국 시간도 함께 적었어요.",

    points: [

        "그동안 AI 투자에 대한 걱정은 주로 'AI로 정말 돈을 벌 수 있느냐'였어요. 메타의 3분기 실적은 다른 질문을 던졌어요. 매출이 26% 늘었는데도 설비에 쓴 돈이 영업으로 번 현금보다 많아, 상장 뒤 처음으로 잉여현금흐름이 마이너스가 됐어요. 그 부족분과 앞으로의 투자를 메우려고 새 주식까지 내겠다고 했어요.",

  news: [
    { tag:"미국 · 주식", title:"메타, 상장 뒤 첫 잉여현금흐름 적자…AI 투자금 위해 의결권 없는 주식까지",
      body:"메타가 21일(현지시간) 발표한 3분기 실적에서 잉여현금흐름이 약 21억 2천만 달러 적자였어요. 1년 전 같은 분기에는 약 106억 달러 흑자였어요. 영업으로 번 현금(327억 9천만 달러)보다 설비투자(349억 1천만 달러)가 많았던 거예요. 메타는 올해 설비투자 전망을 1,300억~1,450억 달러에서 1,350억~1,450억 달러로 올렸고, AI 투자금을 마련하려고 의결권 없는 새 종류의 주식을 내겠다고 밝혔어요. 22일 주가는 6.98% 내린 648.85달러로 마감했고, 5년물 CDS 프리미엄은 114.79bp로 사상 최고였어요.",
      more:"블룸버그에 따르면 메타가 데이터센터·컴퓨팅·에너지 등에 앞으로 쓰기로 약속한 금액은 약 8,250억 달러로, 7월(약 7,000억 달러)보다 늘었어요. 이 약속은 지금 갚아야 할 빚과는 다르지만, 앞으로 큰돈이 계속 나간다는 뜻이에요. 의결권 없는 주식은 회사에 돈을 대지만 회사 결정에 표를 던질 수는 없는 주식이에요. 새 주식을 내면 기존 주주의 몫이 줄어들 수 있어요. 미국 자산운용사 올스프링의 채권 트레이더는 AI 경쟁이 점점 자금 조달 경쟁이 되고 있다고 짚었어요. 반면 한 시장 전략가는 CDS가 오른 데에는 메타에 돈을 빌려준 은행들의 위험 대비 거래도 섞여 있어, 실제 부도 위험이 크게 커졌다고 보기는 어렵다고 했어요.",
      why:"메타 같은 빅테크가 데이터센터에 쓰는 돈은 엔비디아 칩과 SK하이닉스·삼성전자 메모리 주문으로 이어져요. 투자를 이어 갈 돈이 충분한지에 대한 의심은 반도체 주가를 바로 흔들어요. 22일 미국 반도체지수가 6.72%, 23일 코스피가 장 초반 4% 넘게 빠진 배경이에요.",
      url:"https://www.aitimes.com/news/articleView.html?idxno=216578", src:"AI타임스" },
    { tag:"미국 · 채권", title:"미국 10년 국채 금리 하루 0.193%p 급락해 4.95%, 2023년 3월 이후 최대 낙폭",
      body:"22일(현지시간) 미국 10년 국채 금리는 0.193%포인트 내린 4.952%로 마감했어요. 2023년 3월 10일 이후 하루 낙폭이 가장 커요. 이달 7일에는 5.3645%까지 올라 2002년 4월 이후 가장 높았는데, 2주 남짓 만에 5% 아래로 내려왔어요. 2년 금리는 0.188%포인트 내린 4.635%, 30년 금리는 0.151%포인트 내린 5.286%였어요. 시카고상품거래소(CME) 페드워치 기준 다음 주 회의에서 금리를 올릴 가능성은 7.2%로, 1주 전(27.7%)과 한 달 전(55.4%)보다 크게 낮아졌어요.",
      more:"국채 금리와 국채 가격은 반대로 움직여요. 국채를 사려는 사람이 몰리면 가격이 오르고 금리는 내려요. 이날은 AI 회사들의 자금 조달 걱정에 기술주를 판 돈이 가장 안전하다고 여겨지는 미국 국채로 옮겨 갔어요. 세이지 어드바이저리의 공동 최고투자책임자는 에너지·물가 걱정과 국채로 피하려는 수요 사이의 싸움에서 최근 일주일은 안전자산 쪽이 이겼다고 진단했어요. 다만 같은 날 유가는 4% 뛰었고, 5년 만기 물가연동국채 입찰 금리는 2023년 10월 이후 가장 높았어요. 물가 걱정이 사라진 건 아니라는 뜻이에요.",
      why:"미국 국채 금리는 세계 금리와 대출 금리의 기준이에요. 금리가 내리면 주식 가치 계산에는 숨통이 트이지만, 이번처럼 불안 때문에 국채로 돈이 몰린 경우에는 위험자산이 약하다는 신호이기도 해요. 금리 하락이 계속될지는 다음 주 연준 회의와 PCE 물가에 달려 있어요.",
      url:"https://www.newspim.com/news/view/20261023000034", src:"뉴스핌" },
    { tag:"한국 · 기업", title:"SK하이닉스, 미국 손자회사 솔리다임 상장 검토 멈춰…'중복상장' 걱정 덜어",
      body:"SK하이닉스는 23일 장 시작 전 공시에서 미국 손자회사 솔리다임의 상장 전 투자 유치(프리IPO)와 기업공개(IPO) 검토를 중단한다고 밝혔어요. 생산능력 확대를 위한 자금 조달 방법을 검토했지만 자본시장 여건 등을 고려했다는 설명이에요. 다만 솔리다임의 성장 가능성과 미국 내 새 생산시설이 필요하다는 판단은 그대로라고 했어요. 이날 SK하이닉스는 장 초반 119만 원대까지 밀렸다가 4.42% 오른 127만 7,000원으로 마감했어요.",
      more:"솔리다임은 SK하이닉스가 2021년 인텔의 낸드플래시·SSD 사업을 인수해 만든 회사로, 미국 중간지주사 AI컴퍼니를 통해 지분 100%를 갖고 있어요. 모회사와 자회사가 함께 상장하는 걸 '중복상장'이라고 하는데, 투자자는 자회사 주식을 따로 살 수 있게 되니 모회사 주식의 매력이 줄고, 그만큼 모회사 주가가 할인받는다는 걱정이 있어요. 주주들의 반발이 컸고, 이억원 금융위원장도 22일 국정감사에서 솔리다임의 미국 상장이 중복상장 가이드라인 적용 대상이라고 답했어요.",
      why:"SK하이닉스는 코스피에서 비중이 두 번째로 큰 종목이에요. 이번 결정은 주주 가치를 지키려는 신호로 읽혀 투자 심리를 받쳤어요. 다만 미국 생산시설을 늘리는 데 필요한 돈을 어떻게 마련할지는 숙제로 남았어요. 28일 3분기 실적 발표에서 추가 설명이 나올지 지켜볼 만해요.",
      url:"https://www.hankyung.com/article/2026102300706", src:"한국경제" }
  ],

    points: [

        "월급으로 치면 이해가 쉬워요. 한 달 월급에서 꼭 써야 하는 생활비와 일하는 데 필요한 노트북 할부금을 내고 남는 돈이 저축하거나 마음대로 쓸 수 있는 여윳돈이에요. 회사에서는 이 여윳돈이 잉여현금흐름이에요." ] },
      { t:"2) 이익과는 왜 다른가요?", items:[
        "회계 장부의 이익과 실제 통장에 남은 현금은 달라요. 회사가 데이터센터를 지으려고 큰돈을 쓰면, 장부에서는 그 돈을 여러 해에 나눠 비용으로 잡아요(감가상각). 하지만 현금은 짓는 해에 한꺼번에 나가요.",
        "그래서 이익은 크게 늘어도 현금은 마이너스일 수 있어요. 메타가 바로 그랬어요. 3분기 매출은 646억 달러로 1년 전보다 26% 늘었지만, 그 분기에 설비에 쓴 돈이 장사로 번 현금보다 많았어요." ],
        box:{ label:"메타 3분기를 계산해 보면", text:"<b>영업으로 번 현금</b> 327억 9천만 달러 − <b>설비투자</b> 349억 1천만 달러 = <b>잉여현금흐름</b> 약 −21억 2천만 달러. 1년 전 같은 분기에는 약 106억 달러가 남았어요. 2012년 상장 뒤 분기 기준으로 처음 마이너스가 됐어요." } },
      { t:"3) 왜 중요한가요?", items:[
        "잉여현금흐름은 회사가 <mark>배당을 주고, 자기 주식을 사들이고, 빚을 갚는 돈의 원천</mark>이에요. 이 돈이 넉넉한 회사는 남에게 손을 벌리지 않고도 다음 투자를 할 수 있어요.",
        "반대로 마이너스가 이어지면 모자란 돈을 빚을 내거나 새 주식을 팔아 메워야 해요. 빚이 늘면 이자 부담이 커지고, 새 주식을 내면 기존 주주의 몫이 줄어요." ],
        arrow:"이익이 '얼마나 잘 팔았나'를 보여준다면, 잉여현금흐름은 '그러고도 손에 남은 돈이 있나'를 보여줘요." },
      { t:"4) 요즘 왜 뉴스에 나오나요?", items:[
        "AI 경쟁 때문이에요. 빅테크들이 데이터센터와 AI 칩에 엄청난 돈을 쓰면서 번 현금이 투자로 거의 다 나가고 있어요. 메타는 올해 설비투자 전망 하단을 1,350억 달러로 올렸고, 앞으로 쓰기로 약속한 돈은 약 8,250억 달러예요.",
        "메타는 모자란 돈을 마련하려고 의결권 없는 새 주식을 내겠다고 했어요. 그러자 시장은 'AI로 돈을 벌 수 있나'에 더해 'AI에 쓸 돈을 어떻게 마련하나'를 묻기 시작했어요. 부도 위험을 보여주는 메타의 CDS 프리미엄은 사상 최고로 올랐어요." ] },
      { t:"5) 우리에게는 어떤 영향이 있나요?", items:[

        "반대로 빅테크가 빚을 내서라도 투자를 이어 가면 메모리 수요는 유지될 수 있어요. 그래서 다음 주 빅테크 실적에서는 설비투자 금액과 함께 그 돈을 어떻게 마련하는지가 관심이에요.",
        "주식을 직접 사지 않아도 연금이나 펀드에 이런 회사들이 들어 있으면 그 영향을 함께 받아요." ] },
      { t:"6) 숫자는 이렇게 읽어요", items:[
        "<mark>한 분기보다 흐름</mark>을 봐요. 큰 공장을 짓는 해에는 잠깐 마이너스가 될 수 있어요. 몇 분기째 이어지는지, 줄어드는지 커지는지가 더 중요해요.",
        "<mark>왜 줄었는지</mark>를 봐요. 장사가 안돼 현금이 덜 들어온 건지, 투자를 늘려서 더 나간 건지에 따라 뜻이 완전히 달라요. 메타는 현금이 덜 들어온 게 아니라 투자로 더 나간 경우예요.",
        "<mark>모자란 돈을 어떻게 메우는지</mark>를 봐요. 쌓아 둔 현금으로 메우는지, 빚을 내는지, 새 주식을 내는지에 따라 주주가 받는 영향이 달라요." ],
        box:{ label:"기사에서 볼 세 가지", text:"<b>흐름</b>: 몇 분기째 마이너스인가요? <b>이유</b>: 들어온 현금이 줄었나요, 나간 투자가 늘었나요? <b>메우는 방법</b>: 현금·빚·새 주식 가운데 무엇인가요? 이번 메타는 '상장 뒤 처음', '투자가 늘어서', '새 주식 발행 계획'이었어요." } },
      { t:"7) 어디서 직접 확인할 수 있나요?", items:[
        "<b>미국 상장사의 현금흐름표</b>: 미국 증권거래위원회(SEC)의 공시 검색 시스템 에드거(EDGAR)에서 회사 이름으로 분기보고서(10-Q)를 찾으면 영업활동 현금흐름과 설비투자 금액을 볼 수 있어요. <a href='https://www.sec.gov/edgar/search/' target='_blank' rel='noopener'>sec.gov/edgar →</a>",
        "<b>국내 상장사의 현금흐름표</b>: 금융감독원 전자공시시스템(DART)에서 분기·사업보고서를 열면 현금흐름표에서 '영업활동으로 인한 현금흐름'과 '유형자산의 취득'을 찾을 수 있어요. 앞에서 뒤를 빼면 대략의 잉여현금흐름이 나와요. <a href='https://dart.fss.or.kr' target='_blank' rel='noopener'>dart.fss.or.kr →</a>" ],
        arrow:"실적 기사에서 '사상 최대 매출'을 보면, 그 회사 통장에 실제로 남은 돈은 얼마인지도 한번 찾아보세요." }

  notice: "코스피·코스닥 투자자별 금액은 지난 호들처럼 한국거래소 정규장 기준(서울신문 마감 기사)으로 맞췄어요. 이 기준으로 코스피 외국인은 614억 원 순매수였지만, 대체거래소(NXT)까지 더한 것으로 보이는 뉴스핌 집계로는 외국인 3,991억 원·기관 6,834억 원 순매도, 개인 1조 364억 원 순매수로 외국인의 방향이 반대예요. 외국인 수급 그래프의 10월 22일 값은 장 마감 시점 집계이고, 10월 21일 값도 저녁 집계를 찾지 못해 지난 호의 장 마감 집계(6,600억 원 순매수)를 그대로 썼어요. KRX 금 1g은 발행 시점에 장 마감 값을 확인하지 못해 22일 낮 12시쯤 기사에 실린 시세를 썼어요. 국제 금은 12월물 선물이고, 기사에 소수점 아래 값이 없어 4,150달러로 적었어요. CNN 공포 탐욕 지수는 21일 장 마감 뒤 값을 확인하지 못해 뺐어요. 메타·테슬라의 시간외 등락률은 매체마다 달라 방향 위주로 적었어요. 코스닥 거래대금은 확인하지 못해 뺐어요. 비트코인은 22일 오전 11시 59분 시세예요.",

      body:"스페이스X가 20일(현지시간) 발표한 3분기 실적에서 매출은 146억 달러로 1년 전보다 161% 늘었고, 순이익 44억 달러로 상장 뒤 처음 분기 흑자를 냈어요. AI 부문 매출은 75억 6천만 달러로 1년 전의 9배가 넘었어요. 4분기 설비투자는 350억~400억 달러에 이를 수 있다고 했어요. 21일 주가는 7.79% 올랐어요. 일론 머스크는 실적 발표에서 테슬라와의 합병을 '좋은 아이디어'라고 했고, 두 회사 이사회는 각각 이를 검토할 특별위원회를 꾸렸어요.",
      more:"설비투자는 공장·데이터센터·장비처럼 오래 쓰는 시설에 쓰는 돈이에요. 요즘 시장의 가장 큰 질문은 'AI에 쏟는 막대한 설비투자가 실제 매출과 이익으로 돌아오느냐'인데, 스페이스X의 숫자는 이 질문에 긍정적인 답을 하나 보여준 셈이에요. 다만 합병은 아직 검토 단계로 조건이나 일정이 나오지 않았어요. 머스크는 합병하려면 테슬라 전체 주식의 50% 넘는 찬성이 필요해 '꽤 높은 문턱'이라고 했고, 21일 테슬라 실적 발표에서 더 설명하지 않자 테슬라 주가는 시간외에서 내렸어요.",
      why:"AI에 쓴 돈이 돌아온다는 신호가 나오면 AI 칩과 메모리 수요 기대도 함께 커져요. 미국 AI 회사들의 실적과 설비투자 계획은 삼성전자·SK하이닉스 같은 한국 반도체 회사의 주문으로 이어질 수 있어 한국 증시에도 영향을 줘요.",
      url:"https://www.kmjournal.net/news/articleView.html?idxno=13930", src:"KMJ" },
    { tag:"유럽 · 거시경제", title:"프랑스 10년 국채 금리 5% 돌파, 2002년 이후 처음",
      body:"21일(현지시간) 프랑스 10년 국채 금리가 장중 5.002%까지 올라 2002년 이후 가장 높았어요. 독일 10년 국채 금리와의 차이는 약 1.57%포인트로 벌어져, 2011년 이후 가장 큰 수준에 가까워졌어요. 큰 재정적자를 줄이기 어려운 데다, 힘이 약해진 정부가 예산안을 의회에서 통과시키지 못하고 있고, 내년 선거를 둘러싼 불확실성과 전국으로 번진 시위까지 겹쳤어요.",
      more:"국채 금리는 나라가 돈을 빌릴 때 내는 이자예요. 국채를 팔려는 사람이 많아져 가격이 내려가면 금리는 올라가요. 유럽에서는 재정이 탄탄한 독일 국채가 기준 역할을 해서, 독일과의 금리 차이가 벌어질수록 투자자들이 그 나라에 돈을 빌려주며 더 큰 위험 보상을 요구한다는 뜻이에요. 에너지 값이 뛰면서 주요국 중앙은행이 금리를 올려 세계 국채 금리가 함께 올랐는데, 그중에서도 프랑스의 오름폭이 컸어요. 23일에는 신용평가사 무디스가 프랑스 신용등급(Aa3)을 다시 평가할 예정이에요.",
      why:"유로존 2위 경제국의 나랏빚 불안은 유럽 전체 금리와 유로화 값을 흔들어요. 세계 채권 금리가 함께 오르면 주식시장의 부담이 커지고, 달러와 원화 환율에도 영향을 줄 수 있어요.",
      url:"https://www.g-enews.com/article/Global-Biz/2026/10/2026102120284822679a1f309431_1", src:"글로벌이코노믹" }
  ],

    note: "<b>이 코너는 특정 상품 추천이 아니라 경제 기본 지식을 공부하는 자료예요.</b> 본문에 나오는 사이트 이름은 숫자를 직접 확인하는 방법을 설명하기 위한 예시예요.",
    intro: "22일 한국은행은 기준금리를 올리지 않았는데, 기사들은 이를 '매파적 동결'이라고 불렀어요. 그리고 그날 코스피는 3.52% 내렸어요. 매파와 비둘기파가 무엇이고, 왜 말투만으로 시장이 움직이는지 차례로 풀어볼게요.",
    points: [
      { t:"1) 매파와 비둘기파가 뭐예요?", items:[
        "<mark>매파는 물가를 잡는 걸 더 중요하게 보고 금리를 올리거나 높게 두려는 쪽</mark>이에요. 사나운 매처럼 물가에 강하게 맞선다는 뜻이에요.",
        "<mark>비둘기파는 경기와 일자리를 더 걱정해 금리를 내리거나 낮게 두려는 쪽</mark>이에요. 온순한 비둘기처럼 부드럽게 대응한다는 뜻이에요. 영어로는 각각 hawk, dove라고 해요." ] },
      { t:"2) 말투는 어디서 드러나나요?", items:[
        "중앙은행은 금리를 정한 뒤 결정문을 내고, 총재가 기자회견을 해요. 결정문의 단어가 조금만 바뀌어도, 총재가 앞날을 어떻게 말하는지에 따라 시장은 다음 결정을 미리 짐작해요.",
        "위원들의 표가 갈렸는지도 단서예요. 동결 결정에서 '올리자'는 반대 의견(소수의견)이 나오면 매파 쪽 신호로, '내리자'는 의견이 나오면 비둘기파 쪽 신호로 읽혀요." ],
        box:{ label:"22일 한은은 어땠나요?", text:"금통위원 7명이 <b>만장일치</b>로 연 3.00% 동결을 결정했어요. 표는 갈리지 않았지만, 신현송 총재는 올해와 내년 성장률이 8월 전망보다 꽤 높고 2027년 근원물가도 전망(2.5%)을 넘을 것이라며 <b>긴축을 이어갈 필요</b>가 있다고 말했어요. 결정은 '동결'이지만 말투는 '매파'였던 거예요." } },
      { t:"3) 왜 이렇게 중요한가요?", items:[
