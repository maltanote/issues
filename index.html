<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>말타노트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 레이아웃: 가운데 한 단 종이. 형광펜색 머리띠(안내·제호·날짜·헤드라인) 아래로 01~08 번호 섹션이 차례로 이어지고, 맨 아래에 지난 호 목록. 오름=빨강, 내림=파랑(국내 증시 관례). */
:root{
  --bg:#e9ecf2; --paper:#ffffff; --soft:#f4f6fa; --ink:#131c2e; --sub:#56617a; --line:#d9dee8;
  --marker:#ffe45c; --band:#ffe45c; --band-ink:#131c2e; --band-note:#fff3a8;
  --accent:#1f4fd8; --up:#d92b3a; --down:#1e5fd0; --flat:#6b7385;
  --up-soft:#fde8ea; --down-soft:#e6eefc; --tip:#fff8d6;
  --heat-base:#2b3345; --heat-ink:#ffffff; --panel:#1a2233; --panel-ink:#eef1f7; --panel-sub:#a3adc2; --panel-up:#ff7a85; --panel-down:#7fb0ff;
  --f-display:"Hahmlet","Noto Serif KR",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0b0f18; --paper:#171e2d; --soft:#1e2637; --ink:#e9edf5; --sub:#9aa5bb; --line:#2a3447;
  --marker:#6b5a00; --band:#e6c93a; --band-ink:#131c2e; --band-note:#f3dd6e;
  --accent:#8fb0ff; --up:#ff6b78; --down:#6fa2ff; --flat:#9aa5bb;
  --up-soft:#3a1c22; --down-soft:#17284a; --tip:#2e2a14;
  --heat-base:#2b3345; --heat-ink:#ffffff; --panel:#0f1522; --panel-ink:#eef1f7; --panel-sub:#a3adc2; --panel-up:#ff7a85; --panel-down:#7fb0ff;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0b0f18; --paper:#171e2d; --soft:#1e2637; --ink:#e9edf5; --sub:#9aa5bb; --line:#2a3447;
  --marker:#6b5a00; --band:#e6c93a; --band-ink:#131c2e; --band-note:#f3dd6e;
  --accent:#8fb0ff; --up:#ff6b78; --down:#6fa2ff; --flat:#9aa5bb;
  --up-soft:#3a1c22; --down-soft:#17284a; --tip:#2e2a14;
  --heat-base:#2b3345; --heat-ink:#ffffff; --panel:#0f1522; --panel-ink:#eef1f7; --panel-sub:#a3adc2; --panel-up:#ff7a85; --panel-down:#7fb0ff;
  color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.75;padding-inline:16px;padding-block:24px 72px;word-break:keep-all}
p,h1,h2,h3,h4,ul{margin:0}
a{color:var(--accent)}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}
.small{font-size:12.5px;color:var(--sub)}
.center{text-align:center}

.sheet{max-width:720px;margin:0 auto;background:var(--paper);border-radius:10px;overflow:hidden}
/* 머리띠 */
.mast{background:var(--band);color:var(--band-ink);padding:22px 28px 24px;display:flex;flex-direction:column;gap:10px}
.mast .disc{font-size:12px;background:var(--band-note);border-radius:6px;padding:6px 12px}
.mast-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px 16px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:-.02em;line-height:1.25}
.brand small{font-family:var(--f-body);font-weight:500;font-size:13px;letter-spacing:0;margin-left:6px}
.mast .meta{font-size:13px;font-family:var(--f-num)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(19px,4.6vw,24px);line-height:1.4;text-wrap:balance}
.mast .lede{font-size:14.5px;max-width:60ch}
.old-banner{background:var(--soft);border-bottom:1px solid var(--line);padding:10px 28px;font-size:13.5px;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.linkbtn{font:inherit;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;font-weight:600}

.inner{padding:8px 28px 32px;display:flex;flex-direction:column}
.sec{display:flex;flex-direction:column;gap:16px;padding-block:30px;border-top:1px solid var(--line);scroll-margin-top:12px}
.sec:first-child{border-top:0}
h2{font-size:15.5px;font-weight:600;line-height:1.4;border-left:4px solid var(--marker);padding-left:10px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
h2 .n{font-family:var(--f-num);color:var(--sub);font-size:14px}
h3{font-family:var(--f-display);font-size:18px;font-weight:700;line-height:1.5;text-wrap:balance}
h4{font-size:14px;font-weight:600;line-height:1.5;border-left:3px solid var(--marker);padding-left:8px}
.body{display:flex;flex-direction:column;gap:12px}
.notice{font-size:13.5px;background:var(--tip);border-radius:6px;padding:10px 14px}
mark{background:linear-gradient(transparent 55%,var(--marker) 55%);color:inherit}

/* 01 지표 */
.board{display:grid;grid-template-columns:repeat(20,1fr);gap:8px}
.tile{grid-column:span 4;border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:1px;min-width:0}
.tile:nth-child(n+6){grid-column:span 5}
.tile .k{font-size:12px;color:var(--sub)}
.tile .v{font-family:var(--f-num);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.4}
.tile .c{font-family:var(--f-num);font-size:12.5px;font-variant-numeric:tabular-nums}
.tile .d{font-size:10.5px;color:var(--sub);line-height:1.4}
.board.b10 .tile:nth-child(n+6){grid-column:span 4}
@media (max-width:600px){.board{grid-template-columns:repeat(3,1fr);gap:6px}.tile,.tile:nth-child(n+6),.board.b10 .tile:nth-child(n+6){grid-column:span 1;padding:8px 9px}.tile .v{font-size:14px}.board.b10{grid-template-columns:repeat(2,1fr)}}
.notes{list-style:none;padding:0;display:flex;flex-direction:column;gap:12px}
.notes li{padding-left:12px;border-left:2px solid var(--line)}
.notes b{display:block;font-weight:600;font-size:14.5px}
.notes span{font-size:14px;color:var(--sub)}
.gold{display:flex;flex-direction:column;gap:12px}
.gstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.gstats>div{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:1px;min-width:0}
.gstats .k{font-size:12px;color:var(--sub)} .gstats .v{font-family:var(--f-num);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere} .gstats .s{font-size:11.5px;color:var(--sub);line-height:1.45}
.grange{border:1px solid var(--line);border-radius:8px;padding:14px 16px 10px;display:flex;flex-direction:column;gap:6px}
.grange .ttl{font-size:12.5px;color:var(--sub)}
.grange .trk{position:relative;height:10px;border-radius:999px;background:linear-gradient(to right,var(--down-soft),var(--up-soft));margin:26px 0 30px}
.grange .mk{position:absolute;top:50%;transform:translate(-50%,-50%);width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--sub)}
.grange .mk.now{width:16px;height:16px;background:var(--marker);border-color:var(--ink)}
.grange .lb{position:absolute;transform:translateX(-50%);font-size:11px;line-height:1.3;text-align:center;white-space:nowrap;color:var(--sub)}
.grange .lb.top{bottom:18px} .grange .lb.bot{top:18px}
.grange .lb b{display:block;font-family:var(--f-num);color:var(--ink);font-weight:600}
.grange .lb.e0{transform:none;text-align:left} .grange .lb.e1{transform:translateX(-100%);text-align:right}
.big{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:8px;padding:16px 18px}
.big .fig{font-family:var(--f-num);font-weight:600;font-size:clamp(36px,10vw,52px);line-height:1;letter-spacing:-.03em}
.big .fig small{font-family:var(--f-body);font-size:16px;font-weight:600;margin-left:4px;letter-spacing:0}
.big .txt{flex:1 1 240px;min-width:0;font-size:14.5px}
.big .txt b{display:block;font-size:15px}

/* 히트맵 */
.heat{display:flex;flex-wrap:wrap;gap:3px;background:var(--heat-base);padding:3px;border-radius:8px}
.heat div{color:var(--heat-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px 4px;min-width:0;line-height:1.3;border-radius:4px}
.heat .w1{flex:1 1 15%;min-height:58px;font-size:12px}
.heat .w2{flex:2 1 22%;min-height:72px;font-size:14px}
.heat .w3{flex:3 1 32%;min-height:96px;font-size:18px}
.heat b{font-weight:600;overflow-wrap:anywhere}
.heat span{font-family:var(--f-num);font-size:.82em;font-variant-numeric:tabular-nums}
@media (max-width:600px){.heat .w1{flex-basis:22%}.heat .w2{flex-basis:30%}.heat .w3{flex-basis:46%;font-size:16px}}

.sub-block{display:flex;flex-direction:column;gap:12px}
.card{border:1px solid var(--line);border-radius:8px;padding:16px}
/* 공포탐욕 */
.fg{display:flex;gap:8px 20px;align-items:center;flex-wrap:wrap}
.fg svg{flex:0 1 250px;min-width:200px;max-width:100%;height:auto}
.fg .side{flex:1 1 180px;min-width:0;display:flex;flex-direction:column;gap:4px;font-size:14px}
.fg .score{font-family:var(--f-num);font-weight:600;font-size:40px;line-height:1}
/* 수급 막대 */
.flow{display:flex;flex-direction:column;gap:14px}
.flow .r{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:baseline;font-size:15px}
.flow .track{position:relative;height:18px;grid-column:1/-1;order:3}
.flow .zero{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--sub)}
.flow .bar{position:absolute;top:0;bottom:0;border-radius:3px}
.flow .bar.up{background:var(--up)} .flow .bar.down{background:var(--down)}
.flow .val{text-align:right;font-family:var(--f-num);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.tip{background:var(--tip);border-left:4px solid var(--marker);border-radius:0 6px 6px 0;padding:10px 14px;font-size:14px}
.tip b{font-weight:600}
/* 장 마감 숫자 */
.close{background:var(--panel);color:var(--panel-ink);border-radius:8px;display:grid;grid-template-columns:1fr 1fr;gap:1px;overflow:hidden}
.close>div{padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.close .nm{font-weight:600;font-size:14px}
.close .px{font-family:var(--f-num);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums}
.close .px small{font-size:12.5px;margin-left:6px;font-weight:500}
.close dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0;font-size:13px}
.close dt{color:var(--panel-sub)} .close dd{margin:0;text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.close .up{color:var(--panel-up)} .close .down{color:var(--panel-down)}
.close .brd{font-size:12px;color:var(--panel-sub)}
@media (max-width:480px){.close{grid-template-columns:1fr}}

/* 04 한마디 */
.quote{font-family:var(--f-display);font-weight:500;font-size:16.5px;line-height:1.6;background:var(--tip);border-left:4px solid var(--marker);border-radius:0 6px 6px 0;padding:10px 14px}
.pt{display:flex;flex-direction:column;gap:8px}
/* 05 뉴스 */
.news{display:flex;flex-direction:column;gap:12px}
.news article{border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:8px}
.tag{font-size:11.5px;font-weight:600;color:var(--accent);letter-spacing:.02em}
.news h3{font-family:var(--f-body);font-size:15.5px;font-weight:600}
.news p{font-size:14.5px}
.why{background:var(--soft);border-radius:6px;padding:8px 12px}
.why b{font-weight:600}
.more{font-size:13px;font-weight:600;text-decoration:none}
/* 06 상식 카드 */
.tcard{background:var(--panel);color:var(--panel-ink);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:14px}
.tcard .eyebrow{font-size:12px;color:var(--panel-sub);font-family:var(--f-num)}
.tcard .tt{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,6vw,30px);line-height:1.3;text-wrap:balance}
.tcard .tt span{background:linear-gradient(transparent 62%,#8a7400 62%)}
.tcard .ts{font-size:14px;color:var(--panel-sub)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;list-style:none;padding:0;counter-reset:s}
.steps li{counter-increment:s;background:rgba(255,255,255,.07);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.5;display:flex;flex-direction:column;gap:2px}
.steps li::before{content:counter(s);font-family:var(--f-num);font-size:12px;color:#ffe45c}
.steps b{font-size:14px;font-weight:600}
.pt ul{padding-left:18px;display:flex;flex-direction:column;gap:6px}
.box{border:1.5px solid var(--up);border-radius:8px;padding:10px 14px;background:var(--up-soft);font-size:14px;display:flex;flex-direction:column;gap:4px}
.box .lb{align-self:flex-start;background:var(--up);color:var(--paper);font-size:11.5px;font-weight:600;border-radius:999px;padding:1px 8px}
.arrow{font-size:14px;color:var(--sub)}
/* 07 일정 */
.cal{display:flex;flex-direction:column;gap:8px}
.cal>div{border:1px solid var(--line);border-radius:8px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.cal .h{display:flex;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;align-items:baseline}
.cal .dt{font-weight:600;font-size:14px;font-family:var(--f-num)}
.cal .t{font-weight:600;font-size:14px;color:var(--accent);text-align:right}
.cal .key .t{color:var(--up)}
.cal .badge{font-family:var(--f-body);font-size:11px;background:var(--tip);border-radius:4px;padding:1px 6px;margin-left:6px;font-weight:600}
.cal p{font-size:13.5px;color:var(--sub)}
/* 08 퀴즈 */
.quiz{display:flex;flex-direction:column;gap:22px}
.q{display:flex;flex-direction:column;gap:8px}
.q h3{font-family:var(--f-body);font-size:15px;font-weight:600}
.q h3 .badge{font-size:11px;background:var(--tip);border-radius:4px;padding:1px 6px;margin-left:6px;font-weight:600;white-space:nowrap}
.opts{display:flex;flex-direction:column;gap:6px}
.opts button{font:inherit;font-size:14.5px;color:var(--ink);text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 14px;cursor:pointer}
.opts button:hover{border-color:var(--accent)}
.opts button.right{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);font-weight:600}
.opts button.wrong{opacity:.55;text-decoration:line-through}
.q .res{font-size:14px;background:var(--soft);border-radius:6px;padding:8px 12px}
/* 지난 호 */
.arch{list-style:none;padding:0;display:flex;flex-direction:column;gap:6px}
.arch button{width:100%;font:inherit;font-size:14.5px;color:var(--ink);text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 14px;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline}
.arch button:hover{border-color:var(--accent)}
.arch button[aria-current="true"]{background:var(--tip);border-color:transparent}
.arch .no{font-family:var(--f-num);font-weight:600;font-size:13px;color:var(--accent);white-space:nowrap}
.arch .ti{min-width:0}
.arch .dt{font-family:var(--f-num);font-size:12px;color:var(--sub);white-space:nowrap}
footer{border-top:1px solid var(--line);padding-top:20px;display:flex;flex-direction:column;gap:10px;font-size:12.5px;color:var(--sub)}
footer ul{padding-left:18px}
/* 목차 */
.toc-btn{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));font:inherit;font-size:13px;font-weight:600;background:var(--ink);color:var(--paper);border:0;border-radius:999px;padding:8px 14px;cursor:pointer;z-index:5}
.toc{position:fixed;right:16px;bottom:calc(60px + env(safe-area-inset-bottom,0px));background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;z-index:5;max-width:calc(100vw - 32px);box-shadow:0 6px 24px rgba(0,0,0,.18)}
.toc a{color:var(--ink);text-decoration:none;font-size:14px;padding:6px 12px;border-radius:6px}
.toc a:hover{background:var(--soft)}
.toc a span{font-family:var(--f-num);color:var(--sub);font-size:12px;margin-right:8px}
</style>
</head>
<body>

<div class="sheet" id="app"></div>
<button type="button" class="toc-btn" id="toc-btn" aria-expanded="false" aria-controls="toc">☰ 목차</button>
<nav class="toc" id="toc" hidden aria-label="목차"></nav>

<script>
/* =====================================================================
   발행 방법: ISSUES 배열 맨 앞(아래 표시 줄 바로 다음)에 새 호 객체를 하나 추가합니다.
   이전 호 객체와 그 아래 렌더 코드는 건드리지 않습니다. 최신 호가 배열의 첫 번째입니다.
   ===================================================================== */
const ISSUES = [
/*@@NEW_ISSUE_BELOW@@*/
{
  no: 11, id: "261019",
  date: "2026. 10. 19 (월)",
  headline: "장 초반 3% 급락을 딛고, 코스피 1.76% 올라 5,768로 마감했어요",
  lede: "간밤 나스닥이 AI 빚 걱정에 2.15% 내리자 코스피는 3.17% 내린 5,488로 출발했지만, 기관과 기타법인이 사들이며 1.76% 오른 5,768.01로 이틀째 반등했어요. 반도체는 조금 오르는 데 그쳤고 2차전지·바이오·자동차가 반등을 이끌었으며, 원/달러 환율은 1,330.3원으로 약 2년 만에 가장 낮은 종가를 기록했어요.",

  news: [
    { tag:"미국 · 주식", title:"코어위브 부도 보험료 사상 최고, 'AI 빚 걱정'에 나스닥 2% 넘게 하락",
      body:"AI 클라우드 회사 코어위브의 5년 만기 신용부도스와프(CDS) 프리미엄이 15일(현지시간) 장중 1,194.5bp까지 올라 사상 최고를 기록했어요. 시장이 앞으로 5년 안에 이 회사가 빚을 갚지 못할 가능성을 60% 넘게 보고 있다는 뜻으로 해석돼요. 코어위브의 2031년 만기 회사채는 액면가의 82.75% 수준에서 거래돼 수익률이 14.5%로 올랐어요. 16일에도 CDS 값이 다시 사상 최고를 쓰자 코어위브 주가는 11.91% 내렸고, 한 주 동안 약 25% 빠졌어요.",
      more:"CDS는 돈을 빌려준 쪽이 떼일 경우를 대비해 드는 보험 같은 계약이에요. 보험료(프리미엄)가 오를수록 시장이 그 회사의 부도 위험을 크게 본다는 뜻이에요. 미국 신용평가사 S&P의 데이터 담당 임원은 이 값이 1,000bp를 넘으면 보통 신용이 막히는 신호로 본다고 설명했어요. 코어위브는 엔비디아 칩을 사들여 AI 회사들에 컴퓨팅 능력을 빌려주는데, 그 돈의 많은 부분을 빚으로 마련해요. 올해 미국에서 데이터센터 같은 사업을 위해 발행된 회사채는 1,060억 달러로 지난해의 약 3배라는 집계도 나왔어요. 오늘 '경제 상식 한 조각'에서 CDS를 자세히 풀었어요.",

    { tag:"거시경제 · 중국", title:"중국 3분기 성장률 4.5%, 예상 웃돌아… 수출이 받치고 내수는 약해",
      body:"중국 국가통계국은 19일 3분기 국내총생산(GDP)이 1년 전보다 4.5% 늘었다고 발표했어요. 시장 예상(4.4%)을 조금 넘었고, 약 3년 만에 가장 낮았던 2분기(4.3%)보다 빨라졌어요. 1~9월 성장률은 4.6%로 올해 목표(4.5~5%) 안에 들어 있어요. 9월 산업생산은 1년 전보다 5.5%, 소매판매는 1.1% 늘어 예상(소매판매 0.5~0.6%)보다 좋았어요.",

      why:"중국은 한국의 가장 큰 교역 상대 가운데 하나예요. 중국 경기가 버티면 한국의 중간재 수출에 도움이 되지만, 중국 수출이 너무 강하면 세계 시장에서 한국 기업과 경쟁이 거세질 수 있어요.",

    { tag:"한국 · 주식", title:"'중국 ESS 미국 철수' 보도에 2차전지 급등, 삼성SDI 11%·LG엔솔 7%",
      body:"19일 2차전지 종목이 크게 올랐어요. 삼성SDI가 11.70%, 포스코퓨처엠이 10.90%, LG화학이 8.46%, LG에너지솔루션이 7.20% 올랐고, 코스닥의 에코프로(+11.19%)와 에코프로비엠(+8.33%)도 뛰었어요. 대만 IT 전문 매체 디지타임스가 미국 공급망 업계 관계자를 인용해, 중국 대형 에너지저장장치(ESS) 회사들이 올해 들어 미국 시장에서 사실상 집단 철수했다고 보도한 영향이에요.",
      more:"ESS는 전기를 배터리에 담아 두었다가 필요할 때 꺼내 쓰는 장치예요. AI 데이터센터가 늘면서 전기를 안정적으로 대는 ESS 수요도 커지고 있어요. 보도에 따르면 미국의 강한 규제와 관세, 엄격한 지분 심사에 중국 정부의 배터리 기술 이전 통제까지 겹쳐 중국 회사들이 미국 현지 생산을 하기 어려워졌어요. 2026년 1분기 북미 ESS 배터리 점유율은 LG에너지솔루션 약 14%, 삼성SDI 약 6%였어요. 다만 철수한 회사의 이름과 사업 규모는 구체적으로 확인되지 않았고, 삼성SDI는 15~16일 급락 때 10% 넘게 내렸던 터라 싸게 사려는 매수도 섞였다는 분석이에요.",
      why:"2차전지는 반도체 다음으로 코스피에서 비중이 큰 업종 가운데 하나예요. 반도체가 흔들릴 때 다른 업종이 지수를 받쳐 줄 수 있는지 보여준 하루였어요. 다만 보도에 기댄 상승은 실제 수주 소식으로 확인되기 전까지 흔들릴 수 있어요.",

  term: {
    name: "신용부도스와프(CDS), 빚을 떼일 걱정에 매기는 '보험료' 읽는 법",
    card: { eyebrow:"경제 상식 한 조각 · 2026.10.19", title:"빚을 떼일까 걱정되면<br><span>보험료부터 오른다</span>", sub:"CDS 프리미엄이 회사의 부도 위험을 숫자로 보여주는 순서",
      steps: [ { k:"돈을 빌려줌", x:"회사채를 사거나 대출을 해 줘요" }, { k:"보험 가입", x:"떼일 때를 대비해 CDS를 사요" }, { k:"보험료", x:"위험이 클수록 프리미엄이 올라요" }, { k:"시장 신호", x:"주가·회사채 금리가 함께 움직여요" } ] },
    note: "<b>이 코너는 특정 상품 추천이 아니라 경제 기본 지식을 공부하는 자료예요.</b> 본문에 나오는 사이트 이름은 숫자를 직접 확인하는 방법을 설명하기 위한 예시예요.",
    intro: "지난주 미국 증시를 흔든 말 가운데 하나가 'CDS 사상 최고'였어요. 주식도 채권도 아닌 이 숫자가 왜 나스닥을 2% 넘게 끌어내렸는지 차례로 풀어볼게요.",
    points: [
      { t:"1) CDS가 뭐예요?", items:[
        "CDS는 Credit Default Swap의 줄임말로, 우리말로는 신용부도스와프라고 해요. <mark>돈을 빌린 회사나 나라가 빚을 갚지 못하면 손실을 대신 메워 주기로 한 계약</mark>이에요.",
        "자동차 보험과 비슷해요. 보험에 든 사람이 해마다 보험료를 내고, 사고가 나면 보험사가 손해를 갚아 주잖아요. CDS를 산 쪽은 정기적으로 보험료를 내고, 실제로 부도가 나면 판 쪽에게서 손실을 보상받아요.",
        "이때 내는 보험료를 'CDS 프리미엄'이라고 부르고, 보통 bp(베이시스포인트)로 적어요. 1bp는 0.01%포인트예요. 1억 달러를 빌려준 은행이 500bp짜리 CDS를 사면 1년에 500만 달러를 보험료로 내는 셈이에요." ] },
      { t:"2) 값은 어떻게 움직이나요?", items:[
        "회사가 빚을 못 갚을 것 같다는 걱정이 커지면 보험을 팔려는 쪽이 더 높은 보험료를 요구해요. 그래서 <mark>CDS 프리미엄이 오르면 시장이 그 회사의 부도 위험을 더 크게 본다</mark>는 뜻이에요.",
        "CDS는 시장에서 날마다 사고팔려서, 신용평가사가 등급을 바꾸기 전에 먼저 움직일 때가 많아요. 그래서 위험을 미리 알려 주는 경보등처럼 쓰여요." ],
        box:{ label:"채권이 없어도 사고팔 수 있어요", text:"보험은 보통 자기 차가 있어야 들 수 있지만, CDS는 그 회사의 채권을 갖고 있지 않아도 사고팔 수 있어요. 그래서 헤지펀드가 주식 손실을 줄이려고 사거나, 부도 위험이 커질 것이라는 쪽에 돈을 걸려고 사기도 해요. 2008년 미국 금융위기 때는 이런 거래가 얽히고설켜 위기를 키운 원인 가운데 하나로 꼽혔어요." } },
      { t:"3) 왜 중요한가요?", items:[
        "CDS 프리미엄은 <mark>그 회사가 돈을 빌리는 값</mark>과 함께 움직여요. 보험료가 오르면 그 회사 회사채를 사려는 사람들도 더 높은 이자를 요구해서, 새로 돈을 빌리기 어려워져요.",
        "빚을 내서 크게 투자하는 회사일수록 이 영향이 커요. 돈줄이 막히면 투자를 줄여야 하고, 그 회사에 물건을 파는 회사들의 주문도 함께 줄 수 있어요." ],
        arrow:"주가가 '앞으로 얼마나 벌까'를 묻는다면, CDS는 '빌린 돈을 갚을 수 있을까'를 묻는 숫자예요." },
      { t:"4) 요즘 왜 뉴스에 나오나요?", items:[
        "AI 클라우드 회사 코어위브의 5년 만기 CDS 프리미엄이 15일(현지) 장중 1,194.5bp까지 올라 사상 최고를 기록했고, 16일에도 다시 최고치를 썼어요. 시장이 이 회사가 5년 안에 빚을 갚지 못할 가능성을 60% 넘게 보고 있다는 해석이 나왔어요.",
        "S&P 글로벌 마켓 인텔리전스의 한 임원은 이 값이 1,000bp를 넘으면 보통 신용이 막히는 신호로 본다고 설명했어요. 블룸버그 보도에 따르면 마이크로소프트, 엔비디아, 메타, 아마존 같은 대형 회사의 CDS 프리미엄도 2025년 가을 이후 크게 올라 일부는 두 배 넘게 뛰었어요. AI에 쓰는 돈이 빚으로 채워지고 있다는 걱정이 숫자로 드러난 거예요." ] },
      { t:"5) 우리에게는 어떤 영향이 있나요?", items:[
        "미국 AI 회사들이 돈을 빌리기 어려워지면 데이터센터 투자가 늦춰질 수 있어요. 그러면 칩과 메모리 주문이 줄 수 있다는 걱정이 SK하이닉스와 삼성전자 주가에 먼저 반영돼요. 16일 뉴욕에 상장된 SK하이닉스 주식예탁증서가 6.58% 내린 것도 이 흐름이에요.",
        "나라에도 CDS가 있어요. 한국 정부가 발행한 채권의 CDS 프리미엄은 외국인 투자자가 한국을 얼마나 안전하게 보는지 보여주는 숫자로 쓰여요. 이 값이 크게 오르면 외국인 자금이 빠지고 환율이 오르기 쉬워요.",
        "내 돈과 거리가 멀어 보여도, 회사채 펀드나 지수를 따라가는 펀드, 퇴직연금에 이런 회사들이 들어 있을 수 있어요." ] },
      { t:"6) 숫자는 이렇게 읽어요", items:[
        "<mark>수준보다 속도</mark>를 먼저 봐요. 같은 500bp라도 몇 달에 걸쳐 오른 것과 며칠 만에 뛴 것은 시장이 받는 충격이 달라요.",
        "기사에 나오는 '부도 확률 60%'는 CDS 값에서 거꾸로 계산한 숫자예요. 실제로 그 회사가 부도 날 확률을 예측한 게 아니라, 지금 시장이 매긴 보험료가 그 정도 위험을 반영하고 있다는 뜻이에요.",
        "CDS 하나만 보지 말고 같은 회사의 회사채 값과 주가, 비슷한 회사들의 CDS가 함께 움직이는지 봐요. 한 회사만 오르면 그 회사의 문제, 여러 회사가 함께 오르면 업종 전체의 걱정일 가능성이 커요." ],
        box:{ label:"기사에서 볼 세 가지", text:"<b>얼마나</b>: 지금 몇 bp이고, 1,000bp 같은 경계선을 넘었나요? <b>얼마나 빨리</b>: 며칠 사이에 얼마나 올랐나요? <b>얼마나 넓게</b>: 비슷한 회사들의 CDS와 회사채 값도 함께 흔들리나요? 이번 코어위브는 '1,194.5bp', '며칠 새 사상 최고', '비슷한 회사 채권도 하락'이었어요." } },
      { t:"7) 어디서 직접 확인할 수 있나요?", items:[
        "<b>국제금융시장과 한국 관련 위험 지표</b>: 국제금융센터 누리집에서 국제금융시장 동향과 분석 보고서를 볼 수 있어요. <a href='https://www.kcif.or.kr' target='_blank' rel='noopener'>kcif.or.kr →</a>",
        "<b>국내 금융시장의 위험 진단</b>: 한국은행이 해마다 내는 금융안정보고서에서 국내외 금융시장의 위험 요인을 정리해 볼 수 있어요. <a href='https://www.bok.or.kr' target='_blank' rel='noopener'>bok.or.kr →</a>" ],
        arrow:"'CDS 사상 최고'라는 제목을 보면, 그 회사만의 일인지 비슷한 회사들까지 함께 오르는지부터 확인해 보세요." }
    ]
  },

  quizIntro: "오늘 내용에서 세 문제예요. 답을 고르면 풀이가 나와요.",

      body:"미국 노동부가 15일(현지시간) 발표한 9월 생산자물가지수(PPI)는 한 달 전보다 1.3%, 1년 전보다 6.3% 올랐어요. 한 달 상승폭은 2022년 3월 이후 가장 크고, 1년 전 대비 예상치(5.5%)를 크게 넘었어요. 상품 가격이 2.6%, 서비스 가격이 0.8% 올랐고, 에너지 상품은 10.8%, 생산 단계의 휘발유는 20.3% 뛰었어요. 식품·에너지·유통 서비스를 뺀 근원 생산자물가도 한 달 전보다 0.5%, 1년 전보다 5.0% 올랐어요. 같은 날 나온 9월 소매판매는 7,450억 달러로 한 달 전보다 0.8% 늘어 예상(0.3%)을 넘었어요.",

      body:"젠슨 황 엔비디아 CEO는 15일(현지시간) 스웨덴 스톡홀름에서 열린 행사에서 코어위브의 재무 역량과 체력이 날마다 강해지고 있다고 말했어요. 그는 아주 낙관적이라며 코어위브의 자본 조달 비용이 낮아지는 추세라고 했고, 엔비디아가 코어위브에 재무 보증을 하거나 뒤를 받쳐 줄 필요가 전혀 없다고 덧붙였어요. 전날 15% 넘게 내렸던 코어위브 주가는 장중 9%대까지 밀렸다가 5.94% 올라 69.70달러에 마감했어요.",
      more:"코어위브는 엔비디아 칩을 대량으로 사들여 AI 회사들에 컴퓨팅 능력을 빌려주는 클라우드 회사예요. 칩과 데이터센터에 쓰는 돈을 상당 부분 빚으로 마련해요. 전날 이 회사의 회사채 수익률이 15% 위로 뛰자, 시장은 금리가 오르는 상황에서 AI 회사들이 빚을 계속 감당할 수 있을지 의심했어요. 회사채 수익률이 높다는 건 투자자들이 그만큼 높은 이자를 요구한다는 뜻이에요. 마켓워치에 따르면 코어위브의 2분기 현금흐름은 6억 7,900만 달러였는데, 설비투자에는 94억 달러를 썼어요.",
      why:"코어위브 같은 회사가 칩을 사야 엔비디아가 팔고, 엔비디아가 팔아야 SK하이닉스와 삼성전자의 메모리도 팔려요. 그래서 미국 AI 회사의 빚 걱정이 한국 반도체 주가까지 이어져요. 다만 한 사람의 발언보다 회사가 실제로 돈을 얼마에 빌리는지를 지켜보는 게 중요해요.",
      url:"https://www.mediapen.com/news/view/1130350", src:"미디어펜" },
    { tag:"한국 · 부동산", title:"9월 코픽스 3.43%로 0.25%p 올라, 주담대 변동금리 또 오른다",
      body:"은행연합회가 15일 발표한 9월 신규취급액 기준 코픽스(COFIX)는 3.43%로 한 달 전보다 0.25%포인트 올랐어요. 2024년 6월(3.52%) 이후 2년 3개월 만에 가장 높고, 한 달 상승폭은 2022년 11월(0.36%포인트) 이후 가장 커요. 잔액 기준 코픽스는 3.15%로 0.10%포인트, 신잔액 기준 코픽스는 2.79%로 0.08%포인트 올랐어요.",
      more:"코픽스는 국내 8개 은행이 예금이나 은행채로 돈을 모을 때 든 비용(조달 금리)을 평균 낸 숫자예요. 은행은 이 숫자에 이익(가산금리)을 더해 변동금리 대출 이자를 정해요. 그래서 코픽스가 오르면 여기에 연동된 주택담보대출 변동금리가 따라 오르게 돼요. 코픽스는 예금 금리와 은행채 금리를 따라 움직여요. 신규취급액 기준은 그달 새로 모은 돈의 비용이라 시장 금리 변화가 빨리 반영되고, 잔액 기준은 이미 모아 둔 돈까지 평균해서 천천히 움직여요. 신규취급액 기준 코픽스는 4~7월 넉 달 연속 오른 뒤 8월에 멈췄다가 9월에 다시 올랐어요.",
      why:"변동금리로 집 대출을 받았다면 다음 금리 조정 때 이자가 늘 수 있어요. 앞으로 대출을 받을 계획이라면 신규취급액 기준과 신잔액 기준 가운데 어느 쪽에 연동되는지, 고정금리와 비교하면 어떤지 따져 볼 때예요.",
      url:"https://www.segye.com/newsView/20261015516995", src:"세계일보" }
  ],
  term: {
    name: "생산자물가지수(PPI), 물건값이 소비자에게 오기 전 '공장 문 앞 가격' 읽는 법",
    card: { eyebrow:"경제 상식 한 조각 · 2026.10.16", title:"내가 사기 전에<br><span>먼저 오르는 물가</span>", sub:"생산 단계의 값이 소비자 가격과 금리로 이어지는 순서",

    note: "<b>이 코너는 특정 상품 추천이 아니라 경제 기본 지식을 공부하는 자료예요.</b> 본문에 나오는 사이트 이름은 숫자를 직접 확인하는 방법을 설명하기 위한 예시예요.",
    intro: "어제 호에서 소비자물가 속 '근원물가'를 다뤘다면, 오늘은 그보다 한 단계 앞에서 움직이는 생산자물가예요. 미국 9월 생산자물가가 6.3% 오르며 뉴스에 크게 나왔어요. 이 숫자가 무엇을 재고, 왜 시장이 신경 쓰는지 차례로 풀어볼게요.",
    points: [
      { t:"1) 생산자물가지수가 뭐예요?", items:[
        "생산자물가지수(PPI)는 <mark>기업이 물건과 서비스를 만들어 다른 기업이나 유통 단계에 팔 때 받는 값의 변화</mark>를 숫자로 나타낸 거예요. 소비자가 가게에서 내는 값이 아니라, 그보다 앞 단계의 값이에요.",
        "빵으로 치면 소비자물가가 빵집 진열대 가격이라면, 생산자물가는 밀가루 공장이 빵집에 넘기는 값과 빵집이 도매로 넘기는 값에 가까워요.",
        "미국은 노동부 노동통계국(BLS)이 매달 발표하고, 한국은 한국은행이 매달 생산자물가지수를 내놔요." ] },
      { t:"2) 소비자물가와는 어떻게 이어지나요?", items:[
        "기업은 원가가 오르면 그 부담을 시간을 두고 판매 가격에 얹으려고 해요. 그래서 생산자물가가 먼저 오르고 몇 달 뒤 소비자물가가 따라 오르는 경우가 많아요.",
        "하지만 늘 그대로 옮겨 가지는 않아요. 경쟁이 치열하거나 소비자가 지갑을 닫으면, 기업이 가격을 못 올리고 이익을 줄여 부담을 떠안기도 해요." ],
        box:{ label:"미국 '근원 PPI'는 세 가지를 빼요", text:"미국 소비자물가의 근원 지표는 식품과 에너지를 빼지만, 생산자물가에서 자주 보는 근원 지표는 <b>식품·에너지·유통 서비스(trade services)</b>까지 빼요. 유통 서비스는 도매·소매 회사가 얹는 마진이라 크게 출렁이기 때문이에요. 이번 9월에도 근원 PPI는 한 달 전보다 0.5% 올라, 전체(1.3%)보다 훨씬 덜 올랐어요. 기사에 '근원'이 나오면 무엇을 뺀 숫자인지 확인해 보세요." },
        arrow:"생산자물가는 '앞으로 올 수 있는 물가'를 미리 보여주는 신호등 같은 숫자예요." },
      { t:"3) 왜 중요한가요?", items:[

        "주식 시장에는 기업 이익의 단서예요. 원가가 오르는데 가격을 못 올리면 이익률이 줄어요. 그래서 PPI가 크게 오르면 원가 부담이 큰 업종이 먼저 긴장해요." ] },
      { t:"4) 요즘 왜 뉴스에 나오나요?", items:[

      { t:"5) 우리에게는 어떤 영향이 있나요?", items:[

        "<b>한국 생산자물가</b>: 한국은행 경제통계시스템(ECOS)에서 '생산자물가지수'를 찾으면 달마다의 숫자와 품목별 흐름을 볼 수 있어요. <a href='https://ecos.bok.or.kr' target='_blank' rel='noopener'>ecos.bok.or.kr →</a>" ],

      body:"15일 코스닥은 낮 12시 23분, 코스피는 12시 38분에 지수가 8% 넘게 내려 서킷브레이커 1단계가 차례로 발동됐어요. 두 시장 모두 20분 동안 거래가 멈췄어요. 코스피는 올해 10번째, 역대 16번째 서킷브레이커예요. 두 시장은 각각 7.57%, 7.65% 내린 5,554.22와 760.82로 마쳤어요. 코스피 시가총액은 4,581조 원으로 하루 만에 약 376조 원 줄었어요.",
      more:"서킷브레이커는 지수가 전날보다 8%, 15%, 20% 넘게 내린 상태가 1분 이어지면 단계별로 거래를 멈추는 장치예요. 1·2단계는 20분 동안 모든 거래를 멈춘 뒤 다시 열고, 3단계가 걸리면 그날 장이 끝나요. 13일 호에서 다룬 사이드카가 컴퓨터 주문만 5분 멈춘다면, 서킷브레이커는 시장 전체를 멈추는 더 센 브레이크예요. 올해 코스피는 3월 4일 하루 12.06%, 7월 28일 10.84% 내린 적도 있어요. 증권가에서는 낙폭이 커서 기술적인 반등은 나올 수 있지만, 흐름이 빠르게 바뀌긴 어렵다는 의견이 많아요.",
      why:"서킷브레이커는 시장이 공포에 휩쓸린 날 잠깐 숨을 고르게 해 주지만, 가격의 방향을 바꾸지는 못해요. 지수를 따라가는 펀드나 퇴직연금도 하루에 7% 넘게 흔들렸을 수 있어요.",
      url:"https://www.pinpointnews.co.kr/news/articleView.html?idxno=495677", src:"핀포인트뉴스" },
    { tag:"한국 · 부동산", title:"9월 가계대출 2조 2천억 원 줄어, 9개월 만에 첫 감소",
      body:"금융위원회가 15일 발표한 '9월 가계대출 동향(잠정)'에 따르면 전체 금융권 가계대출은 한 달 전보다 2조 2,000억 원 줄었어요. 지난해 12월 이후 처음 줄어든 거예요. 주택담보대출은 3조 3,000억 원 늘었지만 8월(4조 3,000억 원)보다 늘어난 폭이 1조 원쯤 작아졌어요. 신용대출 같은 기타대출은 5조 5,000억 원 줄었는데, 그중 신용대출만 3조 원이 줄었어요.",
      more:"금융당국은 주택 거래와 입주 물량이 줄었고, 분기 말에 금융회사들이 못 받을 대출을 정리했으며, 추석 상여금으로 빚을 갚은 사람이 많았던 계절 요인을 이유로 꼽았어요. 증시가 약해지면서 빚을 내 투자하려는 열기가 식은 것도 신용대출이 줄어든 배경으로 거론돼요. 한편 당국은 올해 가계대출 증가율 관리 목표를 1.5%에서 3.0% 수준으로 높여, 연말에 대출이 막히는 일은 크지 않을 거라고 설명했어요.",
      why:"집을 살 때 받는 주택담보대출은 아직 늘고 있지만 속도가 느려졌어요. 대출 흐름은 집값의 앞날을 가늠하는 단서라서, 내 집 마련을 준비한다면 금리와 함께 지켜볼 숫자예요.",
      url:"https://www.fnnews.com/news/202610151004337165", src:"파이낸셜뉴스" }
  ],

    { tag:"미국 · 경제", title:"오늘 밤 미국 9월 소비자물가 발표, 휘발유 값에 3.6% 상승 전망",

      more:"전체 물가와 근원 물가를 나눠 보는 이유가 있어요. 기름값과 먹거리 값은 날씨나 전쟁 같은 일로 크게 오르내려서, 이걸 빼야 물가의 바탕 흐름이 잘 보여요. 이번처럼 전체 물가는 크게 오르는데 근원 물가는 덜 오르면, '기름값 때문에 잠깐 오른 것인지, 물가 전체가 다시 뜨거워지는 것인지'를 두고 해석이 갈려요. 연준은 9월에 약 3년 만에 금리를 올렸고, 다음 금리 결정은 10월 28일(현지)이에요.",
      why:"물가가 예상보다 높으면 연준이 금리를 더 올릴 수 있다는 걱정이 커지고, 미국 금리와 달러가 오르면서 외국인이 한국 주식을 팔기 쉬워져요. 엿새째 이어진 코스피 하락이 멈출지에도 이 숫자가 영향을 줘요.",
      url:"https://www.slist.kr/news/articleView.html?idxno=773409", src:"싱글리스트" },
    { tag:"한국 · 부동산", title:"LH 사장 '집값 급락 가능성' 발언에 전문가들 '시장과 거리 있다'",
      body:"이성훈 한국토지주택공사(LH) 사장이 12일 국회 국정감사에서 '앞으로 집값이 급락할 가능성이 좀 많다'고 말해 논란이 됐어요. 생애 처음 집을 사는 사람의 대출 규제를 강화하자는 자신의 기존 발언을 설명하면서, 금리가 오르고 있고 공급을 열심히 하고 있다는 점을 근거로 들었어요. 다만 LH의 올해 공공주택 착공 실적은 10월 기준으로 목표(전국 9만 6,000호)의 4분의 1 수준이에요.",
      more:"전문가들은 대체로 급락 가능성을 낮게 봤어요. 집을 짓는 데는 시간이 오래 걸려서 지금 공급을 늘려도 바로 효과가 나기 어렵다는 거예요. 우리나라는 금리가 바뀌면 바로 이자가 바뀌는 변동금리 대출 비중이 낮고, 소득에 맞춰 대출을 묶는 DSR 규제도 있어서 빚 부담 때문에 집을 한꺼번에 내놓는 일이 생기기 어렵다는 분석도 나왔어요. 수도권 아파트값은 2025년 2월 이후 19개월 연속 올랐어요.",
      why:"공공기관장의 집값 전망은 내 집 마련을 고민하는 사람들의 판단에 영향을 줄 수 있어요. 한 사람의 전망보다 착공·입주 물량, 대출 금리 같은 숫자를 함께 보는 게 좋아요.",
      url:"https://www.ebn.co.kr/news/articleView.html?idxno=1727787", src:"EBN" }

      more:"PF는 땅을 사고 건물을 짓는 데 필요한 돈을, 앞으로 분양해서 벌 돈을 담보로 빌리는 방식이에요. 자기자본비율 규제는 시행사가 자기 돈을 일정 비율 이상 넣어야 대출을 쉽게 받게 하는 제도예요. 자기 돈을 많이 넣게 하면 사업이 안전해지지만, 당장은 사업을 시작하기 어려워져 주택 공급이 늦어질 수 있어요. 6월 말 PF 대출 잔액은 115조 8천억 원으로 2023년 말 이후 처음 늘었고, 연체율은 4.56%로 조금 낮아졌어요.",
      why:"정부가 규제를 미룬 건 주택 공급이 막히지 않게 하려는 거예요. 아파트가 계획대로 지어져야 몇 년 뒤 분양과 입주 물량이 나와요. 다만 규제를 늦추는 만큼 PF 부실이 쌓이지 않는지도 함께 지켜봐야 해요.",
      url:"https://news.sbs.co.kr/news/endPage.do?news_id=N1008795153", src:"SBS" }

    intro: "오늘 아침 코스피에 두 달 만에 매도 사이드카가 걸렸어요. 사이드카가 무엇을 멈추는지, 서킷브레이커와는 무엇이 다른지 차례로 풀어볼게요.",
    points: [
      { t:"1) 사이드카가 뭐예요?", items:[

        "프로그램 매매는 컴퓨터가 미리 정한 조건에 따라 여러 종목을 한꺼번에 사고파는 거래예요. 금액이 크고 빨라서, 시장이 급할 때 한쪽으로 쏠리면 충격을 키울 수 있어요." ] },
      { t:"2) 언제, 어떻게 걸리나요?", items:[

        "하루에 한 번만 걸리고(매수·매도는 따로 세요), 장 시작 후 5분과 장 마감 40분 전부터는 걸리지 않아요." ],
        box:{ label:"멈추는 건 '컴퓨터 주문'뿐이에요", text:"사이드카가 걸려도 개인이 휴대폰이나 컴퓨터로 내는 주문은 평소처럼 할 수 있어요. 멈추는 건 프로그램 매매 호가의 효력뿐이에요. 그래서 사이드카는 가격의 방향을 바꾸지 못해요. 쏠림의 속도를 잠깐 늦춰 줄 뿐이에요. 오늘도 사이드카 뒤에 지수가 더 내려 장중 5,911까지 밀렸어요." } },
      { t:"3) 서킷브레이커와는 뭐가 달라요?", items:[

        "사이드카는 오를 때도 내릴 때도 걸리지만, 서킷브레이커는 내릴 때만 걸려요. 오늘 코스피는 장중 7.41%까지 내려 서킷브레이커 1단계(8%) 바로 앞까지 갔어요." ],

  news: [
    { tag:"한국 · 기업", title:"중국 CXMT '차세대 D램 기술 진전' 발표, 삼성전자·SK하이닉스 4%대 하락",
      body:"중국 메모리 회사 창신메모리(CXMT)가 12일 차세대 D램 구조인 '4F²'에서 핵심적인 진전을 이뤘다고 밝혔어요. 스스로 개발한 수직 구조의 트랜지스터를 써서 셀 면적과 새는 전류를 줄였다는 설명이에요. CXMT는 이 기술을 쓴 서버용 DDR5 메모리 모듈을 2026년 말에 내놓겠다고 했지만, 자세한 사양과 양산 일정은 밝히지 않았어요. 이 소식이 전해진 뒤 삼성전자는 4.39%, SK하이닉스는 4.52% 내려 마감했어요.",
      more:"D램은 아주 작은 방(셀)이 빽빽이 모인 칩이에요. 지금 널리 쓰는 6F² 구조보다 셀 하나가 차지하는 면적을 줄인 게 4F² 구조예요. 같은 크기의 칩에 방을 더 많이 넣을 수 있어 저장 용량과 전력 효율이 좋아져요. 삼성전자와 SK하이닉스도 개발 중이고, 삼성전자는 2028년 양산을 목표로 하는 것으로 알려졌어요. 시장조사업체 카운터포인트리서치에 따르면 올해 2분기 세계 D램 매출 점유율은 삼성전자 38%, SK하이닉스 25%, 마이크론 24%, CXMT 10%쯤이에요. CXMT는 1년 전 4%에서 빠르게 커졌어요.",
      why:"삼성전자와 SK하이닉스는 코스피에서 비중이 가장 큰 두 종목이에요. 지금은 메모리가 모자라 값이 높지만, 경쟁자가 늘면 값과 이익이 흔들릴 수 있어요. 다만 이번 발표가 실제 서버 주문으로 이어질지는 아직 확인되지 않았어요.",

    { tag:"한국 · 부동산", title:"한은 국감 '집값 상승 기대 자극하지 않게 일관된 정책 필요'",

      more:"주택가격전망지수가 100보다 크면 집값이 오를 거라고 보는 사람이 내릴 거라고 보는 사람보다 많다는 뜻이에요. 집값이 오를 거라 믿는 사람이 많아지면 대출을 받아서라도 미리 사려는 수요가 커져요. 한은은 수도권 주택 거래가 4월부터 장기 평균을 웃돌다 8월 정부 대책 뒤 주춤했다고 봤어요. 한편 미국·일본 장기 금리가 크게 오르면 국내 대출 금리도 따라 오를 수 있다고 경고했어요. 취약한 자영업자의 대출 연체율은 2분기 12.7%로 2023년 말(10.1%)보다 높아졌어요.",

      { t:"1) 소비자심리지수가 뭐예요?", items:[
        "소비자심리지수는 <mark>가계에 경제 형편과 앞날을 물어보고, 그 답을 숫자로 바꾼 지표</mark>예요. 실제로 쓴 돈이 아니라 쓰려는 마음을 재요.",
        "미국에서는 미시간대가 매달 발표하는 소비자심리지수가 대표적이에요. 한국에서는 한국은행이 매달 소비자동향조사를 해서 여러 심리지수를 내놔요.",
        "오늘 한은 국감에서 나온 주택가격전망지수도 같은 조사에 들어 있는 항목이에요. '1년 뒤 집값이 오를까요?'라는 질문의 답을 숫자로 바꾼 거예요." ] },
      { t:"2) 어떻게 만들어지나요?", items:[
        "질문은 생각보다 단순해요. '지금 형편이 1년 전보다 나아졌나요?', '앞으로 경기가 좋아질까요?', '지금이 큰 물건을 사기 좋은 때인가요?' 같은 걸 물어요.",
        "좋아졌다는 답과 나빠졌다는 답의 비율을 계산해 점수를 매겨요. 한국은행 지수는 <mark>100보다 크면 좋게 보는 사람이 더 많다</mark>는 뜻이에요.",
        "미국 미시간대는 한 달에 두 번 숫자를 내요. 먼저 잠정치가 나오고, 그달 말에 조사를 더해 확정치가 나와요." ],
        box:{ label:"현재와 기대는 따로 봐요", text:"미시간대 지수는 지금 형편을 묻는 '현재 상황 지수'와 앞으로를 묻는 '기대 지수'로 나눠요. 10월에는 현재 상황 지수가 50.9에서 44.7로 떨어져 사상 최저였는데, 기대 지수는 46.3에서 47.3으로 올랐어요. '지금은 힘들지만 더 나빠지진 않겠지' 하는 마음이 섞여 있다고 볼 수 있어요." } },
      { t:"3) 왜 중요한가요?", items:[
        "소비는 경제를 움직이는 큰 엔진이에요. 사람들이 불안하면 외식, 여행, 자동차처럼 미룰 수 있는 지출부터 줄여요. 그래서 심리지수는 실제 소비 통계보다 한발 먼저 분위기를 알려줘요.",
        "이번 조사에서 응답자의 54%는 지출을 줄이고, 16%는 아예 멈출 계획이라고 답했어요. 마음이 실제 지출로 이어지면 기업 실적에도 영향을 줘요.",
        "같은 조사에서 묻는 '앞으로 물가가 얼마나 오를까'(기대 인플레이션)는 중앙은행이 특히 눈여겨보는 숫자예요. 사람들이 물가가 오른다고 믿으면 임금과 가격을 미리 올리면서 실제 물가도 따라 오르기 쉬워요." ],
        arrow:"심리지수는 '지금 얼마나 썼나'가 아니라 '앞으로 얼마나 쓸 마음인가'를 보여줘요." },
      { t:"4) 요즘 왜 뉴스에 나오나요?", items:[
        "미국 10월 소비자심리지수는 46.3으로 5월(44.8) 이후 가장 낮았어요. 휘발유 값이 갤런당 4.37달러로 1년 전보다 40.5% 오른 게 큰 이유로 꼽혀요.",
        "1년 뒤 물가 예상은 4.7%로 9월(4.6%)보다 올랐어요. 이번 주 14일 미국 소비자물가 발표를 앞두고 금리 걱정을 키우는 숫자예요.",
        "한국에서는 주택가격전망지수가 3월 97에서 8월 134까지 올랐어요. 한국은행은 이 기대가 가계대출을 자극하지 않도록 정책을 일관되게 유지해야 한다고 밝혔어요." ] },
      { t:"5) 우리에게는 어떤 영향이 있나요?", items:[
        "미국 소비자가 지갑을 닫으면 미국으로 가는 한국 수출품의 주문이 줄 수 있어요. 미국은 한국의 큰 수출 시장이에요.",
        "미국 기대 인플레이션이 높아지면 연준이 금리를 쉽게 내리지 못해요. 그러면 미국 금리가 높게 유지되고, 외국인이 한국 주식을 팔기 쉬운 환경이 이어져요.",
        "주택가격전망지수가 높으면 '지금 안 사면 늦는다'는 마음이 커져요. 대출 규제나 금리가 바뀔 때 사람들이 한꺼번에 움직이기 쉬워서, 내 집 마련 계획이 있다면 함께 지켜볼 숫자예요." ] },
      { t:"6) 숫자는 이렇게 읽어요", items:[
        "<mark>수준보다 방향</mark>을 먼저 봐요. 지난달보다 올랐는지 내렸는지, 몇 달째 같은 방향인지가 중요해요.",
        "예상치와도 견줘 봐요. 이번 미국 지수는 예상(47.6)보다 낮아서 실망스러운 숫자로 받아들여졌어요.",
        "심리는 실제 행동과 어긋날 때가 있어요. 불안하다고 답하면서도 실제로는 돈을 쓰는 경우도 있어서, 소매판매 같은 실제 소비 숫자와 함께 보는 게 좋아요. 미국 9월 소매판매는 15일에 나와요." ],
        box:{ label:"기사에서 볼 세 가지", text:"<b>방향</b>: 지난달보다 올랐나요, 내렸나요? <b>나눠 보기</b>: 현재 평가와 앞으로의 기대 중 어느 쪽이 움직였나요? <b>물가 예상</b>: 기대 인플레이션은 몇 %인가요? 이번에는 '내림', '현재 평가가 급락', '4.7%로 상승'이었어요." } },
      { t:"7) 어디서 직접 확인할 수 있나요?", items:[
        "<b>미국 소비자심리지수</b>: 미시간대 소비자 조사 누리집에서 매달 잠정치와 확정치를 볼 수 있어요. <a href='https://www.sca.isr.umich.edu/' target='_blank' rel='noopener'>sca.isr.umich.edu →</a>",
        "<b>한국 소비자심리·주택가격전망지수</b>: 한국은행 경제통계시스템(ECOS)에서 '소비자동향조사'를 찾으면 달마다의 숫자를 볼 수 있어요. <a href='https://ecos.bok.or.kr' target='_blank' rel='noopener'>ecos.bok.or.kr →</a>" ],
        arrow:"심리지수를 보면 '사람들이 지금 어떤 기분인가'를, 다음 달 소비 통계를 보면 '그 기분이 행동으로 이어졌나'를 확인할 수 있어요." }
    ]

    { tag:"미국 · 기업", title:"오픈AI 연환산 매출 500억 달러 보도, 알려진 것보다 200억 달러 적어",
      body:"영국 파이낸셜타임스는 8일 오픈AI가 투자자들에게 알린 9월 말 연환산 매출이 약 500억 달러라고 보도했어요. 지난달 여러 매체가 전한 약 700억 달러보다 200억 달러 적어요. 오픈AI는 이 보도에 답하지 않았어요. 같은 날 월스트리트저널은 브로드컴이 오픈AI와 함께 개발하는 맞춤형 칩을 위해 500억 달러 넘는 자금 조달을 추진하고, 오라클도 사모펀드 등과 큰 규모의 자금 조달을 논의하고 있다고 전했어요. 오라클은 5.48%, 브로드컴은 4.35% 내렸어요.",
      more:"차이는 매출을 세는 방법에서 나왔어요. 보도에 따르면 오픈AI는 경쟁사와 견주기 쉽도록 클라우드 협력사를 거쳐 팔린 금액까지 넣어 숫자를 높여 잡은 적이 있고, 여기에 성장률을 곱한 약 700억 달러가 퍼졌어요. 회사가 직접 내놓은 숫자는 500억 달러에 가까웠어요. 오픈AI는 기업가치 1조 4,000억 달러로 300억 달러 이상을 새로 투자받으려 하고 있어요. 매출이 500억 달러면 기업가치가 매출의 28배, 700억 달러면 20배예요. 한편 오라클은 최근 2년 동안 장기 부채가 거의 두 배로 늘어 1,600억 달러를 넘었고, 6~8월 석 달 동안 설비에 쓴 돈만 285억 달러예요.",
      why:"AI 관련 주식은 올해 시장을 끌어올린 주인공이에요. 그 기대의 바탕이 되는 매출 숫자가 흔들리면 칩, 서버, 데이터센터 회사까지 함께 영향을 받아요. 삼성전자와 SK하이닉스도 이 흐름 안에 있어요.",
      url:"https://www.g-enews.com/article/Securities/2026/10/202610090609005142e250e8e188_1", src:"글로벌이코노믹" },
    { tag:"거시경제 · 원자재", title:"중동 긴장에 허리케인까지, 브렌트유 4% 뛰어 104달러",
      body:"8일 국제 유가가 크게 올랐어요. WTI는 3.21달러(3.64%) 오른 배럴당 91.49달러, 브렌트유는 4.08달러(4.07%) 오른 104.28달러로 마감했어요. 브렌트유는 9월 29일 이후 가장 높아요. 이란이 호르무즈 해협을 지나는 유조선 공격을 늘렸고, 예멘 후티 반군은 사우디아라비아 공항에 미사일을 쐈어요. 여기에 허리케인 이사이아스가 미국 멕시코만으로 다가오면서 이 지역 원유 생산의 62.9%, 하루 약 130만 배럴이 멈췄어요.",
      more:"유가는 공급이 줄어들 거라는 걱정만으로도 올라요. 호르무즈 해협은 중동 원유가 바다로 나가는 좁은 길목이에요. 지난주 이곳을 지난 원유는 하루 평균 950만 배럴로 전쟁 전보다 30%쯤 적었어요. 멕시코만은 미국 바다 유전이 모여 있는 곳이라 허리케인이 오면 회사들이 미리 생산을 멈추고 사람을 대피시켜요. 다만 트럼프 대통령이 11월 3일 중간선거 전에는 이란을 공격하지 않겠다고 밝히면서, 장중 5달러 넘게 올랐던 유가는 오름폭을 일부 내줬어요.",
      why:"우리나라는 원유를 거의 다 수입해요. 유가가 오르면 주유소 기름값과 전기·가스 요금, 물건값이 시차를 두고 따라 올라요. 물가가 오르면 금리를 내리기도 어려워져요.",
      url:"https://www.newspim.com/news/view/20261009000020", src:"뉴스핌" },
    { tag:"한국 · 부동산", title:"다음 주 전국 8개 단지 1,829가구 청약, 경기도에 몰렸어요",
      body:"부동산 조사 업체 리얼투데이에 따르면 10월 셋째 주(12~16일)에 전국 8개 단지에서 1,829가구가 청약을 받아요. 오피스텔을 포함하고 행복주택은 뺀 숫자예요. 경기도 물량이 많아요. 화성 향남역 그로브 스위첸(933가구)과 양평 쌍용 더 플래티넘 한강(333가구)이 13일 1순위 청약을 받아요. 지방에서는 대구 중구 더샵 동인센트리스(314가구) 등이 나와요. 16일에는 충남 아산과 충북 청주에서 1,000가구가 넘는 대단지 견본주택이 문을 열어요.",
      more:"청약은 새로 짓는 아파트를 분양받겠다고 신청하는 절차예요. 청약통장 가입 기간, 무주택 기간, 부양가족 수 등으로 점수를 매기거나 추첨해서 당첨자를 뽑아요. 1순위는 통장 가입 기간과 납입 조건을 채운 사람이 먼저 신청하는 차례예요. 어제 전한 대로 서울 아파트값은 87주째 오르고 있고, 수요가 서울 외곽과 경기도로 옮겨 가는 모습이에요. 이번 주 분양 물량이 경기도에 몰린 것도 같은 흐름에서 볼 수 있어요.",
      why:"청약은 2030이 내 집을 마련하는 대표적인 길 가운데 하나예요. 당장 신청하지 않더라도 어느 지역에 얼마나 공급되는지, 1순위 조건이 무엇인지 알아 두면 나중에 준비하기 쉬워요. 단지마다 조건이 다르니 입주자 모집 공고를 직접 확인해야 해요.",
      url:"https://fnnews.com/news/202610090305498887", src:"파이낸셜뉴스" }
  ],
  term: {
    name: "연환산 매출, 한 달 성적에 12를 곱한 '예상 연봉' 읽는 법",
    card: { eyebrow:"경제 상식 한 조각 · 2026.10.09", title:"같은 회사 매출이<br><span>왜 500억도 되고 700억도 될까</span>", sub:"연환산 매출 숫자가 만들어지고 주가로 이어지는 순서",
      steps: [ { k:"최근 매출", x:"한 달이나 한 분기 매출을 재요" }, { k:"곱하기", x:"1년 치로 늘려서 계산해요" }, { k:"기업가치", x:"이 숫자에 몇 배를 곱해 값을 매겨요" }, { k:"주변 회사", x:"거래하는 회사의 기대도 함께 움직여요" } ] },
    note: "<b>이 코너는 특정 상품 추천이 아니라 경제 기본 지식을 공부하는 자료예요.</b> 본문에 나오는 사이트 이름은 숫자를 직접 확인하는 방법을 설명하기 위한 예시예요.",
    intro: "오늘 미국 반도체 주식을 끌어내린 건 '연환산 매출'이라는 낯선 말이었어요. 실제로 번 돈과 무엇이 다른지, 왜 같은 회사인데 숫자가 둘이 나왔는지 차례로 풀어볼게요.",
    points: [
      { t:"1) 연환산 매출이 뭐예요?", items:[
        "연환산 매출은 <mark>최근 짧은 기간의 매출을 1년 치로 늘려 계산한 숫자</mark>예요. 지난달에 10억 원을 팔았다면 12를 곱해 연환산 매출 120억 원이라고 말하는 식이에요.",
        "아르바이트 첫 달에 200만 원을 받고 '내 연봉은 2,400만 원쯤 되겠네' 하고 어림하는 것과 같아요. 실제로 1년 동안 받은 돈이 아니라, 지금 속도가 이어진다면 받게 될 돈이에요.",
        "영어로는 런레이트(run-rate)라고 부르고, 매달 요금을 받는 구독 서비스 회사는 ARR(연간 반복 매출)이라는 말을 써요." ] },
      { t:"2) 왜 이런 숫자를 쓰나요?", items:[
        "빠르게 크는 회사는 지난 1년 매출이 지금의 크기를 잘 보여주지 못해요. 1월에 1억 원을 팔던 회사가 12월에 10억 원을 판다면, 1년 합계보다 12월 숫자가 지금 모습에 더 가까워요.",
        "그래서 새로 생긴 회사나 AI 회사처럼 성장이 빠른 곳은 연환산 매출로 자기 크기를 알려요. 투자자도 이 숫자를 보고 회사의 값을 매겨요." ],
        box:{ label:"실제 매출과의 차이", text:"실제 매출은 정해진 기간에 이미 번 돈이에요. 회계 기준에 따라 계산하고, 상장한 회사는 외부 회계법인의 확인을 받아 공시해요. 연환산 매출은 회사가 스스로 계산해 알리는 숫자예요. 어느 달을 기준으로 삼을지, 무엇까지 매출에 넣을지 정해진 규칙이 없어요." } },
      { t:"3) 왜 숫자가 사람마다 다르게 나오나요?", items:[
        "<mark>무엇을 매출로 세느냐</mark>에 따라 달라져요. 다른 회사를 거쳐 판 금액을 전부 넣는지, 내 몫만 넣는지에 따라 숫자가 크게 벌어져요.",
        "기준으로 삼는 기간도 영향을 줘요. 유난히 잘 팔린 달에 12를 곱하면 숫자가 부풀고, 여기에 예상 성장률까지 곱하면 더 커져요.",
        "이번 오픈AI가 그런 경우였어요. 보도에 따르면 협력사를 거친 판매까지 넣어 높여 잡은 숫자에 성장률이 더해져 약 700억 달러가 퍼졌고, 회사가 투자자에게 알린 숫자는 약 500억 달러였어요." ],
        arrow:"회사가 200억 달러를 잃은 게 아니라, 같은 장사를 두 가지 방법으로 센 거예요." },
      { t:"4) 그런데 왜 주가가 크게 움직였나요?", items:[
        "성장하는 회사의 값은 흔히 매출의 몇 배로 매겨요. 오픈AI는 기업가치 1조 4,000억 달러로 투자를 받으려 하는데, 매출이 700억 달러면 20배, 500억 달러면 28배예요. 같은 값이 훨씬 비싸 보이게 돼요.",
        "오픈AI는 상장하지 않은 회사예요. 그래서 걱정은 오픈AI에 칩과 서버를 대는 상장 회사로 옮겨 갔어요. 8일 필라델피아 반도체지수가 3.39%, 오라클이 5.48% 내린 이유예요.",
        "같은 날 이 회사들이 큰돈을 빌리려 한다는 보도도 나왔어요. 버는 돈은 생각보다 적을 수 있는데 쓰는 돈은 계속 는다는 점이 겹쳐 보인 거예요." ] },
      { t:"5) 우리에게는 어떤 영향이 있나요?", items:[
        "삼성전자와 SK하이닉스가 만드는 메모리 반도체는 AI 데이터센터에 들어가요. AI 회사들이 돈을 덜 쓸 거라는 걱정이 커지면 두 회사 주가도 영향을 받아요.",
        "8일 뉴욕에 상장된 SK하이닉스 주식예탁증서도 4.35% 내렸어요. 코스피에서 반도체가 차지하는 비중이 커서, 지수를 따라가는 펀드나 연금에도 이어져요.",
        "다만 연환산 매출을 세는 방법이 달랐다는 것과 AI 수요가 실제로 줄었다는 것은 다른 이야기예요. 이달 나오는 반도체 회사들의 실적 발표에서 주문이 어떤지 확인할 수 있어요." ] },
      { t:"6) 숫자는 이렇게 읽어요", items:[
        "기사에서 매출 숫자를 보면 <mark>이미 번 돈인지, 늘려서 계산한 돈인지</mark>부터 가려요. '연환산', '연율', '런레이트' 같은 말이 붙어 있으면 늘려 계산한 숫자예요.",
        "누가 말한 숫자인지도 봐요. 회사가 공시한 숫자, 회사가 투자자에게 알린 숫자, 언론이 계산한 숫자는 믿을 수 있는 정도가 달라요.",
        "매출과 이익도 달라요. 매출은 판 금액이고 이익은 쓴 돈을 빼고 남은 금액이에요. 매출이 커도 쓰는 돈이 더 크면 손해를 봐요." ],
        box:{ label:"기사에서 볼 세 가지", text:"<b>종류</b>: 실제 매출인가요, 연환산인가요? <b>범위</b>: 협력사를 거친 판매까지 넣었나요? <b>출처</b>: 공시인가요, 보도인가요? 이번에는 '연환산', '범위가 달랐음', '보도'였어요. 세 가지 모두 숫자가 흔들리기 쉬운 쪽이었어요." } },
      { t:"7) 어디서 직접 확인할 수 있나요?", items:[
        "<b>국내 상장사의 실제 매출</b>: 금융감독원 전자공시시스템(DART)에서 회사 이름을 검색하면 분기보고서와 사업보고서의 손익계산서를 볼 수 있어요. <a href='https://dart.fss.or.kr' target='_blank' rel='noopener'>dart.fss.or.kr →</a>",
        "<b>미국 상장사의 실제 매출</b>: 미국 증권거래위원회(SEC)의 공시 시스템 에드가(EDGAR)에서 분기보고서(10-Q)와 연간보고서(10-K)를 찾을 수 있어요. <a href='https://www.sec.gov/edgar/search/' target='_blank' rel='noopener'>sec.gov/edgar →</a>",
        "오픈AI처럼 상장하지 않은 회사는 이런 공시 의무가 없어요. 그래서 숫자가 보도를 거쳐 전해지고, 이번처럼 엇갈리는 일이 생겨요." ],
        arrow:"매출 숫자를 만나면 '이건 성적표인가요, 예상 점수인가요?' 하고 한 번 물어보세요." }
    ]
  },
  calendarIntro: "오늘 밤 미국 증시는 평소처럼 열리고, 허리케인 이사이아스가 미국 멕시코만 연안에 닿을 것으로 예보돼 있어요. 국내 증시는 12일(월)에 다시 열려요. 다음 주는 미국 물가와 은행 실적이 한꺼번에 나와요. 날짜는 현지 기준이에요.",

    { tag:"한국 · 기업", title:"삼성전자 3분기 영업이익 107조 4,000억 원, 국내 첫 '분기 100조'",

  function closing(c){
    const col=(nm,x)=>`<div><span class="nm">${nm}</span><span class="px ${dir(x.pct)}">${x.v}<small>${arrow(x.pct)} ${x.chg.replace(/^[+-]/,"")} ${sign(x.pct)}</small></span>
      <dl><dt>개인</dt><dd class="${dir(x.ind)}">${won(x.ind)}원</dd><dt>외국인</dt><dd class="${dir(x.frg)}">${won(x.frg)}원</dd><dt>기관</dt><dd class="${dir(x.inst)}">${won(x.inst)}원</dd>${x.prog!=null?`<dt>${x.progLabel||"프로그램"}</dt><dd class="${dir(x.prog)}">${won(x.prog)}원</dd>`:""}${x.vol?`<dt>거래대금</dt><dd>${x.vol}</dd>`:""}</dl>
      ${x.adv!=null?`<span class="brd">상승 ${x.adv} · 하락 ${x.dec}</span>`:""}</div>`;
    return `<div class="sub-block"><h4>오늘 장 마감 숫자</h4><div class="close">${col("코스피",c.kospi)}${col("코스닥",c.kosdaq)}</div>${c.text?`<p>${c.text}</p>`:""}</div>`;
  }

  function render(I){
    const latest = ISSUES[0], isOld = I !== latest, idx = ISSUES.indexOf(I);
    document.title = "말타노트";
    app.innerHTML = `
    <header class="mast">
      <p class="disc">이 레터는 공개된 자료를 정리한 시장 정보예요. 특정 금융투자상품의 매수·매도 권유나 개인별 투자 조언이 아니에요.</p>
      <div class="mast-top"><div class="brand">말타노트<small>by @malta_note</small></div><div class="meta">제${I.no}호 · ${I.date}</div></div>
      <h1>${I.headline}</h1>
      ${I.lede?`<p class="lede">${I.lede}</p>`:""}
    </header>
    ${isOld?`<div class="old-banner"><span>지난 호를 보고 있어요.</span><button type="button" class="linkbtn" data-go="${latest.id}">최신 호(제${latest.no}호) 보기 →</button></div>`:""}
    <div class="inner">
      <section class="sec" id="s1">${h2(0)}
        ${I.notice?`<p class="notice">${I.notice}</p>`:""}
        <div class="board${I.indicators.length===10?" b10":""}">${I.indicators.map(x=>`<div class="tile"><span class="k">${x.k}</span><span class="v">${x.v}</span><span class="c ${dir(x.pct)}">${arrow(x.pct)} ${sign(x.pct).replace(/^[+-]/,"")}</span><span class="d">${x.d}</span></div>`).join("")}</div>
        ${I.indicatorNotes?`<ul class="notes">${I.indicatorNotes.map(n=>`<li><b>${n.t}</b><span>${n.x}</span></li>`).join("")}</ul>`:""}
        ${I.gold?goldBlock(I.gold):""}
        ${I.bigNumber?`<div class="big"><div class="fig ${I.bigNumber.dir}">${I.bigNumber.value}<small>${I.bigNumber.unit}</small></div><div class="txt"><b>${I.bigNumber.title}</b>${I.bigNumber.text}</div></div>`:""}
      </section>

      <section class="sec" id="s2">${h2(1)}<h3>${I.us.title}</h3>
        ${I.us.heat&&I.us.heat.length?heat(I.us.heat)+`<p class="small center">${I.us.heatNote||""}</p>`:""}
        <div class="body">${ps(I.us.paras)}</div>
        ${I.us.fear?gauge(I.us.fear):""}
      </section>

      <section class="sec" id="s3">${h2(2)}<h3>${I.kr.title}</h3>
        ${I.kr.heat&&I.kr.heat.length?heat(I.kr.heat)+`<p class="small center">${I.kr.heatNote||""}</p>`:""}
        <div class="body">${ps(I.kr.paras)}</div>
        ${I.kr.flow?flow(I.kr.flow):""}
        ${I.kr.close?closing(I.kr.close):""}
      </section>

      <section class="sec" id="s4">${h2(3)}
        <p class="quote">“${I.comment.quote}”</p>
        ${I.comment.intro?`<p>${I.comment.intro}</p>`:""}
        ${(I.comment.points||[]).map(p=>`<div class="pt"><h4>${p.t}</h4>${ps(p.paras)}</div>`).join("")}
      </section>

      <section class="sec" id="s5">${h2(4)}
        <div class="news">${I.news.map(n=>`<article><span class="tag">${n.tag}</span><h3>${n.title}</h3><p>${n.body}</p>${n.more?`<p>${n.more}</p>`:""}<p class="why"><b>왜 중요할까요?</b> ${n.why}</p><a class="more" href="${n.url}" target="_blank" rel="noopener">원문 보기 (${n.src}) →</a></article>`).join("")}</div>
      </section>

      <section class="sec" id="s6">${h2(5)}<h3>${I.term.name}</h3>
        ${I.term.card?`<div class="tcard"><span class="eyebrow">${I.term.card.eyebrow}</span><div class="tt">${I.term.card.title}</div><span class="ts">${I.term.card.sub}</span><ol class="steps">${I.term.card.steps.map(s=>`<li><b>${s.k}</b>${s.x}</li>`).join("")}</ol></div>`:""}
        ${I.term.note?`<p class="tip">${I.term.note}</p>`:""}
        ${I.term.intro?`<p>${I.term.intro}</p>`:""}
        ${(I.term.points||[]).map(p=>`<div class="pt"><h4>${p.t}</h4><ul>${p.items.map(t=>`<li>${t}</li>`).join("")}</ul>${p.box?`<div class="box"><span class="lb">${p.box.label}</span><p>${p.box.text}</p></div>`:""}${p.arrow?`<p class="arrow">→ ${p.arrow}</p>`:""}</div>`).join("")}
      </section>

      <section class="sec" id="s7">${h2(6)}
        ${I.calendarIntro?`<p>${I.calendarIntro}</p>`:""}
        <div class="cal">${I.calendar.map(c=>`<div class="${c.key?"key":""}"><div class="h"><span class="dt">${c.d}${c.key?`<span class="badge">가장 중요</span>`:""}</span><span class="t">${c.t}</span></div><p>${c.n}</p></div>`).join("")}</div>
      </section>

      <section class="sec" id="s8">${h2(7)}
        ${I.quizIntro?`<p>${I.quizIntro}</p>`:""}
        <div class="quiz">${I.quiz.map((q,qi)=>`<div class="q" data-q="${qi}"><h3>Q${qi+1}. ${q.q}${q.tag?`<span class="badge">${q.tag}</span>`:""}</h3><div class="opts">${q.opts.map((o,i)=>`<button type="button" id="quiz-${qi}-${i}" data-i="${i}">${"①②③④"[i]} ${o}</button>`).join("")}</div><p class="res" id="quiz-res-${qi}" hidden></p></div>`).join("")}</div>
      </section>

      <section class="sec" id="archive"><h2>지난 호 보기 <span class="small">지금까지 ${ISSUES.length}호</span></h2>
        <ul class="arch" id="arch-list"></ul>
        <p class="center" id="arch-more-wrap" hidden><button type="button" class="linkbtn" id="arch-more">지난 호 전체 보기 →</button></p>
      </section>

      <footer>
        <p><b>이미지 · 자료 출처</b></p>
        <ul>${I.sources.map(s=>`<li><a href="${s[1]}" target="_blank" rel="noopener">${s[0]}</a></li>`).join("")}</ul>
        <p>이 글은 정보 전달을 목적으로 한 정리 노트예요. 특정 종목을 사거나 팔라는 권유가 아니고, 모든 투자의 책임은 본인에게 있어요. 수치는 위 기사에서 가져왔고, 발표 기관 수치와 차이가 날 수 있어요.</p>
        <p>© 2026 말타노트 · @malta_note</p>
      </footer>
    </div>`;

    // 지난 호 목록 (최신순, 처음엔 5개)
    let showAll = false;
    const list = document.getElementById("arch-list"), moreWrap = document.getElementById("arch-more-wrap");
    const drawArch = () => {
      const items = showAll ? ISSUES : ISSUES.slice(0,5);
      list.innerHTML = items.map(x=>`<li><button type="button" data-go="${x.id}" aria-current="${x===I}"><span class="no">제${x.no}호</span><span class="ti">${x.headline}</span><span class="dt">${x.date}</span></button></li>`).join("");
      moreWrap.hidden = showAll || ISSUES.length<=5;
    };
    drawArch();
    document.getElementById("arch-more").addEventListener("click",()=>{ showAll=true; drawArch(); });

    // 퀴즈
    app.querySelectorAll(".q").forEach(el=>{
      const q = I.quiz[+el.dataset.q], res = el.querySelector(".res");
      el.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{
        const pick=+b.dataset.i;
        el.querySelectorAll("button").forEach(x=>{ x.classList.toggle("right", +x.dataset.i===q.answer); x.classList.toggle("wrong", +x.dataset.i===pick && pick!==q.answer); });
        res.hidden=false; res.innerHTML=`<b>${pick===q.answer?"맞았어요.":"아쉬워요. 정답은 "+"①②③④"[q.answer]+"번이에요."}</b> ${q.explain}`;
      }));
    });
    toc.innerHTML = SECTIONS.map((s,i)=>`<a href="#${s[0]}"><span>${String(i+1).padStart(2,"0")}</span>${s[1]}</a>`).join("") + `<a href="#archive"><span>··</span>지난 호 보기</a>`;
  }

  const find = id => ISSUES.find(x=>x.id===id);
  function go(id, scroll){
    const I = find(id) || ISSUES[0];
    render(I);
    try{ history.replaceState(null,"", I===ISSUES[0] ? location.pathname+location.search : "#ho"+I.id); }catch(e){}
    if(scroll) window.scrollTo({top:0});
  }
  document.addEventListener("click",e=>{
    const g = e.target.closest("[data-go]");
    if(g){ go(g.dataset.go,true); return; }
    const a = e.target.closest(".toc a");
    if(a){ e.preventDefault(); const t=document.getElementById(a.getAttribute("href").slice(1)); if(t) t.scrollIntoView({behavior:"smooth"}); toc.hidden=true; tocBtn.setAttribute("aria-expanded","false"); return; }
    if(e.target===tocBtn){ toc.hidden=!toc.hidden; tocBtn.setAttribute("aria-expanded",String(!toc.hidden)); return; }
    if(!toc.hidden && !e.target.closest(".toc")){ toc.hidden=true; tocBtn.setAttribute("aria-expanded","false"); }
  });
  const m = (location.hash||"").match(/^#ho(\d+)$/);
  go(m?m[1]:ISSUES[0].id,false);
})();
</script>
</body>
</html>
