<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>말타노트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 레이아웃: 가운데 한 단 종이. 형광펜색 머리띠(안내·제호·날짜·헤드라인) 아래로 01~08 번호 섹션이 차례로 이어지고, 맨 아래에 지난 호 목록. 오름=빨강, 내림=파랑(국내 증시 관례). */
:root{
  --bg:#e9ecf2; --paper:#ffffff; --soft:#f4f6fa; --ink:#131c2e; --sub:#56617a; --line:#d9dee8;
  --marker:#ffe45c; --band:#ffe45c; --band-ink:#131c2e; --band-note:#fff3a8;
  --accent:#1f4fd8; --up:#d92b3a; --down:#1e5fd0; --flat:#6b7385;
  --up-soft:#fde8ea; --down-soft:#e6eefc; --tip:#fff8d6;
  --heat-base:#2b3345; --heat-ink:#ffffff; --panel:#1a2233; --panel-ink:#eef1f7; --panel-sub:#a3adc2; --panel-up:#ff7a85; --panel-down:#7fb0ff;
  --f-display:"Hahmlet","Noto Serif KR",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0b0f18; --paper:#171e2d; --soft:#1e2637; --ink:#e9edf5; --sub:#9aa5bb; --line:#2a3447;
  --marker:#6b5a00; --band:#e6c93a; --band-ink:#131c2e; --band-note:#f3dd6e;
  --accent:#8fb0ff; --up:#ff6b78; --down:#6fa2ff; --flat:#9aa5bb;
  --up-soft:#3a1c22; --down-soft:#17284a; --tip:#2e2a14;
  --heat-base:#2b3345; --heat-ink:#ffffff; --panel:#0f1522; --panel-ink:#eef1f7; --panel-sub:#a3adc2; --panel-up:#ff7a85; --panel-down:#7fb0ff;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0b0f18; --paper:#171e2d; --soft:#1e2637; --ink:#e9edf5; --sub:#9aa5bb; --line:#2a3447;
  --marker:#6b5a00; --band:#e6c93a; --band-ink:#131c2e; --band-note:#f3dd6e;
  --accent:#8fb0ff; --up:#ff6b78; --down:#6fa2ff; --flat:#9aa5bb;
  --up-soft:#3a1c22; --down-soft:#17284a; --tip:#2e2a14;
  --heat-base:#2b3345; --heat-ink:#ffffff; --panel:#0f1522; --panel-ink:#eef1f7; --panel-sub:#a3adc2; --panel-up:#ff7a85; --panel-down:#7fb0ff;
  color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.75;padding-inline:16px;padding-block:24px 72px;word-break:keep-all}
p,h1,h2,h3,h4,ul{margin:0}
a{color:var(--accent)}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}
.small{font-size:12.5px;color:var(--sub)}
.center{text-align:center}

.sheet{max-width:720px;margin:0 auto;background:var(--paper);border-radius:10px;overflow:hidden}
/* 머리띠 */
.mast{background:var(--band);color:var(--band-ink);padding:22px 28px 24px;display:flex;flex-direction:column;gap:10px}
.mast .disc{font-size:12px;background:var(--band-note);border-radius:6px;padding:6px 12px}
.mast-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px 16px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:-.02em;line-height:1.25}
.brand small{font-family:var(--f-body);font-weight:500;font-size:13px;letter-spacing:0;margin-left:6px}
.mast .meta{font-size:13px;font-family:var(--f-num)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(19px,4.6vw,24px);line-height:1.4;text-wrap:balance}
.mast .lede{font-size:14.5px;max-width:60ch}
.old-banner{background:var(--soft);border-bottom:1px solid var(--line);padding:10px 28px;font-size:13.5px;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.linkbtn{font:inherit;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;font-weight:600}

.inner{padding:8px 28px 32px;display:flex;flex-direction:column}
.sec{display:flex;flex-direction:column;gap:16px;padding-block:30px;border-top:1px solid var(--line);scroll-margin-top:12px}
.sec:first-child{border-top:0}
h2{font-size:15.5px;font-weight:600;line-height:1.4;border-left:4px solid var(--marker);padding-left:10px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
h2 .n{font-family:var(--f-num);color:var(--sub);font-size:14px}
h3{font-family:var(--f-display);font-size:18px;font-weight:700;line-height:1.5;text-wrap:balance}
h4{font-size:14px;font-weight:600;line-height:1.5;border-left:3px solid var(--marker);padding-left:8px}
.body{display:flex;flex-direction:column;gap:12px}
.notice{font-size:13.5px;background:var(--tip);border-radius:6px;padding:10px 14px}
mark{background:linear-gradient(transparent 55%,var(--marker) 55%);color:inherit}

/* 01 지표 */
.board{display:grid;grid-template-columns:repeat(20,1fr);gap:8px}
.tile{grid-column:span 4;border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:1px;min-width:0}
.tile:nth-child(n+6){grid-column:span 5}
.tile .k{font-size:12px;color:var(--sub)}
.tile .v{font-family:var(--f-num);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.4}
.tile .c{font-family:var(--f-num);font-size:12.5px;font-variant-numeric:tabular-nums}
.tile .d{font-size:10.5px;color:var(--sub);line-height:1.4}
.board.b10 .tile:nth-child(n+6){grid-column:span 4}
@media (max-width:600px){.board{grid-template-columns:repeat(3,1fr);gap:6px}.tile,.tile:nth-child(n+6),.board.b10 .tile:nth-child(n+6){grid-column:span 1;padding:8px 9px}.tile .v{font-size:14px}.board.b10{grid-template-columns:repeat(2,1fr)}}
.notes{list-style:none;padding:0;display:flex;flex-direction:column;gap:12px}
.notes li{padding-left:12px;border-left:2px solid var(--line)}
.notes b{display:block;font-weight:600;font-size:14.5px}
.notes span{font-size:14px;color:var(--sub)}
.gold{display:flex;flex-direction:column;gap:12px}
.gstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.gstats>div{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:1px;min-width:0}
.gstats .k{font-size:12px;color:var(--sub)} .gstats .v{font-family:var(--f-num);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere} .gstats .s{font-size:11.5px;color:var(--sub);line-height:1.45}
.grange{border:1px solid var(--line);border-radius:8px;padding:14px 16px 10px;display:flex;flex-direction:column;gap:6px}
.grange .ttl{font-size:12.5px;color:var(--sub)}
.grange .trk{position:relative;height:10px;border-radius:999px;background:linear-gradient(to right,var(--down-soft),var(--up-soft));margin:26px 0 30px}
.grange .mk{position:absolute;top:50%;transform:translate(-50%,-50%);width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--sub)}
.grange .mk.now{width:16px;height:16px;background:var(--marker);border-color:var(--ink)}
.grange .lb{position:absolute;transform:translateX(-50%);font-size:11px;line-height:1.3;text-align:center;white-space:nowrap;color:var(--sub)}
.grange .lb.top{bottom:18px} .grange .lb.bot{top:18px}
.grange .lb b{display:block;font-family:var(--f-num);color:var(--ink);font-weight:600}
.grange .lb.e0{transform:none;text-align:left} .grange .lb.e1{transform:translateX(-100%);text-align:right}
.big{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:8px;padding:16px 18px}
.big .fig{font-family:var(--f-num);font-weight:600;font-size:clamp(36px,10vw,52px);line-height:1;letter-spacing:-.03em}
.big .fig small{font-family:var(--f-body);font-size:16px;font-weight:600;margin-left:4px;letter-spacing:0}
.big .txt{flex:1 1 240px;min-width:0;font-size:14.5px}
.big .txt b{display:block;font-size:15px}

/* 히트맵 */
.heat{display:flex;flex-wrap:wrap;gap:3px;background:var(--heat-base);padding:3px;border-radius:8px}
.heat div{color:var(--heat-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px 4px;min-width:0;line-height:1.3;border-radius:4px}
.heat .w1{flex:1 1 15%;min-height:58px;font-size:12px}
.heat .w2{flex:2 1 22%;min-height:72px;font-size:14px}
.heat .w3{flex:3 1 32%;min-height:96px;font-size:18px}
.heat b{font-weight:600;overflow-wrap:anywhere}
.heat span{font-family:var(--f-num);font-size:.82em;font-variant-numeric:tabular-nums}
@media (max-width:600px){.heat .w1{flex-basis:22%}.heat .w2{flex-basis:30%}.heat .w3{flex-basis:46%;font-size:16px}}

.sub-block{display:flex;flex-direction:column;gap:12px}
.card{border:1px solid var(--line);border-radius:8px;padding:16px}
/* 공포탐욕 */
.fg{display:flex;gap:8px 20px;align-items:center;flex-wrap:wrap}
.fg svg{flex:0 1 250px;min-width:200px;max-width:100%;height:auto}
.fg .side{flex:1 1 180px;min-width:0;display:flex;flex-direction:column;gap:4px;font-size:14px}
.fg .score{font-family:var(--f-num);font-weight:600;font-size:40px;line-height:1}
/* 수급 막대 */
.flow{display:flex;flex-direction:column;gap:14px}
.flow .r{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:baseline;font-size:15px}
.flow .track{position:relative;height:18px;grid-column:1/-1;order:3}
.flow .zero{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--sub)}
.flow .bar{position:absolute;top:0;bottom:0;border-radius:3px}
.flow .bar.up{background:var(--up)} .flow .bar.down{background:var(--down)}
.flow .val{text-align:right;font-family:var(--f-num);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.tip{background:var(--tip);border-left:4px solid var(--marker);border-radius:0 6px 6px 0;padding:10px 14px;font-size:14px}
.tip b{font-weight:600}
/* 장 마감 숫자 */
.close{background:var(--panel);color:var(--panel-ink);border-radius:8px;display:grid;grid-template-columns:1fr 1fr;gap:1px;overflow:hidden}
.close>div{padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.close .nm{font-weight:600;font-size:14px}
.close .px{font-family:var(--f-num);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums}
.close .px small{font-size:12.5px;margin-left:6px;font-weight:500}
.close dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0;font-size:13px}
.close dt{color:var(--panel-sub)} .close dd{margin:0;text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.close .up{color:var(--panel-up)} .close .down{color:var(--panel-down)}
.close .brd{font-size:12px;color:var(--panel-sub)}
@media (max-width:480px){.close{grid-template-columns:1fr}}

/* 04 한마디 */
.quote{font-family:var(--f-display);font-weight:500;font-size:16.5px;line-height:1.6;background:var(--tip);border-left:4px solid var(--marker);border-radius:0 6px 6px 0;padding:10px 14px}
.pt{display:flex;flex-direction:column;gap:8px}
/* 05 뉴스 */
.news{display:flex;flex-direction:column;gap:12px}
.news article{border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:8px}
.tag{font-size:11.5px;font-weight:600;color:var(--accent);letter-spacing:.02em}
.news h3{font-family:var(--f-body);font-size:15.5px;font-weight:600}
.news p{font-size:14.5px}
.why{background:var(--soft);border-radius:6px;padding:8px 12px}
.why b{font-weight:600}
.more{font-size:13px;font-weight:600;text-decoration:none}
/* 06 상식 카드 */
.tcard{background:var(--panel);color:var(--panel-ink);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:14px}
.tcard .eyebrow{font-size:12px;color:var(--panel-sub);font-family:var(--f-num)}
.tcard .tt{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,6vw,30px);line-height:1.3;text-wrap:balance}
.tcard .tt span{background:linear-gradient(transparent 62%,#8a7400 62%)}
.tcard .ts{font-size:14px;color:var(--panel-sub)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;list-style:none;padding:0;counter-reset:s}
.steps li{counter-increment:s;background:rgba(255,255,255,.07);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.5;display:flex;flex-direction:column;gap:2px}
.steps li::before{content:counter(s);font-family:var(--f-num);font-size:12px;color:#ffe45c}
.steps b{font-size:14px;font-weight:600}
.pt ul{padding-left:18px;display:flex;flex-direction:column;gap:6px}
.box{border:1.5px solid var(--up);border-radius:8px;padding:10px 14px;background:var(--up-soft);font-size:14px;display:flex;flex-direction:column;gap:4px}
.box .lb{align-self:flex-start;background:var(--up);color:var(--paper);font-size:11.5px;font-weight:600;border-radius:999px;padding:1px 8px}
.arrow{font-size:14px;color:var(--sub)}
/* 07 일정 */
.cal{display:flex;flex-direction:column;gap:8px}
.cal>div{border:1px solid var(--line);border-radius:8px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.cal .h{display:flex;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;align-items:baseline}
.cal .dt{font-weight:600;font-size:14px;font-family:var(--f-num)}
.cal .t{font-weight:600;font-size:14px;color:var(--accent);text-align:right}
.cal .key .t{color:var(--up)}
.cal .badge{font-family:var(--f-body);font-size:11px;background:var(--tip);border-radius:4px;padding:1px 6px;margin-left:6px;font-weight:600}
.cal p{font-size:13.5px;color:var(--sub)}
/* 08 퀴즈 */
.quiz{display:flex;flex-direction:column;gap:22px}
.q{display:flex;flex-direction:column;gap:8px}
.q h3{font-family:var(--f-body);font-size:15px;font-weight:600}
.q h3 .badge{font-size:11px;background:var(--tip);border-radius:4px;padding:1px 6px;margin-left:6px;font-weight:600;white-space:nowrap}
.opts{display:flex;flex-direction:column;gap:6px}
.opts button{font:inherit;font-size:14.5px;color:var(--ink);text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 14px;cursor:pointer}
.opts button:hover{border-color:var(--accent)}
.opts button.right{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);font-weight:600}
.opts button.wrong{opacity:.55;text-decoration:line-through}
.q .res{font-size:14px;background:var(--soft);border-radius:6px;padding:8px 12px}
/* 지난 호 */
.arch{list-style:none;padding:0;display:flex;flex-direction:column;gap:6px}
.arch button{width:100%;font:inherit;font-size:14.5px;color:var(--ink);text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 14px;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline}
.arch button:hover{border-color:var(--accent)}
.arch button[aria-current="true"]{background:var(--tip);border-color:transparent}
.arch .no{font-family:var(--f-num);font-weight:600;font-size:13px;color:var(--accent);white-space:nowrap}
.arch .ti{min-width:0}
.arch .dt{font-family:var(--f-num);font-size:12px;color:var(--sub);white-space:nowrap}
footer{border-top:1px solid var(--line);padding-top:20px;display:flex;flex-direction:column;gap:10px;font-size:12.5px;color:var(--sub)}
footer ul{padding-left:18px}
/* 목차 */
.toc-btn{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));font:inherit;font-size:13px;font-weight:600;background:var(--ink);color:var(--paper);border:0;border-radius:999px;padding:8px 14px;cursor:pointer;z-index:5}
.toc{position:fixed;right:16px;bottom:calc(60px + env(safe-area-inset-bottom,0px));background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;z-index:5;max-width:calc(100vw - 32px);box-shadow:0 6px 24px rgba(0,0,0,.18)}
.toc a{color:var(--ink);text-decoration:none;font-size:14px;padding:6px 12px;border-radius:6px}
.toc a:hover{background:var(--soft)}
.toc a span{font-family:var(--f-num);color:var(--sub);font-size:12px;margin-right:8px}
</style>
</head>
<body>

<div class="sheet" id="app"></div>
<button type="button" class="toc-btn" id="toc-btn" aria-expanded="false" aria-controls="toc">☰ 목차</button>
<nav class="toc" id="toc" hidden aria-label="목차"></nav>

<script>
/* =====================================================================
   발행 방법: ISSUES 배열 맨 앞(아래 표시 줄 바로 다음)에 새 호 객체를 하나 추가합니다.
   이전 호 객체와 그 아래 렌더 코드는 건드리지 않습니다. 최신 호가 배열의 첫 번째입니다.
   ===================================================================== */
const ISSUES = [
/*@@NEW_ISSUE_BELOW@@*/
{
  no: 19, id: "261029",
  date: "2026. 10. 29 (목)",
  headline: "삼성전자 107조 실적에도 '주주환원은 1월에', 코스피 1.24% 내려 하루 만에 6,000선을 내줬어요",
  lede: "삼성전자가 3분기 영업이익 107조 4,405억 원과 30조 원 배당을 확정했지만 남은 55조~75조 원의 주주환원 계획을 내년 1월로 미루자 주가가 4.13% 내렸고, 코스피는 장중 6,100선을 찍은 뒤 74.78포인트(1.24%) 내린 5,937.66으로 마감했어요. 미국 연준은 금리를 연 3.75~4.00%로 동결하면서 두 위원이 인상을 주장했고, 코스닥은 2.34% 내린 753.23, 원/달러 환율은 0.9원 내린 1,336.8원이었어요.",
  notice: "코스피 투자자별 금액은 매체마다 달라요. 이번 호는 한국거래소 정규장 기준(경북매일·미디어펜 마감 기사, 외국인 655억 원·개인 343억 원 순매수, 기관 4,447억 원 순매도)으로 맞췄어요. 같은 정규장이라도 외국인 순매수가 721억~766억 원으로 나온 매체(블록미디어·이투데이)가 있고, 대체거래소(NXT)까지 더한 집계로는 외국인 3,076억~3,077억 원 순매도(경북매일·파이낸셜뉴스)로 방향이 반대예요. 외국인 수급 그래프의 10월 29일 값은 장 마감 시점 집계이고, 10월 23~28일 값도 저녁 집계를 찾지 못해 장 마감 집계를 그대로 썼어요. 상승·하락 종목 수는 디지털데일리, 거래대금은 경북매일 집계예요. 프로그램 매매 금액은 확인하지 못해 뺐어요. CNN 공포 탐욕 지수는 28일 장 마감 뒤 값을 확인하지 못해 이번 호에서 뺐어요. 달러인덱스는 28일 뉴욕 마감 정리(Capp Notes, 뉴스핌은 102.15) 값이라 지난 호에 실은 블록미디어 값(102.05)과 기준이 달라요. 블록미디어는 28일 값을 101.809로 전해 매체마다 차이가 있어요. 국제 금 선물 종가는 이투데이·블록미디어 기준(4,051.60달러)이고, 뉴스핌은 4,057.30달러로 전했어요. KRX 금 1g은 발행 시점에 장 마감 값을 확인하지 못해 29일 오전 11시 35분 기사 시세를 실었어요. 28일 KRX 금 종가는 173,190원(1.64% 상승)으로, 지난 호에 실은 오전 시세(173,750원)와 달랐어요. 이투데이에 따르면 28일 반등 전 내림세는 6거래일이 아니라 19~27일 7거래일 연속이었어요. 비트코인은 29일 오후 4시 4분 시세예요.",

    { t:"국제 유가: WTI $102.78 / 브렌트유 $115.32", x:"WTI 12월물은 2.88달러(2.88%) 올라 이틀 만에 다시 100달러 위로 올라섰고, 브렌트유 12월물은 1.44달러(1.26%) 오른 115.32달러였어요. 월스트리트저널은 미국이 걸프 국가들에 11월 3일 중간선거 뒤 짧고 강도 높은 군사작전에 대비하라고 알렸다고 보도했어요. 예멘 후티 반군의 아덴 공항 공격 소식도 나왔고, 미국 원유 재고는 한 주 새 190만 배럴 줄어 예상(1만 5천 배럴 증가)과 반대였어요. ING의 워런 패터슨 원자재 전략 책임자는 유가가 중간선거 뒤 미국의 움직임에 민감하게 반응하고 있다고 짚었어요." },
    { t:"금(Gold): 국제 금 $4,051.6", x:"12월 인도분 금 선물이 0.56% 내린 4,051.60달러로 마감하며 사흘 만에 내렸어요. 금 현물도 0.5% 내린 4,039달러대였어요. 유가가 다시 오르자 물가와 긴축 걱정이 커졌고, 연준 발표 직후 금 현물은 4,035.48달러까지 밀렸어요. 29일 오전 8시 50분께에는 4,052.50달러로 조금 되올라왔어요(토큰포스트)." },
    { t:"비트코인: $79,859", x:"29일 오후 4시 4분 기준으로 전날보다 1.12% 내려 다시 8만 달러 아래로 내려왔어요. 이더리움은 1.61% 내린 2,310달러였어요. 가상자산 전체 시가총액은 약 2조 6,700억 달러였고, 파생상품 거래량은 하루 새 43.66% 늘어 약 8,580억 달러로 짧게 사고파는 거래가 많아졌어요. 비트코인이 전체 시가총액에서 차지하는 몫은 60.06%로 조금 올랐어요." }

  news: [
    { tag:"한국 · 기업", title:"삼성전자 3분기 영업이익 107조 4,405억 원 확정…배당 30조 원, 남은 주주환원 55조~75조 원은 내년 1월 결정",
      body:"삼성전자가 29일 발표한 3분기 확정 실적에서 매출은 195조 2,532억 원, 영업이익은 107조 4,405억 원, 순이익은 75조 1,361억 원이었어요. 1년 전보다 매출은 126.9%, 영업이익은 783.1% 늘었고, 매출과 영업이익 모두 4분기 연속 사상 최대예요. 반도체(DS) 부문이 영업이익 106조 5천억 원을 냈고, 그 가운데 메모리 매출은 140조 7천억 원으로 앞 분기보다 16% 늘었어요. 스마트폰·가전(DX) 부문은 8천억 원 적자였어요. 회사는 2027년 메모리 공급 부족이 올해보다 심할 것으로 보고, 내년에 HBM4 판매를 늘리고 HBM4E 양산을 시작하겠다고 했어요.",
      more:"주주에게 돌려줄 돈도 내놨어요. 3분기 현금배당은 보통주와 우선주 모두 주당 4,601원, 총 30조 원이에요. 올해 전체 주주환원 목표는 90조~110조 원인데, 이미 실행했거나 정한 35조 원을 빼면 55조~75조 원이 남아요. 이 돈은 현금배당과 자사주 매입·소각에 쓰고 우선주 매입 비중을 늘리겠다고 했지만, 구체적인 규모와 방식은 내년 1월 말 이사회에서 정해요. 한국경제에 따르면 원화 강세로 앞 분기보다 영업이익이 약 10조 원 줄어드는 효과도 있었어요. 올해 설비투자는 84조 4천억 원으로, 그 가운데 반도체에 76조 8천억 원을 써요.",
      why:"삼성전자는 코스피에서 시가총액이 가장 큰 종목이라, 이 회사의 주가가 지수를 크게 움직여요. 오늘 코스피 하락의 상당 부분이 삼성전자에서 나왔어요. 남은 주주환원 규모가 1월에 어떻게 정해지는지에 따라 주가와 외국인 수급이 다시 움직일 수 있어요.",
      url:"https://www.hankyung.com/article/202610292686g", src:"한국경제" },
    { tag:"거시경제 · 금리", title:"미국 연준, 기준금리 연 3.75~4.00% 동결…10대 2, 두 위원은 '인상' 주장",
      body:"미국 연준이 28일(현지시간) 연방공개시장위원회(FOMC)에서 기준금리를 연 3.75~4.00%로 그대로 뒀어요. 9월 16일 0.25%포인트 올린 뒤 이번에는 쉬어 갔어요. 투표권을 가진 12명 가운데 10명이 찬성했고, 리사 쿡 이사와 베스 해맥 클리블랜드 연은 총재는 0.25%포인트 인상을 주장하며 반대했어요. 성명은 경제 활동 평가를 9월의 '탄탄하다(solid)'에서 '강하다(strong)'로 올렸고, 물가를 2%로 되돌리려면 더 많은 정보를 모으는 게 도움이 된다고 적었어요.",
      more:"워시 의장은 9월 인상이 의도대로 작동했다면서도 물가가 여전히 너무 높다고 했고, 12월 결정에 대한 뚜렷한 신호는 주지 않았어요. 또 내년 정례회의를 8번에서 7번으로, 2028년에는 6번으로 줄이겠다고 밝혔어요. 회의 사이에 경제 지표를 더 모아 보겠다는 뜻이에요. 파이낸셜뉴스가 전한 CME 페드워치 기준 12월 인상 가능성은 하루 새 78.3%에서 87.9%로 올랐어요. 한국경제는 그동안 반대표를 낸 적 없던 쿡 이사의 반대가 의외라는 평가와 함께, 시장이 정책결정문은 매파적이지만 방법은 빠진 '애매한 동결'로 받아들였다고 전했어요.",
      why:"미국 기준금리는 세계 금리와 달러의 방향을 정해요. 인상을 주장한 반대표가 나오면서 12월에 한 번 더 올릴 거라는 예상이 커졌고, 미국 장기 금리가 5%를 넘으면 외국인 자금 흐름과 원/달러 환율, 대출 금리에도 영향을 줄 수 있어요.",
      url:"https://www.fnnews.com/news/202610290325510172", src:"파이낸셜뉴스" },
    { tag:"미국 · 주식", title:"클라우드는 둘 다 컸는데…마이크로소프트 '현금 넉넉', 알파벳 '현금 적자'에 시간외 희비",
      body:"28일(현지시간) 장 마감 뒤 마이크로소프트와 알파벳이 실적을 냈어요. 마이크로소프트는 7~9월 매출 923억 달러로 1년 전보다 19% 늘었고, 애저 매출은 331억 6,500만 달러로 48% 늘었어요. 잉여현금흐름은 186억 3,300만 달러로 시장 예상(85억 4,000만 달러)을 크게 넘었고, 다음 분기 애저 성장률을 49~50%로 내다봤어요. 알파벳은 매출 1,276억 달러로 25% 늘었지만 예상에는 못 미쳤어요. 구글 클라우드 매출은 307억 900만 달러로 103% 늘어 예상을 넘었지만, 잉여현금흐름이 90억 6,500만 달러 적자였어요. 마이크로소프트는 시간외에서 3% 안팎 올랐고, 알파벳은 10% 안팎 내렸어요.",
      more:"잉여현금흐름은 회사가 장사로 번 현금에서 설비투자를 빼고 남은 돈이에요(23일 호 '경제 상식 한 조각'). 알파벳은 영업으로 422억 9천만 달러를 벌었지만 설비에 513억 5,500만 달러를 써, 직전 분기(58억 5,500만 달러 적자)에 이어 두 분기 연속 마이너스가 됐어요. 시장 예상은 거의 0(3,600만 달러 적자)이었는데 그보다 약 90억 달러 더 나간 거예요. 뉴스1은 알파벳이 내년 설비투자를 3,000억 달러 넘게 예상했다고 전했어요. 같은 날 오라클은 바깥에서 새로 빌리는 돈을 200억 달러로 묶겠다고 밝혀 10.73% 올랐어요.",
      why:"빅테크가 데이터센터에 쓰는 돈은 엔비디아 칩과 SK하이닉스·삼성전자 메모리 주문의 출발점이에요. 투자를 늘리는 건 반도체에 좋은 신호지만, 현금이 모자라 빚이나 새 주식으로 메워야 하면 투자 속도가 흔들릴 수 있다는 걱정이 커져요. 30일 한국 시간 새벽에는 아마존 실적이 이어져요.",
      url:"https://dealsite.co.kr/articles/171617", src:"딜사이트" }
  ],
  term: {
    name: "오버행, 언제든 시장에 쏟아질 수 있는 '대기 물량' 읽는 법",
    card: { eyebrow:"경제 상식 한 조각 · 2026.10.29", title:"실적과 상관없이<br><span>왜 '팔릴 주식'에 주가가 내릴까</span>", sub:"큰 주주가 가진 주식이 시장에 나오기까지의 순서",
      steps: [ { k:"큰 지분", x:"대주주나 초기 투자자가 많은 주식을 갖고 있어요" }, { k:"처분 계획", x:"지분을 줄이겠다는 계획이나 공시가 나와요" }, { k:"대기 물량", x:"앞으로 시장에 나올 수 있는 주식이 생겨요" }, { k:"주가 부담", x:"사려는 돈보다 팔릴 주식이 많아 보이면 값이 눌려요" } ] },
    note: "<b>이 코너는 특정 상품 추천이 아니라 경제 기본 지식을 공부하는 자료예요.</b> 본문에 나오는 사이트 이름은 숫자를 직접 확인하는 방법을 설명하기 위한 예시예요.",
    intro: "29일 LG에너지솔루션은 실적 소식 없이 하루에 8.60% 내렸어요. 최대주주인 LG화학이 지분을 2조 5천억 원어치 처분하기로 했기 때문이에요. 기사마다 나온 '오버행'이라는 말이 무엇이고, 왜 주가를 누르는지 차례로 풀어볼게요.",
    points: [
      { t:"1) 오버행이 뭐예요?", items:[
        "오버행(overhang)은 <mark>지금은 시장에 나와 있지 않지만, 언제든 팔려 나올 수 있는 많은 양의 주식</mark>을 말해요. 머리 위에 걸려 있는 짐처럼 주가를 누른다는 뜻이에요. 우리말로는 '대기 매물'이나 '잠재 매물'이라고도 해요.",
        "동네 중고 장터에 같은 물건을 잔뜩 가진 사람이 '곧 다 내놓을 거예요'라고 말했다고 생각해 봐요. 아직 한 개도 안 팔았는데도, 사려던 사람들은 '조금 기다리면 더 싸게 살 수 있겠다'며 지갑을 닫아요. 그래서 물건값이 먼저 내려가요." ] },
      { t:"2) 어디서 생기나요?", items:[
        "가장 흔한 건 <mark>대주주의 지분 매각 계획</mark>이에요. 모회사가 자회사 지분을 줄이거나, 회사를 키운 초기 투자자가 돈을 회수하려 할 때 생겨요.",
        "상장 뒤 일정 기간 팔지 못하게 묶어 둔 주식(의무보유)이 풀리는 날, 나중에 주식으로 바꿀 수 있는 전환사채·교환사채가 주식으로 바뀌는 때에도 오버행 걱정이 커져요." ],
        box:{ label:"이번 LG화학의 방식, PRS", text:"LG화학은 LG에너지솔루션 주식 653만 5,939주(약 2조 5천억 원)를 <b>주가수익스와프(PRS)</b> 계약으로 처분해요. 주식을 상대방에게 넘기고 돈을 받되, 2년 동안 주가가 기준가격(주당 38만 2,500원)보다 오르면 LG화학이 차익을 얻고 내리면 손실을 메우는 구조예요. 주식은 11월 27일부터 12월 24일 사이에 넘어가요. 시장에 한꺼번에 던지는 방식은 아니지만, 그만큼의 주식이 대주주 손을 떠난다는 점에서 오버행 걱정을 키웠어요." } },
      { t:"3) 왜 중요한가요?", items:[
        "주가는 사려는 돈과 팔려는 주식의 힘겨루기로 정해져요. 오버행이 있으면 회사 실적과 상관없이 <mark>팔려는 쪽의 힘이 커 보이는</mark> 효과가 생겨요.",
        "한 번에 끝나지 않을 수 있다는 점도 커요. 대주주가 '앞으로 몇 년 동안 지분을 얼마까지 줄이겠다'고 밝혀 두면, 그 기간 내내 '또 나오겠지'라는 걱정이 주가를 눌러요." ],
        arrow:"오버행은 '이미 팔린 주식'이 아니라 '앞으로 팔릴 수 있는 주식'에 대한 걱정이에요." },
      { t:"4) 요즘 왜 뉴스에 나오나요?", items:[
        "LG화학 이사회가 28일 LG에너지솔루션 지분 2.79%를 처분하기로 하면서, LG화학의 지분율은 79.38%에서 76.59%로 낮아져요. 세후로 들어오는 돈의 약 20%(약 4천억 원)는 자사주 매입과 배당 같은 LG화학 주주환원에 쓰기로 했어요.",
        "LG화학은 지난해 11월 2030년까지 이 지분을 약 70%로 줄이겠다고 밝혔어요. 이번 처분 뒤에도 약 6.59%포인트가 더 남아요. 서울경제에 따르면 상장 때 구주 매출(2조 5,500억 원), 교환사채(약 2조 6천억 원), 지난해 PRS(약 2조 원)에 이번까지 더하면 누적 처분 규모가 9조 6천억 원이에요. 29일 LG에너지솔루션은 8.60% 내린 35만 6,000원으로 마감했어요." ] },
      { t:"5) 우리에게는 어떤 영향이 있나요?", items:[
        "그 회사 주식을 가진 사람은 실적이 좋아도 주가가 한동안 무겁게 움직일 수 있어요. 코스피를 따라가는 펀드나 2차전지 상장지수펀드(ETF)에 LG에너지솔루션이 큰 비중으로 들어 있다면 간접적으로 영향을 받아요.",
        "반대로 지분을 판 회사에는 돈이 들어와요. LG화학처럼 그 돈의 일부를 자기 회사 주주에게 돌려주겠다고 하면, 파는 쪽 주주에게는 좋은 소식이 될 수도 있어요. 같은 거래가 두 회사 주주에게 다르게 읽히는 거예요.",
        "공모주를 살 때도 알아 두면 좋아요. 상장 뒤 의무보유가 풀리는 날짜에는 주가가 흔들리는 일이 잦아서, 공모주 투자 전에 그 날짜를 확인하는 습관이 도움이 돼요." ] },
      { t:"6) 숫자와 기사는 이렇게 읽어요", items:[
        "<mark>얼마나 큰가</mark>를 봐요. 처분 규모가 그 회사 전체 주식의 몇 %인지, 하루 거래대금과 견주면 며칠 치인지 따져요. 이번은 전체 주식의 2.79%예요.",
        "<mark>언제, 어떻게 나오나</mark>를 봐요. 장중에 시장에 파는지, 큰손에게 한꺼번에 넘기는지(블록딜), PRS처럼 계약으로 넘기는지에 따라 주가에 주는 충격이 달라요.",
        "<mark>얼마나 남았나</mark>를 봐요. 대주주가 밝힌 목표 지분율까지 몇 %포인트가 남았는지가 앞으로의 오버행 크기예요." ],
        box:{ label:"기사에서 볼 세 가지", text:"<b>규모</b>: 전체 주식의 몇 %인가요? <b>방식과 시기</b>: 장내 매도, 블록딜, PRS 가운데 무엇이고 언제 넘어가나요? <b>남은 양</b>: 목표 지분율까지 얼마나 더 팔 수 있나요? 이번 LG에너지솔루션은 '2.79%', 'PRS·11월 27일~12월 24일', '70% 목표까지 약 6.59%포인트'였어요." } },
      { t:"7) 어디서 직접 확인할 수 있나요?", items:[

  news: [
    { tag:"한국 · 기업", title:"SK하이닉스, 3분기 영업이익 83조 3,338억 원…'2029년까지 사실상 완판', 올해 주주환원 100조 원",
      body:"SK하이닉스가 28일 발표한 3분기 실적에서 매출은 104조 6,155억 원, 영업이익은 83조 3,338억 원으로 모두 사상 최대였어요. 매출이 한 분기에 100조 원을 넘은 건 처음이고, 영업이익률은 약 80%예요. 순이익은 39조 7,756억 원이었어요. 회사는 앞으로 3년(2029년까지) 동안의 D램과 HBM 생산 물량이 협상 중인 물량까지 더해 사실상 다 팔렸고, 메모리 공급 부족이 2030년까지 이어질 것으로 봤어요. 4분기에는 차세대 HBM4가 출하량과 매출 모두 HBM3E를 넘어설 것이라고 했어요.",

      why:"SK하이닉스는 코스피에서 시가총액이 두 번째로 큰 종목(약 1,086조 원)이라, 이 회사의 실적과 전망이 지수 전체를 움직여요. 오늘 코스피 상승분 가운데 상당 부분이 반도체 두 종목에서 나왔어요. 회사가 번 돈을 배당과 자사주 소각으로 돌려주는 '주주환원'은 오늘 '경제 상식 한 조각'에서 자세히 풀었어요.",

    { tag:"미국 · 주식", title:"메타, AI 투자금 975억 달러로 늘려…250억 달러 공모에 5배 주문, 엔비디아·AMD도 투자",
      body:"메타가 AI 인프라 투자를 위해 마련하려는 돈을 950억 달러에서 975억 달러(약 129조 원)로 늘렸어요. 그 가운데 보통주 공모를 225억 달러에서 250억 달러로 키워 주당 625달러에 4,000만 주를 팔았어요. 발표 직전 거래일 종가(642달러)보다 약 2.7% 싼 값이에요. 블룸버그에 따르면 공모에는 판 물량의 약 다섯 배 주문이 몰렸고, 절반 넘게를 장기 투자자와 기존 주주가 가져갔어요. 엔비디아는 이 공모에 30억 달러, AMD는 10억 달러를 넣기로 했어요. 전환우선주(주당 50달러, 2억 5천만 주)도 몇 배 넘게 주문이 들어왔어요.",

      why:"메타 같은 빅테크가 데이터센터에 쓰는 돈은 엔비디아 칩과 SK하이닉스·삼성전자 메모리 주문으로 이어져요. 투자금 마련 걱정이 줄어든 게 오늘 국내 반도체 강세의 배경 가운데 하나로 꼽혔어요. 반대로 주식을 새로 찍어 내는 일이 잦아지면, 기존 주주의 몫이 줄어든다는 점도 함께 기억해 둘 만해요.",
      url:"https://www.hankyung.com/article/2026102892027", src:"한국경제" },
    { tag:"미국 · 경제", title:"미국 10월 소비자신뢰지수 91.7, 예상 크게 웃돌며 4개월 만에 반등",
      body:"미국 민간 경제조사기관 콘퍼런스보드가 27일(현지시간) 발표한 10월 소비자신뢰지수는 91.7로 9월(84.2, 81.9에서 상향 수정)보다 7.5포인트 올랐어요. 다우존스가 모은 예상치(81)를 크게 넘었고 6월 이후 가장 높아요. 지금의 경기와 일자리 형편을 묻는 현재 상황 지수는 120.4로 8.6포인트, 앞으로 6개월을 묻는 기대 지수는 72.6으로 6.9포인트 올라 석 달 연속 하락을 끊었어요. 다만 앞으로 1년 물가 예상은 5.8%로 여전히 높았어요.",
      more:"콘퍼런스보드 지수는 미국 가계에 경기·일자리·소득을 어떻게 보는지 물어 1985년을 100으로 놓고 숫자를 매겨요. 이달 12일 호에서 다룬 미시간대 소비자심리지수와 비슷하지만, 미시간대가 가계 형편과 물가에 더 무게를 둔다면 콘퍼런스보드는 일자리 사정을 더 많이 반영해요. 이번 반등에 대해 콘퍼런스보드의 퍼거스 매코믹 수석 이코노미스트는 9~10월 휘발유 값이 내린 흐름과 맞물려 있다고 봤어요. 하지만 지수가 지난 몇 년 동안의 긴 하락 흐름에서는 벗어나지 못했고, 앞으로 6개월 동안 서비스와 내구재 지출을 줄이겠다는 응답과 차·집·전자제품 구매 계획도 약해졌다고 짚었어요.",
      why:"소비는 미국 경제의 가장 큰 엔진이에요. 마음이 풀린 건 좋은 소식이지만, 경기가 버틴다는 신호는 연준이 금리를 내리기보다 더 올릴 근거가 되기도 해요. 이 숫자가 나온 뒤 미국 국채 금리와 달러가 올랐고, 28일 원/달러 환율이 14원 오른 배경으로도 꼽혔어요.",
      url:"https://www.ajunews.com/view/20261028062720688", src:"아주경제" }
  ],
  term: {

    intro: "오늘 SK하이닉스 기사마다 '주주환원 100조 원'이라는 말이 나왔어요. 회사가 번 돈을 어떻게 주주에게 돌려주는지, 왜 '배당'과 '자사주 소각'을 나눠 보는지 차례로 풀어볼게요.",
    points: [
      { t:"1) 주주환원이 뭐예요?", items:[
        "주주환원은 <mark>회사가 번 돈의 일부를 회사의 주인인 주주에게 돌려주는 것</mark>이에요. 대표적인 방법이 현금을 나눠 주는 배당, 그리고 시장에서 자기 회사 주식을 사들이는 자사주 매입이에요.",
        "친구들과 돈을 모아 차린 가게가 장사를 잘해 돈이 남았다고 생각해 봐요. 남은 돈을 투자한 친구들에게 나눠 줄 수도 있고(배당), 다른 사람이 가진 가게 지분을 사들여 없애서 남은 친구들의 몫을 키워 줄 수도 있어요(자사주 매입·소각)." ] },
      { t:"2) 배당과 자사주 소각은 어떻게 달라요?", items:[
        "배당은 <mark>현금이 내 계좌로 바로 들어오는</mark> 방법이에요. 대신 국내에서는 배당을 받을 때 세금이 붙어요. 배당을 받으려면 회사가 정한 기준일에 주식을 갖고 있어야 해요.",
        "자사주 소각은 회사가 사들인 주식을 아예 없애는 거예요. 주식 수가 줄면 같은 이익을 더 적은 주식이 나눠 갖게 돼서, <mark>한 주가 가진 몫(주당 가치)이 커져요</mark>. 현금이 바로 들어오지는 않지만 주가에 도움이 되는 방식이에요." ],
        box:{ label:"'매입'과 '소각'은 따로 봐요", text:"회사가 자사주를 사들이기만 하고 없애지 않으면, 그 주식은 나중에 다시 시장에 팔리거나 직원 보상 같은 데 쓰일 수 있어요. 그래서 시장은 <b>사들인 뒤 소각까지 하는지</b>를 중요하게 봐요. 이번 SK하이닉스도 자사주 20조 원을 사들이기로 했는데, 그 가운데 <b>10조 원은 소각</b>하고 약 10조 원은 직원 보상에 쓰기로 해서, 주주환원 금액에는 소각하는 쪽만 넣었어요." } },
      { t:"3) 왜 중요한가요?", items:[

        "회사가 꾸준히 주주환원을 약속하면, 투자자는 앞으로 받을 몫을 더 믿을 수 있어 그 회사 주식에 더 높은 값을 매기기도 해요. 그동안 한국 주식이 비슷한 외국 회사보다 싸게 거래된다는 '코리아 디스카운트'의 이유로 낮은 주주환원이 자주 꼽혔어요." ],
        arrow:"이익이 '회사가 얼마나 벌었나'라면, 주주환원은 '그중 얼마가 주주에게 오나'예요." },
      { t:"4) 요즘 왜 뉴스에 나오나요?", items:[

        box:{ label:"기사에서 볼 세 가지", text:"<b>구성</b>: 배당과 자사주가 각각 얼마인가요? <b>지속성</b>: 정기 배당인가요, 특별배당인가요? <b>소각</b>: 사들인 자사주를 없애나요, 다른 데 쓰나요? 이번 SK하이닉스는 '배당 30조 원 이상·자사주 60조 원 이상', '정기 1만 원+특별 1만 원', '20조 원 가운데 10조 원 소각'이었어요." } },

  calendarIntro: "슈퍼위크의 후반이에요. 오늘 밤부터 미국 금리 결정과 빅테크 실적, 삼성전자 확정 실적, 미국 성장률과 물가, 유럽·일본 금리 결정이 줄줄이 이어져요. 미국 일정은 한국 시간도 함께 적었어요.",

  news: [
    { tag:"미국 · 주식", title:"앤트로픽, 나스닥 상장 신청서 공개…상반기 매출 163억 달러로 1년 새 14배",
      body:"AI 회사 앤트로픽이 26일(현지시간) 미국 증권거래위원회(SEC)에 상장 신청서(S-1)를 공개로 제출했어요. 종목 코드는 'ANT'로, 나스닥 글로벌 셀렉트 시장에 상장할 계획이에요. 상반기 매출은 162억 9천만 달러(약 21조 6천억 원)로 1년 전(11억 6천만 달러)의 약 14배였고, 상반기 영업손실은 6억 9,300만 달러로 1년 전(21억 4천만 달러)보다 줄었어요. 골드만삭스와 모건스탠리 등 20곳 넘는 금융회사가 상장을 맡고, 블룸버그에 따르면 이르면 11월 9일이 낀 주부터 투자자를 만나는 절차(로드쇼)를 시작해요.",
      more:"상장 신청서는 회사가 주식을 시장에 처음 팔기 전에 사업 내용, 실적, 위험 요인을 자세히 적어 내는 서류예요. 앤트로픽은 6월에 비공개로 초안을 냈다가 이번에 공개로 바꿨어요. 상반기 순손실은 807억 달러로 컸는데, AI타임스는 기업가치가 오르면서 전환사채(나중에 주식으로 바꿀 수 있는 채권)의 평가 손실이 커진 영향이라 영업 손실이나 현금 유출과는 다르다고 설명했어요. 상반기 컴퓨팅·인프라에 쓴 돈은 89억 달러로 1년 전보다 283% 늘었어요. 공모 주식 수와 가격 범위는 아직 정해지지 않았어요. 일부 보도는 최대 2조 달러 기업가치와 1,000억 달러 이상 조달을 거론했지만, 투자자들 사이에서는 1조 4천억~1조 5천억 달러를 말하는 의견도 있어 실제 값은 앞으로 정해져요.",
      why:"앤트로픽 같은 AI 회사의 매출은 엔비디아 칩과 SK하이닉스·삼성전자 메모리 주문으로 이어지는 출발점이에요. 비상장 AI 회사의 실적이 처음으로 상장 서류에 공개되면서 AI 투자 걱정이 누그러졌고, 27일 코스피 반도체 강세로 이어졌어요. 앤트로픽에 투자한 SK텔레콤 주가도 장중 크게 흔들렸어요.",
      url:"https://www.aitimes.com/news/articleView.html?idxno=216687", src:"AI타임스" },
    { tag:"한국 · 거시경제", title:"3분기 성장률 1.0% '깜짝 성장'…반도체 수출·설비투자가 끌고 민간소비는 뒷걸음",
      body:"한국은행이 27일 발표한 3분기 실질 국내총생산(GDP) 속보치는 앞 분기보다 1.0%, 1년 전보다 3.4% 늘었어요. 8월 전망(0.3%)을 0.7%포인트 웃돌았어요. 수출은 반도체와 기계·전기장비를 중심으로 2.3%, 설비투자는 반도체 제조장비를 중심으로 4.1%, 정부 소비는 1.9% 늘었어요. 반면 민간소비는 승용차·가전 같은 물건과 금융·음식 서비스가 줄어 0.2% 감소했어요. 업종별로는 제조업이 2.0% 늘었고 서비스업은 0.2% 늘어나는 데 그쳤어요.",
      more:"GDP는 한 나라 안에서 일정 기간 새로 만들어 낸 물건과 서비스의 값을 모두 더한 숫자예요. 속보치는 분기가 끝나고 약 한 달 뒤 처음 나오는 숫자라 나중에 조금 고쳐질 수 있어요. 이번에는 나라 전체가 실제로 손에 쥔 소득을 보여주는 실질 국내총소득(GDI)도 앞 분기보다 3.4%, 1년 전보다 18.8% 늘었어요. 이투데이에 따르면 1977년 4분기(19.0%) 이후 가장 빠른 속도예요. 반도체 값이 올라 같은 양을 팔아도 더 많이 벌었다는 뜻이에요. 한국은행은 다음 달 올해 성장률 전망(3.3%)을 상당 폭 올리겠다고 했고, 4분기 성장률이 0%여도 올해 성장률은 3.6%가 돼요.",
      why:"성장률은 한국은행이 금리를 정할 때 보는 핵심 숫자예요. 경기가 강하면 금리를 내리기 어렵고, 지난주 '긴축을 이어간다'고 했던 한국은행이 11월에 금리를 더 올릴 근거가 될 수 있어요. 반대로 민간소비가 줄어든 건 반도체 호황이 아직 생활 경제로 고르게 번지지 않았다는 신호예요.",
      url:"https://www.etoday.co.kr/news/view/2640332", src:"이투데이" },
    { tag:"거시경제 · 신흥국", title:"룰라 대통령 4선에 브라질 증시 13.88% 폭락…헤알화 하루 8% 급락",
      body:"25일(현지시간) 브라질 대선 결선에서 룰라 대통령이 51.8%를 얻어 플라비우 보우소나루 상원의원(48.2%)을 이겼어요. 다음 날 브라질 대표 주가지수 보베스파는 13.88% 내린 176,608로 마감했고, 장중에는 17.34%까지 빠져 2020년 코로나19 이후 처음으로 거래를 멈추는 서킷브레이커가 걸렸어요. 브라질 돈 헤알화는 달러 대비 8% 떨어져 1달러에 5.41헤알이 됐어요. 1999년 이후 가장 큰 하루 낙폭이에요. 미국에 상장된 브라질 주식 상장지수펀드(ETF)도 19.82% 급락했어요.",
      more:"시장은 1차 투표에서 앞섰던 보우소나루 의원이 이겨 나라 살림을 아끼고 금리를 낮출 거라고 기대했어요. 그런데 결과가 뒤집히자 그 기대에 걸었던 돈이 한꺼번에 빠져나갔어요. 룰라 대통령은 주말 대중교통 무료, 개인 빚 탕감, 복지 확대 같은 공약을 내걸었는데, 국제통화기금(IMF)은 브라질의 올해 재정적자를 GDP의 약 8%, 나랏빚을 약 83%로 보고 있어요. 기준금리도 연 13.75%로 높아요. RBC블루베이의 그레이엄 스톡은 시장이 재정을 바로잡겠다는 정부의 뜻을 기다리고 있고, 그 핵심이 재무장관 임명이라고 짚었어요.",
      why:"나라 살림에 대한 믿음이 흔들리면 주식·돈·채권 값이 하루에 함께 무너질 수 있다는 걸 보여줘요. 브라질 채권과 주식은 국내 투자자도 적지 않게 사는 상품이라, 해외 투자를 할 때는 수익률뿐 아니라 그 나라의 재정과 환율 위험도 함께 따져 봐야 해요.",
      url:"https://www.hankookilbo.com/news/article/A2026102712360003378", src:"한국일보" }

  news: [
    { tag:"미국 · 주식", title:"스페이스X 이동통신 진출 보도에 AT&T 7.96%·T모바일 7.71% 급락",
      body:"23일(현지시간) 스페이스X가 미국 이동통신 시장에 본격적으로 들어오려 한다는 외신 보도가 나오면서 미국 통신주가 크게 내렸어요. AT&T는 1.81달러(7.96%) 내린 20.93달러로 마감했고, T모바일은 7.71%, 버라이즌은 1.19% 내렸어요. 보도는 스페이스X가 미국 4대 이동통신사로 올라서기 위해 전국 기지국 탑의 절반가량을 확보하려 한다는 내용이에요. 반대로 기지국 탑을 빌려주는 회사들은 수요가 늘 거라는 기대에 크라운캐슬이 9% 넘게, 아메리칸타워가 약 4% 올랐어요.",
      more:"스페이스X는 위성 인터넷 사업을 하는 회사로, 휴대전화가 위성과 바로 연결되는 서비스도 키우고 있어요. 여기에 땅 위의 기지국까지 갖추면 기존 통신사와 정면으로 경쟁하게 돼요. 통신업은 기지국과 주파수에 큰돈이 들어가는 사업이라, 고객을 빼앗기면 그 비용을 나눌 사람이 줄어 이익이 크게 흔들려요. 금리가 높은 지금은 빚 부담도 커서 새 경쟁자에 더 민감해요. 다만 이번 소식은 보도 단계이고, 실제 기지국 확보 규모나 서비스 일정은 아직 확인되지 않았어요.",
      why:"통신주는 꾸준한 배당 때문에 경기를 덜 타는 종목으로 여겨져 왔어요. 그런 업종도 새 기술을 가진 경쟁자가 나타나면 하루에 8% 가까이 흔들릴 수 있다는 걸 보여줘요. 지수를 따라가는 펀드에도 통신주가 들어 있어 영향을 받아요.",
      url:"https://news.jkn.co.kr/post/1045448", src:"재경일보" },
    { tag:"거시경제 · 원자재", title:"브렌트유 116.72달러, 4월 말 이후 최고…'미국 이란 공격 재개' 우려",
      body:"23일(현지시간) 브렌트유 12월물은 3.55달러(3.14%) 오른 배럴당 116.72달러, WTI 12월물은 3.80달러(3.82%) 오른 103.27달러로 마감했어요. 한국석유공사 집계로 중동산 두바이유도 1.50달러 오른 116.90달러였어요. 미국과 이스라엘이 이란 공격 재개를 검토한다는 보도가 나오자, 이란은 공격이 다시 시작되면 이웃 나라의 경제·민간 시설을 칠 수 있다고 경고했어요. 예멘 후티 반군의 사우디 공격과 아랍에미리트 근처 유조선 기름 유출 사고도 중동 바닷길 불안을 키웠어요.",
      more:"유가에는 실제 공급량뿐 아니라 '혹시 막힐지 모른다'는 걱정의 값이 함께 붙어요. 미국과 독일이 전략비축유를 풀고 러시아산 경유 수송이 다시 시작된 건 값을 누르는 쪽이었지만, 공격 소식이 더 크게 작용했어요. 기름값은 이미 미국 물가를 밀어 올리고 있어요. 9월 미국 소비자물가는 1년 전보다 3.7% 올랐는데, 휘발유가 한 달 새 9.1% 뛰어 상승분의 절반 넘게를 차지했어요. 23일 나온 미시간대 소비자심리지수도 중동 분쟁에 따른 물가 부담으로 사상 최저 부근에 머물렀어요.",
      why:"우리나라는 원유를 거의 다 수입해요. 유가가 오르면 주유소 기름값과 전기·가스 요금, 물건값이 시차를 두고 따라 올라요. 미국 물가가 오르면 연준이 금리를 높게 오래 둘 가능성이 커져, 외국인 자금과 환율에도 영향을 줘요.",
      url:"https://www.energy-news.co.kr/news/articleView.html?idxno=229226", src:"에너지신문" },
    { tag:"한국 · 주식", title:"코스피 5,469로 7개월 만에 최저…한 달 하락률 21.6%, 주요 지수 중 가장 커",

  news: [
    { tag:"미국 · 주식", title:"메타, 상장 뒤 첫 잉여현금흐름 적자…AI 투자금 위해 의결권 없는 주식까지",
      body:"메타가 21일(현지시간) 발표한 3분기 실적에서 잉여현금흐름이 약 21억 2천만 달러 적자였어요. 1년 전 같은 분기에는 약 106억 달러 흑자였어요. 영업으로 번 현금(327억 9천만 달러)보다 설비투자(349억 1천만 달러)가 많았던 거예요. 메타는 올해 설비투자 전망을 1,300억~1,450억 달러에서 1,350억~1,450억 달러로 올렸고, AI 투자금을 마련하려고 의결권 없는 새 종류의 주식을 내겠다고 밝혔어요. 22일 주가는 6.98% 내린 648.85달러로 마감했고, 5년물 CDS 프리미엄은 114.79bp로 사상 최고였어요.",
      more:"블룸버그에 따르면 메타가 데이터센터·컴퓨팅·에너지 등에 앞으로 쓰기로 약속한 금액은 약 8,250억 달러로, 7월(약 7,000억 달러)보다 늘었어요. 이 약속은 지금 갚아야 할 빚과는 다르지만, 앞으로 큰돈이 계속 나간다는 뜻이에요. 의결권 없는 주식은 회사에 돈을 대지만 회사 결정에 표를 던질 수는 없는 주식이에요. 새 주식을 내면 기존 주주의 몫이 줄어들 수 있어요. 미국 자산운용사 올스프링의 채권 트레이더는 AI 경쟁이 점점 자금 조달 경쟁이 되고 있다고 짚었어요. 반면 한 시장 전략가는 CDS가 오른 데에는 메타에 돈을 빌려준 은행들의 위험 대비 거래도 섞여 있어, 실제 부도 위험이 크게 커졌다고 보기는 어렵다고 했어요.",
      why:"메타 같은 빅테크가 데이터센터에 쓰는 돈은 엔비디아 칩과 SK하이닉스·삼성전자 메모리 주문으로 이어져요. 투자를 이어 갈 돈이 충분한지에 대한 의심은 반도체 주가를 바로 흔들어요. 22일 미국 반도체지수가 6.72%, 23일 코스피가 장 초반 4% 넘게 빠진 배경이에요.",
      url:"https://www.aitimes.com/news/articleView.html?idxno=216578", src:"AI타임스" },
    { tag:"미국 · 채권", title:"미국 10년 국채 금리 하루 0.193%p 급락해 4.95%, 2023년 3월 이후 최대 낙폭",
      body:"22일(현지시간) 미국 10년 국채 금리는 0.193%포인트 내린 4.952%로 마감했어요. 2023년 3월 10일 이후 하루 낙폭이 가장 커요. 이달 7일에는 5.3645%까지 올라 2002년 4월 이후 가장 높았는데, 2주 남짓 만에 5% 아래로 내려왔어요. 2년 금리는 0.188%포인트 내린 4.635%, 30년 금리는 0.151%포인트 내린 5.286%였어요. 시카고상품거래소(CME) 페드워치 기준 다음 주 회의에서 금리를 올릴 가능성은 7.2%로, 1주 전(27.7%)과 한 달 전(55.4%)보다 크게 낮아졌어요.",
      more:"국채 금리와 국채 가격은 반대로 움직여요. 국채를 사려는 사람이 몰리면 가격이 오르고 금리는 내려요. 이날은 AI 회사들의 자금 조달 걱정에 기술주를 판 돈이 가장 안전하다고 여겨지는 미국 국채로 옮겨 갔어요. 세이지 어드바이저리의 공동 최고투자책임자는 에너지·물가 걱정과 국채로 피하려는 수요 사이의 싸움에서 최근 일주일은 안전자산 쪽이 이겼다고 진단했어요. 다만 같은 날 유가는 4% 뛰었고, 5년 만기 물가연동국채 입찰 금리는 2023년 10월 이후 가장 높았어요. 물가 걱정이 사라진 건 아니라는 뜻이에요.",
      why:"미국 국채 금리는 세계 금리와 대출 금리의 기준이에요. 금리가 내리면 주식 가치 계산에는 숨통이 트이지만, 이번처럼 불안 때문에 국채로 돈이 몰린 경우에는 위험자산이 약하다는 신호이기도 해요. 금리 하락이 계속될지는 다음 주 연준 회의와 PCE 물가에 달려 있어요.",
      url:"https://www.newspim.com/news/view/20261023000034", src:"뉴스핌" },
    { tag:"한국 · 기업", title:"SK하이닉스, 미국 손자회사 솔리다임 상장 검토 멈춰…'중복상장' 걱정 덜어",
      body:"SK하이닉스는 23일 장 시작 전 공시에서 미국 손자회사 솔리다임의 상장 전 투자 유치(프리IPO)와 기업공개(IPO) 검토를 중단한다고 밝혔어요. 생산능력 확대를 위한 자금 조달 방법을 검토했지만 자본시장 여건 등을 고려했다는 설명이에요. 다만 솔리다임의 성장 가능성과 미국 내 새 생산시설이 필요하다는 판단은 그대로라고 했어요. 이날 SK하이닉스는 장 초반 119만 원대까지 밀렸다가 4.42% 오른 127만 7,000원으로 마감했어요.",
      more:"솔리다임은 SK하이닉스가 2021년 인텔의 낸드플래시·SSD 사업을 인수해 만든 회사로, 미국 중간지주사 AI컴퍼니를 통해 지분 100%를 갖고 있어요. 모회사와 자회사가 함께 상장하는 걸 '중복상장'이라고 하는데, 투자자는 자회사 주식을 따로 살 수 있게 되니 모회사 주식의 매력이 줄고, 그만큼 모회사 주가가 할인받는다는 걱정이 있어요. 주주들의 반발이 컸고, 이억원 금융위원장도 22일 국정감사에서 솔리다임의 미국 상장이 중복상장 가이드라인 적용 대상이라고 답했어요.",
      why:"SK하이닉스는 코스피에서 비중이 두 번째로 큰 종목이에요. 이번 결정은 주주 가치를 지키려는 신호로 읽혀 투자 심리를 받쳤어요. 다만 미국 생산시설을 늘리는 데 필요한 돈을 어떻게 마련할지는 숙제로 남았어요. 28일 3분기 실적 발표에서 추가 설명이 나올지 지켜볼 만해요.",
      url:"https://www.hankyung.com/article/2026102300706", src:"한국경제" }
  ],

        box:{ label:"메타 3분기를 계산해 보면", text:"<b>영업으로 번 현금</b> 327억 9천만 달러 − <b>설비투자</b> 349억 1천만 달러 = <b>잉여현금흐름</b> 약 −21억 2천만 달러. 1년 전 같은 분기에는 약 106억 달러가 남았어요. 2012년 상장 뒤 분기 기준으로 처음 마이너스가 됐어요." } },

        arrow:"이익이 '얼마나 잘 팔았나'를 보여준다면, 잉여현금흐름은 '그러고도 손에 남은 돈이 있나'를 보여줘요." },
      { t:"4) 요즘 왜 뉴스에 나오나요?", items:[

  headline: "금리는 그대로 뒀지만 '긴축은 계속'이라는 한은에, 코스피 3.52% 내려 5,533으로 마감했어요",

  notice: "코스피·코스닥 투자자별 금액은 지난 호들처럼 한국거래소 정규장 기준(서울신문 마감 기사)으로 맞췄어요. 이 기준으로 코스피 외국인은 614억 원 순매수였지만, 대체거래소(NXT)까지 더한 것으로 보이는 뉴스핌 집계로는 외국인 3,991억 원·기관 6,834억 원 순매도, 개인 1조 364억 원 순매수로 외국인의 방향이 반대예요. 외국인 수급 그래프의 10월 22일 값은 장 마감 시점 집계이고, 10월 21일 값도 저녁 집계를 찾지 못해 지난 호의 장 마감 집계(6,600억 원 순매수)를 그대로 썼어요. KRX 금 1g은 발행 시점에 장 마감 값을 확인하지 못해 22일 낮 12시쯤 기사에 실린 시세를 썼어요. 국제 금은 12월물 선물이고, 기사에 소수점 아래 값이 없어 4,150달러로 적었어요. CNN 공포 탐욕 지수는 21일 장 마감 뒤 값을 확인하지 못해 뺐어요. 메타·테슬라의 시간외 등락률은 매체마다 달라 방향 위주로 적었어요. 코스닥 거래대금은 확인하지 못해 뺐어요. 비트코인은 22일 오전 11시 59분 시세예요.",

      "하락은 넓게 퍼졌어요. 서울신문 집계로 코스피에서 내린 종목은 709개, 오른 종목은 174개였고, 대형주가 3.71% 내려 중형주(-1.72%)와 소형주(-1.20%)보다 많이 빠졌어요. 거래대금은 13조 7,003억 원으로 전날(17조 1,666억 원)보다 줄었어요. 코스닥은 28.66포인트(3.62%) 내린 764.10으로 마쳐 전날 오른 몫(10.79포인트)의 두 배 넘게 내줬어요. 외국인이 1,200억 원, 기관이 1,002억 원을 팔았고 개인이 2,209억 원을 샀어요. 2차전지 소재주 에코프로비엠(-9.66%)과 에코프로(-7.54%), 반도체 장비주 주성엔지니어링(-8.93%)과 원익IPS(-7.92%)가 크게 빠졌어요."

  news: [
    { tag:"한국 · 금융", title:"한국은행, 기준금리 연 3.00% 만장일치 동결…'긴축 기조는 이어간다'",
      body:"한국은행 금융통화위원회가 22일 기준금리를 연 3.00%로 동결했어요. 금통위원 7명이 모두 동결에 찬성했어요. 7월(2.50%→2.75%)과 8월(2.75%→3.00%) 잇달아 올린 뒤 처음 쉬어 간 거예요. 신현송 총재는 이번 동결을 앞서 미리 금리를 올린 '호미질의 결실'이라고 표현했어요. 그러면서 올해와 내년 성장률이 8월 전망(3.3%, 2.9%)보다 상당히 높고, 2027년 근원물가도 2.5%를 넘을 것이라며 물가 목표(2%)에는 2028년에야 닿을 수 있다고 봤어요. 다음 결정은 서두르지 않고 3분기 성장률과 10월 물가를 보고 하겠다고 했어요.",
      more:"소비자물가 상승률은 5월 3.1%, 6월 3.2%, 8월 3.1%, 9월 2.9%로 목표(2%)보다 높은 상태가 이어지고 있어요. 반도체 수출이 잘되면서 경기가 강한 것도 물가를 밀어 올릴 수 있는 요인이에요. 수도권 중저가 주택 값 오름세가 이어지고, 지난달 줄었던 가계대출도 이달 다시 늘고 있어요. 반면 원/달러 환율이 1,320원대로 내려와 수입 물가 부담은 조금 줄었어요. 이렇게 금리는 그대로 두면서 앞으로 더 올릴 수 있다는 신호를 주는 걸 '매파적 동결'이라고 해요. 오늘 '경제 상식 한 조각'에서 자세히 풀었어요. 올해 마지막 회의는 11월 26일이에요.",
      why:"기준금리는 예금·대출 금리의 출발점이에요. 동결이라도 추가 인상 신호가 나오면 대출 금리가 쉽게 내려가지 않고, 주식시장에는 부담이 돼요. 반대로 원화에는 강세 요인이 될 수 있어요.",
      url:"https://www.etoday.co.kr/news/view/2638950", src:"이투데이" },
    { tag:"미국 · 주식", title:"스페이스X, 상장 뒤 첫 분기 흑자…AI 매출 9배로 늘고 테슬라 합병론까지",
      body:"스페이스X가 20일(현지시간) 발표한 3분기 실적에서 매출은 146억 달러로 1년 전보다 161% 늘었고, 순이익 44억 달러로 상장 뒤 처음 분기 흑자를 냈어요. AI 부문 매출은 75억 6천만 달러로 1년 전의 9배가 넘었어요. 4분기 설비투자는 350억~400억 달러에 이를 수 있다고 했어요. 21일 주가는 7.79% 올랐어요. 일론 머스크는 실적 발표에서 테슬라와의 합병을 '좋은 아이디어'라고 했고, 두 회사 이사회는 각각 이를 검토할 특별위원회를 꾸렸어요.",
      more:"설비투자는 공장·데이터센터·장비처럼 오래 쓰는 시설에 쓰는 돈이에요. 요즘 시장의 가장 큰 질문은 'AI에 쏟는 막대한 설비투자가 실제 매출과 이익으로 돌아오느냐'인데, 스페이스X의 숫자는 이 질문에 긍정적인 답을 하나 보여준 셈이에요. 다만 합병은 아직 검토 단계로 조건이나 일정이 나오지 않았어요. 머스크는 합병하려면 테슬라 전체 주식의 50% 넘는 찬성이 필요해 '꽤 높은 문턱'이라고 했고, 21일 테슬라 실적 발표에서 더 설명하지 않자 테슬라 주가는 시간외에서 내렸어요.",
      why:"AI에 쓴 돈이 돌아온다는 신호가 나오면 AI 칩과 메모리 수요 기대도 함께 커져요. 미국 AI 회사들의 실적과 설비투자 계획은 삼성전자·SK하이닉스 같은 한국 반도체 회사의 주문으로 이어질 수 있어 한국 증시에도 영향을 줘요.",
      url:"https://www.kmjournal.net/news/articleView.html?idxno=13930", src:"KMJ" },
    { tag:"유럽 · 거시경제", title:"프랑스 10년 국채 금리 5% 돌파, 2002년 이후 처음",
      body:"21일(현지시간) 프랑스 10년 국채 금리가 장중 5.002%까지 올라 2002년 이후 가장 높았어요. 독일 10년 국채 금리와의 차이는 약 1.57%포인트로 벌어져, 2011년 이후 가장 큰 수준에 가까워졌어요. 큰 재정적자를 줄이기 어려운 데다, 힘이 약해진 정부가 예산안을 의회에서 통과시키지 못하고 있고, 내년 선거를 둘러싼 불확실성과 전국으로 번진 시위까지 겹쳤어요.",
      more:"국채 금리는 나라가 돈을 빌릴 때 내는 이자예요. 국채를 팔려는 사람이 많아져 가격이 내려가면 금리는 올라가요. 유럽에서는 재정이 탄탄한 독일 국채가 기준 역할을 해서, 독일과의 금리 차이가 벌어질수록 투자자들이 그 나라에 돈을 빌려주며 더 큰 위험 보상을 요구한다는 뜻이에요. 에너지 값이 뛰면서 주요국 중앙은행이 금리를 올려 세계 국채 금리가 함께 올랐는데, 그중에서도 프랑스의 오름폭이 컸어요. 23일에는 신용평가사 무디스가 프랑스 신용등급(Aa3)을 다시 평가할 예정이에요.",
      why:"유로존 2위 경제국의 나랏빚 불안은 유럽 전체 금리와 유로화 값을 흔들어요. 세계 채권 금리가 함께 오르면 주식시장의 부담이 커지고, 달러와 원화 환율에도 영향을 줄 수 있어요.",
      url:"https://www.g-enews.com/article/Global-Biz/2026/10/2026102120284822679a1f309431_1", src:"글로벌이코노믹" }

      steps: [ { k:"결정", x:"기준금리를 올리거나, 그대로 두거나, 내려요" }, { k:"말투", x:"결정문과 총재 기자회견에 앞으로의 방향이 담겨요" }, { k:"표 나뉨", x:"반대한 위원(소수의견)이 있었는지 봐요" }, { k:"시장 반응", x:"채권 금리·환율·주가가 그 신호에 먼저 움직여요" } ] },
    note: "<b>이 코너는 특정 상품 추천이 아니라 경제 기본 지식을 공부하는 자료예요.</b> 본문에 나오는 사이트 이름은 숫자를 직접 확인하는 방법을 설명하기 위한 예시예요.",
    intro: "22일 한국은행은 기준금리를 올리지 않았는데, 기사들은 이를 '매파적 동결'이라고 불렀어요. 그리고 그날 코스피는 3.52% 내렸어요. 매파와 비둘기파가 무엇이고, 왜 말투만으로 시장이 움직이는지 차례로 풀어볼게요.",
    points: [
      { t:"1) 매파와 비둘기파가 뭐예요?", items:[
        "<mark>매파는 물가를 잡는 걸 더 중요하게 보고 금리를 올리거나 높게 두려는 쪽</mark>이에요. 사나운 매처럼 물가에 강하게 맞선다는 뜻이에요.",
        "<mark>비둘기파는 경기와 일자리를 더 걱정해 금리를 내리거나 낮게 두려는 쪽</mark>이에요. 온순한 비둘기처럼 부드럽게 대응한다는 뜻이에요. 영어로는 각각 hawk, dove라고 해요." ] },
      { t:"2) 말투는 어디서 드러나나요?", items:[
        "중앙은행은 금리를 정한 뒤 결정문을 내고, 총재가 기자회견을 해요. 결정문의 단어가 조금만 바뀌어도, 총재가 앞날을 어떻게 말하는지에 따라 시장은 다음 결정을 미리 짐작해요.",
        "위원들의 표가 갈렸는지도 단서예요. 동결 결정에서 '올리자'는 반대 의견(소수의견)이 나오면 매파 쪽 신호로, '내리자'는 의견이 나오면 비둘기파 쪽 신호로 읽혀요." ],
        box:{ label:"22일 한은은 어땠나요?", text:"금통위원 7명이 <b>만장일치</b>로 연 3.00% 동결을 결정했어요. 표는 갈리지 않았지만, 신현송 총재는 올해와 내년 성장률이 8월 전망보다 꽤 높고 2027년 근원물가도 전망(2.5%)을 넘을 것이라며 <b>긴축을 이어갈 필요</b>가 있다고 말했어요. 결정은 '동결'이지만 말투는 '매파'였던 거예요." } },
      { t:"3) 왜 이렇게 중요한가요?", items:[
        "시장은 오늘의 금리보다 <mark>앞으로의 금리</mark>에 더 크게 반응해요. 오늘 동결이 이미 예상됐다면, 새로운 정보는 '다음엔 어떻게 할까'를 알려주는 말투뿐이에요.",
        "그래서 같은 동결이라도 '더 올릴 수 있다'는 말이 붙으면 채권 금리가 오르고 주가가 내리기 쉬워요. 반대로 '이제 충분하다'는 말이 붙으면 반대로 움직일 수 있어요." ],
        arrow:"금리 결정 기사에서는 '올렸나, 내렸나'보다 '앞으로 어떻게 하겠다고 했나'가 더 큰 뉴스일 때가 많아요." },
      { t:"4) 요즘 왜 뉴스에 자주 나오나요?", items:[
        "중동 긴장으로 유가가 높고 물가가 목표보다 높게 이어지면서, 한국은행과 미국 연준 모두 금리를 올리는 쪽에 서 있어요. 한은은 7월과 8월 잇달아 금리를 올렸고, 연준도 지난달 금리를 올렸어요.",
        "그래서 금리 결정 날마다 '이번엔 쉬어도 다음엔 또 올릴까'가 관심이에요. 미국 시장은 27~28일 회의에서는 동결 가능성을 높게 보지만, 12월 인상 가능성은 75~88%로 보고 있어요." ] },
      { t:"5) 우리에게는 어떤 영향이 있나요?", items:[
        "매파적인 신호가 나오면 대출 금리가 쉽게 내려가지 않아요. 변동금리 대출이 있다면 이자 부담이 이어질 수 있어요. 대신 예금 금리도 높게 유지되기 쉬워요.",
        "주식에는 대체로 부담이에요. 이자를 주는 예금·채권의 매력이 커지고 기업의 이자 비용도 늘기 때문이에요. 22일 코스피가 3.52% 내린 데에도 한은의 매파적 동결이 영향을 준 것으로 풀이돼요.",
        "환율에는 원화 강세 요인이 돼요. 한국 금리가 높게 유지되면 원화로 된 자산의 매력이 커지기 때문이에요. 22일 환율은 5거래일 연속 약 2년 만의 최저 종가를 다시 썼어요." ] },
      { t:"6) 기사는 이렇게 읽어요", items:[
        "먼저 결정 앞에 붙은 <mark>수식어</mark>를 봐요. '매파적 동결', '비둘기파적 인상'처럼 결정과 말투가 다를 때가 있어요. 수식어가 앞으로의 방향을 알려줘요.",
        "다음으로 만장일치였는지, 소수의견이 몇 명이었는지 봐요. 소수의견이 늘어나면 다음 회의에서 결정이 바뀔 가능성이 커진다는 신호로 읽혀요.",
        "마지막으로 시장의 반응을 봐요. 결정 직후 국채 금리와 환율이 어느 쪽으로 움직였는지가 시장이 그 말투를 어떻게 받아들였는지 보여줘요." ],
        box:{ label:"기사에서 볼 세 가지", text:"<b>수식어</b>: 결정 앞에 '매파적', '비둘기파적' 같은 말이 붙었나요? <b>표 나뉨</b>: 만장일치였나요, 소수의견이 있었나요? <b>다음 조건</b>: 총재가 무엇을 보고 다음 결정을 하겠다고 했나요? 22일 한은은 '매파적', '만장일치', '3분기 성장률과 10월 물가'였어요." } },
      { t:"7) 어디서 직접 확인할 수 있나요?", items:[
        "<b>한국은행 통화정책방향 결정문과 총재 기자간담회</b>: 한국은행 누리집에서 금리 결정 날 발표되는 결정문과 의사록을 볼 수 있어요. <a href='https://www.bok.or.kr' target='_blank' rel='noopener'>bok.or.kr →</a>",
        "<b>미국 연준 FOMC 성명과 회의 일정</b>: 연준 누리집에서 회의 날짜, 성명서, 의사록을 확인할 수 있어요. <a href='https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm' target='_blank' rel='noopener'>federalreserve.gov →</a>" ],
        arrow:"금리 결정 날에는 숫자 다음에 '말투'를 읽어 보세요. 다음 결정의 힌트가 거기 있어요." }
    ]

    { d:"10월 28일(수)", t:"미국 FOMC 금리 결정", key:true, n:"27~28일 회의 결과가 한국 시간 29일 새벽 3시에 나와요. 지금 기준금리는 연 3.75~4.00%이고, 페드워치 기준 이번 인상 가능성은 14.9%예요. 동결하더라도 12월 인상에 대해 어떤 말투를 쓰는지가 관심이에요." },

      body:"미국 AI 서버 회사 슈퍼마이크로가 20일(현지시간) 장 마감 뒤 7~9월 잠정 매출 전망을 185억~195억 달러(약 24조 8천억~26조 2천억 원)로 올렸어요. 원래 내놨던 전망은 145억~155억 달러였고, 금융정보업체 LSEG가 모은 시장 예상은 152억 3천만 달러였어요. 회사는 매출이 늘어난 이유로 AI 플랫폼 수요 증가를 들었어요. 이 소식에 슈퍼마이크로 주가는 시간외 거래에서 10%대 급등했고, 인텔(+3.55%), 샌디스크(+3.27%), 마이크론(+2.13%) 같은 반도체주도 시간외에서 올랐어요. 다음 날 한국에서는 삼성전자와 SK하이닉스가 5%대로 뛰었어요.",
      more:"슈퍼마이크로는 엔비디아 같은 회사의 AI 칩을 받아 데이터센터용 서버로 조립해 파는 회사예요. 서버 한 대에는 AI 칩뿐 아니라 고대역폭메모리(HBM)와 일반 메모리, 저장장치가 함께 들어가요. 그래서 서버 회사의 매출 전망은 메모리를 만드는 한국 반도체 회사의 주문을 미리 엿보는 창 역할을 해요. 이번처럼 회사가 스스로 내놓는 앞으로의 매출 전망을 '가이던스'라고 하는데, 오늘 '경제 상식 한 조각'에서 자세히 풀었어요. 다만 잠정 전망은 회계 감사를 마친 확정 숫자가 아니어서, 정식 실적 발표 때 다시 확인해야 해요.",
      why:"지난주 AI 회사들의 빚과 투자 부담 걱정에 반도체 주가가 크게 흔들렸어요. AI 서버가 실제로 더 많이 팔리고 있다는 숫자는 그 걱정에 맞서는 근거가 돼요. 한국 증시에서 반도체가 차지하는 몫이 큰 만큼, 이런 해외 회사의 숫자가 코스피 방향을 좌우하기도 해요.",
      url:"https://www.hankyung.com/article/2026102150796", src:"한국경제" },
    { tag:"한국 · 경제", title:"10월 1~20일 수출 616억 달러로 역대 최대, 반도체 수출은 222.5% 늘어",
      body:"관세청에 따르면 10월 1~20일 수출은 616억 달러로 1년 전 같은 기간보다 105.4% 늘었어요. 같은 기간 기준으로 역대 가장 많아요. 반도체 수출이 275억 달러로 222.5% 늘어 전체 수출의 44.7%를 차지했어요. 수입은 471억 달러로 42.8% 늘었고, 수출에서 수입을 뺀 무역수지는 145억 달러 흑자였어요.",
      more:"관세청은 매달 1~10일, 1~20일까지의 수출입 숫자를 먼저 내고, 한 달 전체 숫자는 다음 달 1일 정부가 발표해요. 그래서 '중간 성적'은 그달 수출이 어느 쪽으로 가는지 미리 보여주는 신호로 쓰여요. 수출이 늘어 나라 밖에서 달러가 많이 들어오면, 기업들이 그 달러를 원화로 바꾸면서 원화 값이 오르기(환율이 내리기) 쉬워요. 오늘 환율이 4거래일 연속 올해 최저 종가를 쓴 배경으로도 반도체 수출 호조가 꼽혔어요. 다만 반도체가 수출의 절반 가까이를 차지할 만큼 한 품목에 기대는 정도가 커진 점은 반도체 경기가 꺾일 때 부담이 될 수 있어요.",
      why:"수출은 한국 경제의 성적표이자 원/달러 환율을 움직이는 큰 힘이에요. 반도체 수출이 늘면 삼성전자·SK하이닉스 실적 기대가 커지고, 원화 강세로 수입 물가 부담이 줄어드는 효과도 있어요. 반대로 수출 기업은 원화로 적히는 이익이 줄 수 있어요.",
      url:"https://www.news1.kr/local/daejeon-chungnam/6326698", src:"뉴스1" },
    { tag:"미국 · 부동산", title:"미국 9월 주택착공 122만 1천 건, 예상보다 적고 한 달 새 5.2% 줄어",
      body:"미국 상무부 인구조사국에 따르면 9월 주택착공 건수는 연간으로 환산해 122만 1천 건이었어요. 8월(128만 8천 건)보다 5.2%, 1년 전보다 7.4% 줄었고 시장 예상(약 130만 건)에도 못 미쳤어요. 단독주택 착공은 4.6% 줄어든 85만 9천 건, 5가구 이상 다세대 주택은 7.2% 줄어든 34만 9천 건이었어요. 앞으로의 착공을 보여주는 건축허가는 0.2% 줄어든 140만 건이었어요. 이 숫자가 나온 뒤 미국 10년 국채 금리는 5.11%대로 내려갔어요.",
      more:"주택착공은 집을 짓기 시작한 건수예요. 집 한 채를 지으려면 목재·시멘트·가전·가구가 들어가고 일자리도 생겨서, 주택착공은 경기의 앞날을 보여주는 지표로 쓰여요. 미국 주택담보대출(모기지) 금리는 국채 금리를 따라 움직이는데, 10년 국채 금리가 5%를 넘는 지금은 집을 사려는 사람과 짓는 회사 모두 부담이 커요. 다만 인구조사국은 한 달 변화의 90% 신뢰구간을 ±11.8%로 밝혀, 이번 5.2% 감소가 실제 감소인지 통계상 확신하기는 어렵다고 했어요. 골드만삭스는 3분기 성장률 추정치(연율 3.3%)를 그대로 두면서도, 앞으로 1년 동안 높은 대출 금리가 단독주택 착공을 누를 것으로 봤어요.",
      why:"집짓기가 줄면 경기가 식는다는 신호로 읽혀 국채 금리가 내려가요. 미국 금리가 내리면 달러와 세계 금리도 함께 움직여 한국 증시와 환율에 영향을 줘요. 실제로 20일 미국 증시는 금리가 내리며 장 초반 약세를 딛고 올랐어요.",
      url:"https://tokenpost.kr/news/economy/424995", src:"토큰포스트" }
  ],
  term: {

    intro: "20일 미국에서 GM은 3분기 실적이 기대보다 좋았는데도 주가가 6.84% 빠졌고, 슈퍼마이크로는 아직 실적 발표 전인데 주가가 시간외에서 급등했어요. 두 회사의 운명을 가른 건 '가이던스'였어요. 차례로 풀어볼게요.",
    points: [
      { t:"1) 가이던스가 뭐예요?", items:[

      { t:"2) 왜 생겼고, 어떻게 움직이나요?", items:[

        "시장에는 이미 증권사 분석가들이 낸 예상치가 있어요. 회사의 가이던스가 이 예상보다 높으면 주가가 오르기 쉽고, 낮으면 실적이 좋아도 주가가 내릴 수 있어요." ],
        box:{ label:"가이던스와 짝꿍인 '컨센서스'", text:"<b>컨센서스</b>는 여러 증권사 분석가의 예상치를 모은 평균이에요. 슈퍼마이크로의 7~9월 매출에 대한 컨센서스는 152억 3천만 달러였는데, 새 가이던스는 가장 낮게 잡아도 185억 달러였어요. 예상을 30억 달러 넘게 웃돈 셈이라 시장이 크게 놀랐어요. 기사에서 '어닝 서프라이즈'나 '전망 상향'이라는 말이 나오면, 무엇과 무엇을 견준 건지 먼저 찾아보세요." } },

        "GM이 좋은 예예요. 3분기 실적은 기대 이상이었고 200억 달러 자사주 매입 계획도 내놨지만, 원자재 비용 상승과 트럭 판매 부진 속에 연간 실적 전망을 낮추자 주가가 6.84% 빠졌어요. 반대로 3M은 3분기 주당순이익(2.50달러)이 예상(2.38달러)을 넘고 연간 전망도 올려 5.78% 올랐어요." ],
        arrow:"실적 기사에서는 '지난 분기 성적'과 '다음 분기 전망'을 나눠 읽어야 주가가 왜 그렇게 움직였는지 보여요." },

        "21일(현지) 메타와 테슬라가 실적을 발표해요. 이들이 AI 투자를 늘리겠다고 하면 AI 칩과 메모리 주문이 늘 거라는 기대가, 줄이겠다고 하면 반도체 주문이 줄 거라는 걱정이 커질 수 있어요." ] },
      { t:"5) 우리에게는 어떤 영향이 있나요?", items:[

        box:{ label:"기사에서 볼 세 가지", text:"<b>범위</b>: 새 전망의 가운데 값은 얼마인가요? <b>비교</b>: 시장 예상과 이전 전망보다 높나요, 낮나요? <b>이유</b>: 회사가 무엇 때문에 전망을 바꿨다고 했나요? 슈퍼마이크로는 '가운데 값 190억 달러', '예상 152억 3천만 달러보다 높음', 'AI 플랫폼 수요 증가'였어요." } },

  calendarIntro: "이번 주는 빅테크 실적과 한국은행 금리 결정이 이어지고, 다음 주에는 미국 금리 회의와 성장률 발표가 기다리고 있어요. 미국 일정은 현지 날짜이고, 한국 시간도 함께 적었어요.",

  news: [
    { tag:"미국 · 주식", title:"모건스탠리 '아마존 최선호주', 목표주가 350달러로 올리자 4.98% 급등",
      body:"미국 투자은행 모건스탠리가 19일(현지시간) 아마존을 최선호주(톱픽)로 꼽고 목표주가를 350달러로 올렸어요. 아마존의 클라우드 사업인 아마존웹서비스(AWS)의 성장 속도가 빨라지고 있다는 점, 기업들이 여러 AI 모델을 골라 쓸 수 있게 해 주는 'AWS 베드록' 플랫폼의 가능성을 이유로 들었어요. AI 데이터센터에 쓸 전기를 위해 미국 인디애나주에서 1기가와트(GW) 규모 원자력 발전 사업을 추진하는 점도 짚었어요. 이 소식에 아마존 주가는 4.98% 오른 262.45달러로 마감했고, 아마존이 속한 경기소비재 업종도 2.73% 올랐어요.",
      more:"최선호주는 증권사가 담당하는 여러 종목 가운데 가장 좋게 보는 종목이라는 뜻이에요. 목표주가는 앞으로 1년쯤 뒤 그 회사 주가가 이 정도는 될 수 있다고 증권사가 계산한 값이에요. 둘 다 증권사의 의견이라 틀릴 수 있지만, 큰 증권사의 판단이 바뀌면 그 의견을 따라 사고파는 투자자가 많아 주가가 크게 움직여요. 같은 날 JP모건은 인텔의 투자 의견을 올렸어요. 다만 AI에 너무 많은 돈을 쓰고 있다는 걱정, 그 돈을 빚으로 마련하는 부담은 여전해요. 아마존도 클라우드 성장과 AI 플랫폼으로 실제 돈을 버는 모습을 실적으로 보여줘야 한다는 지적이 나와요.",
      why:"아마존 같은 대형 클라우드 회사가 데이터센터에 쓰는 돈은 엔비디아 칩과 SK하이닉스·삼성전자의 메모리 주문으로 이어져요. 시장이 AI 회사들 가운데 '돈을 벌 수 있는 곳'을 골라내기 시작했다는 신호로도 읽혀요.",
      url:"https://www.ebn.co.kr/news/articleView.html?idxno=1728398", src:"EBN" },
    { tag:"거시경제 · 유럽", title:"프랑스 폭동에 국채 금리 4.9%대, 23일 무디스 신용등급 평가 앞두고 긴장",
      body:"프랑스에서 주말 대규모 시위가 약탈과 방화로 번지면서 금융시장이 흔들렸어요. 검찰에 따르면 2,513명이 체포됐고, 경찰은 파리·릴·니스·리옹에 야간 통행금지를 내렸어요. 19일(현지시간) 프랑스 10년 국채 금리는 장중 4.9441%까지 올랐어요. 10월 1일 기록한 4.9629%는 2002년 7월 이후 가장 높은 수준이었어요. 독일 국채와의 금리 차이는 1.423%포인트로 10월 2일 이후 가장 컸고, 프랑스 대표 주가지수 CAC40은 1.11% 내린 7,868.05로 마감했어요.",
      more:"시위는 열악한 교육 여건에 항의한 고등학생 시위에서 시작해 정치 혼란, 높은 물가, 공공서비스 악화에 대한 불만으로 커졌어요. 프랑스의 나랏빚은 국내총생산(GDP)의 119%로, 재정적자를 줄이려면 허리띠를 졸라매는 예산안이 국회를 통과해야 해요. 그런데 시위가 커질수록 그런 예산을 처리하기 어려워져요. 나라가 빚을 잘 갚을지 걱정되면 투자자들은 더 높은 이자를 요구하고, 그래서 국채 금리가 올라요. 무디스는 23일 프랑스 신용등급(Aa3)을 다시 평가하는데, 시장은 한 단계 낮은 A1로 내려갈 수 있다고 보고 있어요. 등급이 내려가면 금리가 더 오를 수 있어요.",
      why:"유럽에서 손꼽히는 큰 나라의 금리가 흔들리면 이탈리아처럼 빚이 많은 다른 나라로 걱정이 번질 수 있어요. 세계 금리가 함께 오르면 외국인 자금 흐름과 환율을 거쳐 한국 시장에도 영향을 줘요. 이날 블록미디어는 프랑스 재정 걱정이 달러를 받친 요인 가운데 하나라고 전했어요.",
      url:"https://www.mt.co.kr/world/2026/10/20/2026102009433337775", src:"머니투데이" },
    { tag:"한국 · 주식", title:"'3분기 실적 걱정'에 방산주 급락, 한화에어로스페이스 11.71% 하락",
      body:"20일 방산주가 크게 내렸어요. 한화에어로스페이스는 11.71% 내린 79만 9,000원으로 마감했고, 장중에는 14%까지 빠졌어요. DS투자증권은 한화에어로스페이스의 3분기 매출을 7조 1,500억 원, 영업이익을 9,805억 원으로 예상했어요. 시장 전망(매출 7조 5,000억 원, 영업이익 1조 1,800억 원)보다 낮은 숫자예요. 대신증권(172만→164만 원), 한국투자증권(200만→165만 원), 현대차증권(139만→132만 원), DS투자증권(183만→165만 원)이 목표주가를 낮췄어요. 현대로템은 3분기 영업이익이 2,471억 원으로 1년 전보다 11% 줄어 시장 전망을 10.5% 밑돌았고, 삼성증권은 목표주가를 25만 원에서 15만 6,000원으로 내렸어요.",
      more:"무기 수출은 계약을 맺은 때가 아니라 물건을 넘겨준 때 매출로 잡혀요. 보고서에 따르면 루마니아로 보낼 K9 자주포 등이 출하됐지만 첫 물량의 인도 절차가 진행 중이라 매출 인식이 늦어졌어요. 여기에 원/달러 환율이 내려 달러로 받는 돈을 원화로 바꾼 값이 줄었어요. 미국에서도 19일 노스럽그러먼(-1.77%), RTX(-0.93%), 록히드마틴(-0.70%) 같은 방산주가 내렸어요. 다음 달 미국 중간선거에서 민주당이 의회를 가져가면 국방 예산을 늘리기 어려울 수 있다는 걱정이 나왔어요.",
      why:"방산은 올해 코스피에서 강했던 업종 가운데 하나예요. 기대가 높았던 종목일수록 실적 전망이 조금만 낮아져도 주가가 크게 흔들릴 수 있다는 걸 보여준 하루예요. 원화 강세가 수출 기업 실적에 주는 영향을 미리 엿볼 수 있는 사례이기도 해요.",
      url:"https://www.g-enews.com/article/Securities/2026/10/202610201507037307923c501012_1", src:"글로벌이코노믹" }
  ],

        "근월물에는 '지금 당장 필요한 원유'의 사정이 많이 담기고, 원월물에는 '몇 달 뒤 사정'에 대한 예상이 담겨요. 지금 공급이 걱정되면 당장 받을 원유가 더 비싸지고, 몇 달 뒤 공급이 늘 거라 보면 먼 계약은 덜 오르거나 내려요.",
        "19일이 딱 그랬어요. WTI 11월물은 103.66달러로 2.22% 올랐지만, 12월물은 98.54달러로 0.5% 내렸어요. 두 계약의 값 차이가 5달러가 넘었어요. 후티 반군 공격 소식은 당장의 공급 걱정을 키웠고, 러시아 제재 완화는 앞으로 공급이 늘 거라는 기대를 키웠기 때문이에요." ],
        box:{ label:"가까운 달이 더 비싸면 '백워데이션'", text:"보통은 먼 달 계약이 조금 더 비싸요. 그동안 원유를 보관하는 비용과 이자가 들기 때문이에요. 이걸 <b>콘탱고</b>라고 해요. 반대로 오늘처럼 가까운 달 계약이 더 비싸면 <b>백워데이션</b>이라고 불러요. 지금 당장 원유가 모자라다고 시장이 느낄 때 나타나는 모습이에요. 근월물과 원월물의 값 차이는 공급 걱정의 온도계처럼 쓰여요." } },
      { t:"3) 왜 알아야 하나요?", items:[
        "같은 날 같은 원유를 두고 기사마다 숫자가 다를 수 있어요. 어떤 기사는 11월물로, 어떤 기사는 12월물로 쓰기 때문이에요. <mark>어느 달 계약인지 모르고 숫자를 견주면 방향까지 거꾸로 읽을 수 있어요.</mark>",
        "만기가 다가온 계약은 거래가 크게 줄어 값이 쉽게 출렁여요. 19일 11월물 거래량은 약 2만 6천 계약으로, 12월물(19만 5천 계약 이상)의 7분의 1쯤이었어요. 거래가 적으면 적은 주문으로도 값이 크게 움직일 수 있어요." ],
        arrow:"유가 기사에서 '몇 월물'이라는 말을 찾는 건, 시험 점수를 볼 때 '몇 회 시험'인지 확인하는 것과 같아요." },
      { t:"4) 요즘 왜 뉴스에 나오나요?", items:[
        "WTI 11월물이 20일(현지) 만기를 맞아요. 만기가 지나면 시장의 기준이 12월물로 넘어가는데, 이걸 <mark>롤오버</mark>라고 해요. 그래서 이번 주 유가 기사는 기준 계약이 바뀌면서 숫자가 갑자기 5달러쯤 낮아 보일 수 있어요.",
        "금도 마찬가지예요. 이 레터의 국제 금값은 12월 인도분 금 선물 값인데, 같은 날 지금 바로 사고파는 금 현물은 4,147.87달러로 12월물(4,160.1달러)과 10달러 넘게 차이가 났어요." ] },

        "원유나 금 상장지수펀드(ETF) 가운데에는 선물에 투자하는 상품이 있어요. 이런 상품은 만기마다 다음 달 계약으로 갈아타야 해서, 먼 달 계약이 더 비싼 콘탱고에서는 갈아탈 때마다 비싸게 사는 셈이 돼요. 그래서 원유 값과 상품 수익률이 다르게 움직일 수 있어요.",

        box:{ label:"기사에서 볼 세 가지", text:"<b>계약 달</b>: 11월물인가요, 12월물인가요? <b>차이</b>: 가까운 달과 먼 달 값이 얼마나 벌어졌나요? <b>거래량</b>: 만기 직전이라 거래가 줄어든 계약은 아닌가요? 이번에는 '11월물 상승·12월물 하락', '5달러 넘게 차이', '11월물 거래가 12월물의 7분의 1쯤'이었어요." } },

  news: [
    { tag:"미국 · 주식", title:"코어위브 부도 보험료 사상 최고, 'AI 빚 걱정'에 나스닥 2% 넘게 하락",
      body:"AI 클라우드 회사 코어위브의 5년 만기 신용부도스와프(CDS) 프리미엄이 15일(현지시간) 장중 1,194.5bp까지 올라 사상 최고를 기록했어요. 시장이 앞으로 5년 안에 이 회사가 빚을 갚지 못할 가능성을 60% 넘게 보고 있다는 뜻으로 해석돼요. 코어위브의 2031년 만기 회사채는 액면가의 82.75% 수준에서 거래돼 수익률이 14.5%로 올랐어요. 16일에도 CDS 값이 다시 사상 최고를 쓰자 코어위브 주가는 11.91% 내렸고, 한 주 동안 약 25% 빠졌어요.",
      more:"CDS는 돈을 빌려준 쪽이 떼일 경우를 대비해 드는 보험 같은 계약이에요. 보험료(프리미엄)가 오를수록 시장이 그 회사의 부도 위험을 크게 본다는 뜻이에요. 미국 신용평가사 S&P의 데이터 담당 임원은 이 값이 1,000bp를 넘으면 보통 신용이 막히는 신호로 본다고 설명했어요. 코어위브는 엔비디아 칩을 사들여 AI 회사들에 컴퓨팅 능력을 빌려주는데, 그 돈의 많은 부분을 빚으로 마련해요. 올해 미국에서 데이터센터 같은 사업을 위해 발행된 회사채는 1,060억 달러로 지난해의 약 3배라는 집계도 나왔어요. 오늘 '경제 상식 한 조각'에서 CDS를 자세히 풀었어요.",
      why:"코어위브 같은 회사가 돈을 빌리기 어려워지면 칩을 덜 사고, 그 영향이 엔비디아를 거쳐 SK하이닉스·삼성전자의 메모리 주문까지 이어질 수 있어요. 미국 반도체지수가 8거래일 연속 내린 배경이에요.",
      url:"https://www.mt.co.kr/world/2026/10/16/2026101607231042016", src:"머니투데이" },
    { tag:"거시경제 · 중국", title:"중국 3분기 성장률 4.5%, 예상 웃돌아… 수출이 받치고 내수는 약해",
      body:"중국 국가통계국은 19일 3분기 국내총생산(GDP)이 1년 전보다 4.5% 늘었다고 발표했어요. 시장 예상(4.4%)을 조금 넘었고, 약 3년 만에 가장 낮았던 2분기(4.3%)보다 빨라졌어요. 1~9월 성장률은 4.6%로 올해 목표(4.5~5%) 안에 들어 있어요. 9월 산업생산은 1년 전보다 5.5%, 소매판매는 1.1% 늘어 예상(소매판매 0.5~0.6%)보다 좋았어요.",
      more:"속을 보면 수출과 내수가 엇갈려요. 1~9월 무역흑자는 9,381억 달러로, 10월 숫자까지 더하면 1조 달러를 넘을 수 있다는 전망이 나와요. 세계적인 AI 투자 붐에 기계와 첨단 제조업 수출이 늘어난 덕분이에요. 반면 1~9월 고정자산투자는 1년 전보다 7.2% 줄었고, 그중 부동산 개발 투자는 20.6%나 줄었어요. 공장과 수출은 바쁜데, 집과 건물에 들어가는 돈은 계속 줄고 있는 거예요. 성장률이 목표 안에 들어오면서 정부가 4분기에 경기를 크게 띄울 필요는 줄었다는 분석도 나와요.",
      why:"중국은 한국의 가장 큰 교역 상대 가운데 하나예요. 중국 경기가 버티면 한국의 중간재 수출에 도움이 되지만, 중국 수출이 너무 강하면 세계 시장에서 한국 기업과 경쟁이 거세질 수 있어요.",
      url:"https://en.sedaily.com/international/2026/10/19/chinas-third-quarter-gdp-grows-45-percent-beating-forecasts", src:"Seoul Economic Daily" },
    { tag:"한국 · 주식", title:"'중국 ESS 미국 철수' 보도에 2차전지 급등, 삼성SDI 11%·LG엔솔 7%",
      body:"19일 2차전지 종목이 크게 올랐어요. 삼성SDI가 11.70%, 포스코퓨처엠이 10.90%, LG화학이 8.46%, LG에너지솔루션이 7.20% 올랐고, 코스닥의 에코프로(+11.19%)와 에코프로비엠(+8.33%)도 뛰었어요. 대만 IT 전문 매체 디지타임스가 미국 공급망 업계 관계자를 인용해, 중국 대형 에너지저장장치(ESS) 회사들이 올해 들어 미국 시장에서 사실상 집단 철수했다고 보도한 영향이에요.",
      more:"ESS는 전기를 배터리에 담아 두었다가 필요할 때 꺼내 쓰는 장치예요. AI 데이터센터가 늘면서 전기를 안정적으로 대는 ESS 수요도 커지고 있어요. 보도에 따르면 미국의 강한 규제와 관세, 엄격한 지분 심사에 중국 정부의 배터리 기술 이전 통제까지 겹쳐 중국 회사들이 미국 현지 생산을 하기 어려워졌어요. 2026년 1분기 북미 ESS 배터리 점유율은 LG에너지솔루션 약 14%, 삼성SDI 약 6%였어요. 다만 철수한 회사의 이름과 사업 규모는 구체적으로 확인되지 않았고, 삼성SDI는 15~16일 급락 때 10% 넘게 내렸던 터라 싸게 사려는 매수도 섞였다는 분석이에요.",
      why:"2차전지는 반도체 다음으로 코스피에서 비중이 큰 업종 가운데 하나예요. 반도체가 흔들릴 때 다른 업종이 지수를 받쳐 줄 수 있는지 보여준 하루였어요. 다만 보도에 기댄 상승은 실제 수주 소식으로 확인되기 전까지 흔들릴 수 있어요.",
      url:"https://www.economytribune.co.kr/news/articleView.html?idxno=3904180", src:"이코노미트리뷴" }

    intro: "지난주 미국 증시를 흔든 말 가운데 하나가 'CDS 사상 최고'였어요. 주식도 채권도 아닌 이 숫자가 왜 나스닥을 2% 넘게 끌어내렸는지 차례로 풀어볼게요.",
    points: [
      { t:"1) CDS가 뭐예요?", items:[
        "CDS는 Credit Default Swap의 줄임말로, 우리말로는 신용부도스와프라고 해요. <mark>돈을 빌린 회사나 나라가 빚을 갚지 못하면 손실을 대신 메워 주기로 한 계약</mark>이에요.",
        "자동차 보험과 비슷해요. 보험에 든 사람이 해마다 보험료를 내고, 사고가 나면 보험사가 손해를 갚아 주잖아요. CDS를 산 쪽은 정기적으로 보험료를 내고, 실제로 부도가 나면 판 쪽에게서 손실을 보상받아요.",
        "이때 내는 보험료를 'CDS 프리미엄'이라고 부르고, 보통 bp(베이시스포인트)로 적어요. 1bp는 0.01%포인트예요. 1억 달러를 빌려준 은행이 500bp짜리 CDS를 사면 1년에 500만 달러를 보험료로 내는 셈이에요." ] },
      { t:"2) 값은 어떻게 움직이나요?", items:[

        "CDS는 시장에서 날마다 사고팔려서, 신용평가사가 등급을 바꾸기 전에 먼저 움직일 때가 많아요. 그래서 위험을 미리 알려 주는 경보등처럼 쓰여요." ],
        box:{ label:"채권이 없어도 사고팔 수 있어요", text:"보험은 보통 자기 차가 있어야 들 수 있지만, CDS는 그 회사의 채권을 갖고 있지 않아도 사고팔 수 있어요. 그래서 헤지펀드가 주식 손실을 줄이려고 사거나, 부도 위험이 커질 것이라는 쪽에 돈을 걸려고 사기도 해요. 2008년 미국 금융위기 때는 이런 거래가 얽히고설켜 위기를 키운 원인 가운데 하나로 꼽혔어요." } },

        arrow:"주가가 '앞으로 얼마나 벌까'를 묻는다면, CDS는 '빌린 돈을 갚을 수 있을까'를 묻는 숫자예요." },
      { t:"4) 요즘 왜 뉴스에 나오나요?", items:[

        "기사에 나오는 '부도 확률 60%'는 CDS 값에서 거꾸로 계산한 숫자예요. 실제로 그 회사가 부도 날 확률을 예측한 게 아니라, 지금 시장이 매긴 보험료가 그 정도 위험을 반영하고 있다는 뜻이에요.",

    { tag:"미국 · 주식", title:"젠슨 황 '코어위브 재무 체력 날마다 강해져', 코어위브 6% 반등",
      body:"젠슨 황 엔비디아 CEO는 15일(현지시간) 스웨덴 스톡홀름에서 열린 행사에서 코어위브의 재무 역량과 체력이 날마다 강해지고 있다고 말했어요. 그는 아주 낙관적이라며 코어위브의 자본 조달 비용이 낮아지는 추세라고 했고, 엔비디아가 코어위브에 재무 보증을 하거나 뒤를 받쳐 줄 필요가 전혀 없다고 덧붙였어요. 전날 15% 넘게 내렸던 코어위브 주가는 장중 9%대까지 밀렸다가 5.94% 올라 69.70달러에 마감했어요.",
      more:"코어위브는 엔비디아 칩을 대량으로 사들여 AI 회사들에 컴퓨팅 능력을 빌려주는 클라우드 회사예요. 칩과 데이터센터에 쓰는 돈을 상당 부분 빚으로 마련해요. 전날 이 회사의 회사채 수익률이 15% 위로 뛰자, 시장은 금리가 오르는 상황에서 AI 회사들이 빚을 계속 감당할 수 있을지 의심했어요. 회사채 수익률이 높다는 건 투자자들이 그만큼 높은 이자를 요구한다는 뜻이에요. 마켓워치에 따르면 코어위브의 2분기 현금흐름은 6억 7,900만 달러였는데, 설비투자에는 94억 달러를 썼어요.",
      why:"코어위브 같은 회사가 칩을 사야 엔비디아가 팔고, 엔비디아가 팔아야 SK하이닉스와 삼성전자의 메모리도 팔려요. 그래서 미국 AI 회사의 빚 걱정이 한국 반도체 주가까지 이어져요. 다만 한 사람의 발언보다 회사가 실제로 돈을 얼마에 빌리는지를 지켜보는 게 중요해요.",
      url:"https://www.mediapen.com/news/view/1130350", src:"미디어펜" },
    { tag:"한국 · 부동산", title:"9월 코픽스 3.43%로 0.25%p 올라, 주담대 변동금리 또 오른다",
      body:"은행연합회가 15일 발표한 9월 신규취급액 기준 코픽스(COFIX)는 3.43%로 한 달 전보다 0.25%포인트 올랐어요. 2024년 6월(3.52%) 이후 2년 3개월 만에 가장 높고, 한 달 상승폭은 2022년 11월(0.36%포인트) 이후 가장 커요. 잔액 기준 코픽스는 3.15%로 0.10%포인트, 신잔액 기준 코픽스는 2.79%로 0.08%포인트 올랐어요.",
      more:"코픽스는 국내 8개 은행이 예금이나 은행채로 돈을 모을 때 든 비용(조달 금리)을 평균 낸 숫자예요. 은행은 이 숫자에 이익(가산금리)을 더해 변동금리 대출 이자를 정해요. 그래서 코픽스가 오르면 여기에 연동된 주택담보대출 변동금리가 따라 오르게 돼요. 코픽스는 예금 금리와 은행채 금리를 따라 움직여요. 신규취급액 기준은 그달 새로 모은 돈의 비용이라 시장 금리 변화가 빨리 반영되고, 잔액 기준은 이미 모아 둔 돈까지 평균해서 천천히 움직여요. 신규취급액 기준 코픽스는 4~7월 넉 달 연속 오른 뒤 8월에 멈췄다가 9월에 다시 올랐어요.",
      why:"변동금리로 집 대출을 받았다면 다음 금리 조정 때 이자가 늘 수 있어요. 앞으로 대출을 받을 계획이라면 신규취급액 기준과 신잔액 기준 가운데 어느 쪽에 연동되는지, 고정금리와 비교하면 어떤지 따져 볼 때예요.",
      url:"https://www.segye.com/newsView/20261015516995", src:"세계일보" }
  ],
  term: {
    name: "생산자물가지수(PPI), 물건값이 소비자에게 오기 전 '공장 문 앞 가격' 읽는 법",
    card: { eyebrow:"경제 상식 한 조각 · 2026.10.16", title:"내가 사기 전에<br><span>먼저 오르는 물가</span>", sub:"생산 단계의 값이 소비자 가격과 금리로 이어지는 순서",

    note: "<b>이 코너는 특정 상품 추천이 아니라 경제 기본 지식을 공부하는 자료예요.</b> 본문에 나오는 사이트 이름은 숫자를 직접 확인하는 방법을 설명하기 위한 예시예요.",
    intro: "어제 호에서 소비자물가 속 '근원물가'를 다뤘다면, 오늘은 그보다 한 단계 앞에서 움직이는 생산자물가예요. 미국 9월 생산자물가가 6.3% 오르며 뉴스에 크게 나왔어요. 이 숫자가 무엇을 재고, 왜 시장이 신경 쓰는지 차례로 풀어볼게요.",
    points: [
      { t:"1) 생산자물가지수가 뭐예요?", items:[
        "생산자물가지수(PPI)는 <mark>기업이 물건과 서비스를 만들어 다른 기업이나 유통 단계에 팔 때 받는 값의 변화</mark>를 숫자로 나타낸 거예요. 소비자가 가게에서 내는 값이 아니라, 그보다 앞 단계의 값이에요.",
        "빵으로 치면 소비자물가가 빵집 진열대 가격이라면, 생산자물가는 밀가루 공장이 빵집에 넘기는 값과 빵집이 도매로 넘기는 값에 가까워요.",
        "미국은 노동부 노동통계국(BLS)이 매달 발표하고, 한국은 한국은행이 매달 생산자물가지수를 내놔요." ] },
      { t:"2) 소비자물가와는 어떻게 이어지나요?", items:[
        "기업은 원가가 오르면 그 부담을 시간을 두고 판매 가격에 얹으려고 해요. 그래서 생산자물가가 먼저 오르고 몇 달 뒤 소비자물가가 따라 오르는 경우가 많아요.",
        "하지만 늘 그대로 옮겨 가지는 않아요. 경쟁이 치열하거나 소비자가 지갑을 닫으면, 기업이 가격을 못 올리고 이익을 줄여 부담을 떠안기도 해요." ],
        box:{ label:"미국 '근원 PPI'는 세 가지를 빼요", text:"미국 소비자물가의 근원 지표는 식품과 에너지를 빼지만, 생산자물가에서 자주 보는 근원 지표는 <b>식품·에너지·유통 서비스(trade services)</b>까지 빼요. 유통 서비스는 도매·소매 회사가 얹는 마진이라 크게 출렁이기 때문이에요. 이번 9월에도 근원 PPI는 한 달 전보다 0.5% 올라, 전체(1.3%)보다 훨씬 덜 올랐어요. 기사에 '근원'이 나오면 무엇을 뺀 숫자인지 확인해 보세요." },
        arrow:"생산자물가는 '앞으로 올 수 있는 물가'를 미리 보여주는 신호등 같은 숫자예요." },
      { t:"3) 왜 중요한가요?", items:[

        "주식 시장에는 기업 이익의 단서예요. 원가가 오르는데 가격을 못 올리면 이익률이 줄어요. 그래서 PPI가 크게 오르면 원가 부담이 큰 업종이 먼저 긴장해요." ] },
      { t:"4) 요즘 왜 뉴스에 나오나요?", items:[

      { t:"5) 우리에게는 어떤 영향이 있나요?", items:[

        "생활 속에서는 기름값, 전기·가스 요금, 배달비처럼 원가에 에너지가 많이 들어간 가격부터 영향을 받기 쉬워요." ] },

        "<b>한국 생산자물가</b>: 한국은행 경제통계시스템(ECOS)에서 '생산자물가지수'를 찾으면 달마다의 숫자와 품목별 흐름을 볼 수 있어요. <a href='https://ecos.bok.or.kr' target='_blank' rel='noopener'>ecos.bok.or.kr →</a>" ],

      more:"휘발유 값이 뛴 건 2월 말 시작된 미국과 이란의 충돌로 원유 공급 걱정이 이어졌기 때문이에요. 기름값만 올랐다면 '잠깐 오른 것'으로 볼 수도 있지만, 이번에는 근원 물가도 예상보다 높았어요. 집세 같은 주거비가 0.4%, 중고차 값이 0.7% 오르는 등 에너지 밖으로도 물가가 퍼지고 있다는 뜻이에요. 식품 물가는 제자리였어요. 시카고상품거래소 페드워치 기준으로 연준이 10월 27~28일 회의에서 금리를 올릴 가능성은 하루 만에 22%에서 37%로 높아졌어요.",
      why:"미국 물가가 오르면 연준이 금리를 더 올릴 수 있고, 미국 금리와 달러가 오르면 외국인이 한국 같은 시장에서 돈을 빼기 쉬워져요. 오늘 코스피 급락의 출발점도 이 숫자였어요.",
      url:"https://www.newsway.co.kr/news/view?ud=2026101421541922674", src:"뉴스웨이" },
    { tag:"한국 · 주식", title:"코스피·코스닥 7%대 폭락, 하루에 두 시장 서킷브레이커",
      body:"15일 코스닥은 낮 12시 23분, 코스피는 12시 38분에 지수가 8% 넘게 내려 서킷브레이커 1단계가 차례로 발동됐어요. 두 시장 모두 20분 동안 거래가 멈췄어요. 코스피는 올해 10번째, 역대 16번째 서킷브레이커예요. 두 시장은 각각 7.57%, 7.65% 내린 5,554.22와 760.82로 마쳤어요. 코스피 시가총액은 4,581조 원으로 하루 만에 약 376조 원 줄었어요.",
      more:"서킷브레이커는 지수가 전날보다 8%, 15%, 20% 넘게 내린 상태가 1분 이어지면 단계별로 거래를 멈추는 장치예요. 1·2단계는 20분 동안 모든 거래를 멈춘 뒤 다시 열고, 3단계가 걸리면 그날 장이 끝나요. 13일 호에서 다룬 사이드카가 컴퓨터 주문만 5분 멈춘다면, 서킷브레이커는 시장 전체를 멈추는 더 센 브레이크예요. 올해 코스피는 3월 4일 하루 12.06%, 7월 28일 10.84% 내린 적도 있어요. 증권가에서는 낙폭이 커서 기술적인 반등은 나올 수 있지만, 흐름이 빠르게 바뀌긴 어렵다는 의견이 많아요.",
      why:"서킷브레이커는 시장이 공포에 휩쓸린 날 잠깐 숨을 고르게 해 주지만, 가격의 방향을 바꾸지는 못해요. 지수를 따라가는 펀드나 퇴직연금도 하루에 7% 넘게 흔들렸을 수 있어요.",
      url:"https://www.pinpointnews.co.kr/news/articleView.html?idxno=495677", src:"핀포인트뉴스" },
    { tag:"한국 · 부동산", title:"9월 가계대출 2조 2천억 원 줄어, 9개월 만에 첫 감소",
      body:"금융위원회가 15일 발표한 '9월 가계대출 동향(잠정)'에 따르면 전체 금융권 가계대출은 한 달 전보다 2조 2,000억 원 줄었어요. 지난해 12월 이후 처음 줄어든 거예요. 주택담보대출은 3조 3,000억 원 늘었지만 8월(4조 3,000억 원)보다 늘어난 폭이 1조 원쯤 작아졌어요. 신용대출 같은 기타대출은 5조 5,000억 원 줄었는데, 그중 신용대출만 3조 원이 줄었어요.",
      more:"금융당국은 주택 거래와 입주 물량이 줄었고, 분기 말에 금융회사들이 못 받을 대출을 정리했으며, 추석 상여금으로 빚을 갚은 사람이 많았던 계절 요인을 이유로 꼽았어요. 증시가 약해지면서 빚을 내 투자하려는 열기가 식은 것도 신용대출이 줄어든 배경으로 거론돼요. 한편 당국은 올해 가계대출 증가율 관리 목표를 1.5%에서 3.0% 수준으로 높여, 연말에 대출이 막히는 일은 크지 않을 거라고 설명했어요.",
      why:"집을 살 때 받는 주택담보대출은 아직 늘고 있지만 속도가 느려졌어요. 대출 흐름은 집값의 앞날을 가늠하는 단서라서, 내 집 마련을 준비한다면 금리와 함께 지켜볼 숫자예요.",
      url:"https://www.fnnews.com/news/202610151004337165", src:"파이낸셜뉴스" }
  ],

      more:"희비를 가른 건 금리였어요. 금리가 오르면 은행은 대출에서 받는 이자가 늘어나요. JP모건, 씨티, 웰스파고 세 곳의 순이자이익은 합쳐서 565억 달러로 11% 늘어 2023년 3분기 이후 가장 빠르게 늘었어요. 반면 9월 말 국채 금리가 빠르게 움직이면서 기업 인수합병이나 채권 발행 같은 일이 미뤄져 수수료 수입은 줄었어요. 제이미 다이먼 JP모건 회장은 금리가 1%포인트 더 오르면 돈을 빌린 가계와 기업의 부담이 커질 거라고 경고했어요.",

      url:"https://www.mt.co.kr/world/2026/10/14/2026101410590638247", src:"머니투데이" },
    { tag:"미국 · 경제", title:"오늘 밤 미국 9월 소비자물가 발표, 휘발유 값에 3.6% 상승 전망",
      body:"미국 노동부가 한국 시간 14일 밤 9시 30분 9월 소비자물가지수(CPI)를 발표해요. 로이터 조사에 따르면 경제학자들은 1년 전보다 3.6%, 한 달 전보다 0.6% 올랐을 것으로 예상해요. 8월(1년 전보다 3.4%, 한 달 전보다 0.4%)보다 높은 숫자예요. 9월 말 미국 휘발유 값이 갤런당 4.50달러 가까이 오르며 넉 달 만에 가장 비쌌던 게 가장 큰 이유로 꼽혀요. 에너지와 식품을 뺀 근원 물가는 한 달 전보다 0.2%, 1년 전보다 2.5% 오를 것으로 보여요.",
      more:"전체 물가와 근원 물가를 나눠 보는 이유가 있어요. 기름값과 먹거리 값은 날씨나 전쟁 같은 일로 크게 오르내려서, 이걸 빼야 물가의 바탕 흐름이 잘 보여요. 이번처럼 전체 물가는 크게 오르는데 근원 물가는 덜 오르면, '기름값 때문에 잠깐 오른 것인지, 물가 전체가 다시 뜨거워지는 것인지'를 두고 해석이 갈려요. 연준은 9월에 약 3년 만에 금리를 올렸고, 다음 금리 결정은 10월 28일(현지)이에요.",
      why:"물가가 예상보다 높으면 연준이 금리를 더 올릴 수 있다는 걱정이 커지고, 미국 금리와 달러가 오르면서 외국인이 한국 주식을 팔기 쉬워져요. 엿새째 이어진 코스피 하락이 멈출지에도 이 숫자가 영향을 줘요.",
      url:"https://www.slist.kr/news/articleView.html?idxno=773409", src:"싱글리스트" },
    { tag:"한국 · 부동산", title:"LH 사장 '집값 급락 가능성' 발언에 전문가들 '시장과 거리 있다'",
      body:"이성훈 한국토지주택공사(LH) 사장이 12일 국회 국정감사에서 '앞으로 집값이 급락할 가능성이 좀 많다'고 말해 논란이 됐어요. 생애 처음 집을 사는 사람의 대출 규제를 강화하자는 자신의 기존 발언을 설명하면서, 금리가 오르고 있고 공급을 열심히 하고 있다는 점을 근거로 들었어요. 다만 LH의 올해 공공주택 착공 실적은 10월 기준으로 목표(전국 9만 6,000호)의 4분의 1 수준이에요.",
      more:"전문가들은 대체로 급락 가능성을 낮게 봤어요. 집을 짓는 데는 시간이 오래 걸려서 지금 공급을 늘려도 바로 효과가 나기 어렵다는 거예요. 우리나라는 금리가 바뀌면 바로 이자가 바뀌는 변동금리 대출 비중이 낮고, 소득에 맞춰 대출을 묶는 DSR 규제도 있어서 빚 부담 때문에 집을 한꺼번에 내놓는 일이 생기기 어렵다는 분석도 나왔어요. 수도권 아파트값은 2025년 2월 이후 19개월 연속 올랐어요.",
      why:"공공기관장의 집값 전망은 내 집 마련을 고민하는 사람들의 판단에 영향을 줄 수 있어요. 한 사람의 전망보다 착공·입주 물량, 대출 금리 같은 숫자를 함께 보는 게 좋아요.",
      url:"https://www.ebn.co.kr/news/articleView.html?idxno=1727787", src:"EBN" }

      more:"PF는 땅을 사고 건물을 짓는 데 필요한 돈을, 앞으로 분양해서 벌 돈을 담보로 빌리는 방식이에요. 자기자본비율 규제는 시행사가 자기 돈을 일정 비율 이상 넣어야 대출을 쉽게 받게 하는 제도예요. 자기 돈을 많이 넣게 하면 사업이 안전해지지만, 당장은 사업을 시작하기 어려워져 주택 공급이 늦어질 수 있어요. 6월 말 PF 대출 잔액은 115조 8천억 원으로 2023년 말 이후 처음 늘었고, 연체율은 4.56%로 조금 낮아졌어요.",
      why:"정부가 규제를 미룬 건 주택 공급이 막히지 않게 하려는 거예요. 아파트가 계획대로 지어져야 몇 년 뒤 분양과 입주 물량이 나와요. 다만 규제를 늦추는 만큼 PF 부실이 쌓이지 않는지도 함께 지켜봐야 해요.",
      url:"https://news.sbs.co.kr/news/endPage.do?news_id=N1008795153", src:"SBS" }

    intro: "오늘 아침 코스피에 두 달 만에 매도 사이드카가 걸렸어요. 사이드카가 무엇을 멈추는지, 서킷브레이커와는 무엇이 다른지 차례로 풀어볼게요.",
    points: [
      { t:"1) 사이드카가 뭐예요?", items:[

        "프로그램 매매는 컴퓨터가 미리 정한 조건에 따라 여러 종목을 한꺼번에 사고파는 거래예요. 금액이 크고 빨라서, 시장이 급할 때 한쪽으로 쏠리면 충격을 키울 수 있어요." ] },
      { t:"2) 언제, 어떻게 걸리나요?", items:[

        "하루에 한 번만 걸리고(매수·매도는 따로 세요), 장 시작 후 5분과 장 마감 40분 전부터는 걸리지 않아요." ],
        box:{ label:"멈추는 건 '컴퓨터 주문'뿐이에요", text:"사이드카가 걸려도 개인이 휴대폰이나 컴퓨터로 내는 주문은 평소처럼 할 수 있어요. 멈추는 건 프로그램 매매 호가의 효력뿐이에요. 그래서 사이드카는 가격의 방향을 바꾸지 못해요. 쏠림의 속도를 잠깐 늦춰 줄 뿐이에요. 오늘도 사이드카 뒤에 지수가 더 내려 장중 5,911까지 밀렸어요." } },
      { t:"3) 서킷브레이커와는 뭐가 달라요?", items:[

        "사이드카는 오를 때도 내릴 때도 걸리지만, 서킷브레이커는 내릴 때만 걸려요. 오늘 코스피는 장중 7.41%까지 내려 서킷브레이커 1단계(8%) 바로 앞까지 갔어요." ],

  news: [
    { tag:"한국 · 기업", title:"중국 CXMT '차세대 D램 기술 진전' 발표, 삼성전자·SK하이닉스 4%대 하락",
      body:"중국 메모리 회사 창신메모리(CXMT)가 12일 차세대 D램 구조인 '4F²'에서 핵심적인 진전을 이뤘다고 밝혔어요. 스스로 개발한 수직 구조의 트랜지스터를 써서 셀 면적과 새는 전류를 줄였다는 설명이에요. CXMT는 이 기술을 쓴 서버용 DDR5 메모리 모듈을 2026년 말에 내놓겠다고 했지만, 자세한 사양과 양산 일정은 밝히지 않았어요. 이 소식이 전해진 뒤 삼성전자는 4.39%, SK하이닉스는 4.52% 내려 마감했어요.",
      more:"D램은 아주 작은 방(셀)이 빽빽이 모인 칩이에요. 지금 널리 쓰는 6F² 구조보다 셀 하나가 차지하는 면적을 줄인 게 4F² 구조예요. 같은 크기의 칩에 방을 더 많이 넣을 수 있어 저장 용량과 전력 효율이 좋아져요. 삼성전자와 SK하이닉스도 개발 중이고, 삼성전자는 2028년 양산을 목표로 하는 것으로 알려졌어요. 시장조사업체 카운터포인트리서치에 따르면 올해 2분기 세계 D램 매출 점유율은 삼성전자 38%, SK하이닉스 25%, 마이크론 24%, CXMT 10%쯤이에요. CXMT는 1년 전 4%에서 빠르게 커졌어요.",
      why:"삼성전자와 SK하이닉스는 코스피에서 비중이 가장 큰 두 종목이에요. 지금은 메모리가 모자라 값이 높지만, 경쟁자가 늘면 값과 이익이 흔들릴 수 있어요. 다만 이번 발표가 실제 서버 주문으로 이어질지는 아직 확인되지 않았어요.",

    { tag:"한국 · 부동산", title:"한은 국감 '집값 상승 기대 자극하지 않게 일관된 정책 필요'",

      more:"주택가격전망지수가 100보다 크면 집값이 오를 거라고 보는 사람이 내릴 거라고 보는 사람보다 많다는 뜻이에요. 집값이 오를 거라 믿는 사람이 많아지면 대출을 받아서라도 미리 사려는 수요가 커져요. 한은은 수도권 주택 거래가 4월부터 장기 평균을 웃돌다 8월 정부 대책 뒤 주춤했다고 봤어요. 한편 미국·일본 장기 금리가 크게 오르면 국내 대출 금리도 따라 오를 수 있다고 경고했어요. 취약한 자영업자의 대출 연체율은 2분기 12.7%로 2023년 말(10.1%)보다 높아졌어요.",

      { t:"1) 소비자심리지수가 뭐예요?", items:[
        "소비자심리지수는 <mark>가계에 경제 형편과 앞날을 물어보고, 그 답을 숫자로 바꾼 지표</mark>예요. 실제로 쓴 돈이 아니라 쓰려는 마음을 재요.",
        "미국에서는 미시간대가 매달 발표하는 소비자심리지수가 대표적이에요. 한국에서는 한국은행이 매달 소비자동향조사를 해서 여러 심리지수를 내놔요.",
        "오늘 한은 국감에서 나온 주택가격전망지수도 같은 조사에 들어 있는 항목이에요. '1년 뒤 집값이 오를까요?'라는 질문의 답을 숫자로 바꾼 거예요." ] },
      { t:"2) 어떻게 만들어지나요?", items:[
        "질문은 생각보다 단순해요. '지금 형편이 1년 전보다 나아졌나요?', '앞으로 경기가 좋아질까요?', '지금이 큰 물건을 사기 좋은 때인가요?' 같은 걸 물어요.",
        "좋아졌다는 답과 나빠졌다는 답의 비율을 계산해 점수를 매겨요. 한국은행 지수는 <mark>100보다 크면 좋게 보는 사람이 더 많다</mark>는 뜻이에요.",
        "미국 미시간대는 한 달에 두 번 숫자를 내요. 먼저 잠정치가 나오고, 그달 말에 조사를 더해 확정치가 나와요." ],
        box:{ label:"현재와 기대는 따로 봐요", text:"미시간대 지수는 지금 형편을 묻는 '현재 상황 지수'와 앞으로를 묻는 '기대 지수'로 나눠요. 10월에는 현재 상황 지수가 50.9에서 44.7로 떨어져 사상 최저였는데, 기대 지수는 46.3에서 47.3으로 올랐어요. '지금은 힘들지만 더 나빠지진 않겠지' 하는 마음이 섞여 있다고 볼 수 있어요." } },
      { t:"3) 왜 중요한가요?", items:[
        "소비는 경제를 움직이는 큰 엔진이에요. 사람들이 불안하면 외식, 여행, 자동차처럼 미룰 수 있는 지출부터 줄여요. 그래서 심리지수는 실제 소비 통계보다 한발 먼저 분위기를 알려줘요.",
        "이번 조사에서 응답자의 54%는 지출을 줄이고, 16%는 아예 멈출 계획이라고 답했어요. 마음이 실제 지출로 이어지면 기업 실적에도 영향을 줘요.",
        "같은 조사에서 묻는 '앞으로 물가가 얼마나 오를까'(기대 인플레이션)는 중앙은행이 특히 눈여겨보는 숫자예요. 사람들이 물가가 오른다고 믿으면 임금과 가격을 미리 올리면서 실제 물가도 따라 오르기 쉬워요." ],
        arrow:"심리지수는 '지금 얼마나 썼나'가 아니라 '앞으로 얼마나 쓸 마음인가'를 보여줘요." },
      { t:"4) 요즘 왜 뉴스에 나오나요?", items:[
        "미국 10월 소비자심리지수는 46.3으로 5월(44.8) 이후 가장 낮았어요. 휘발유 값이 갤런당 4.37달러로 1년 전보다 40.5% 오른 게 큰 이유로 꼽혀요.",
        "1년 뒤 물가 예상은 4.7%로 9월(4.6%)보다 올랐어요. 이번 주 14일 미국 소비자물가 발표를 앞두고 금리 걱정을 키우는 숫자예요.",
        "한국에서는 주택가격전망지수가 3월 97에서 8월 134까지 올랐어요. 한국은행은 이 기대가 가계대출을 자극하지 않도록 정책을 일관되게 유지해야 한다고 밝혔어요." ] },
      { t:"5) 우리에게는 어떤 영향이 있나요?", items:[
        "미국 소비자가 지갑을 닫으면 미국으로 가는 한국 수출품의 주문이 줄 수 있어요. 미국은 한국의 큰 수출 시장이에요.",
        "미국 기대 인플레이션이 높아지면 연준이 금리를 쉽게 내리지 못해요. 그러면 미국 금리가 높게 유지되고, 외국인이 한국 주식을 팔기 쉬운 환경이 이어져요.",
        "주택가격전망지수가 높으면 '지금 안 사면 늦는다'는 마음이 커져요. 대출 규제나 금리가 바뀔 때 사람들이 한꺼번에 움직이기 쉬워서, 내 집 마련 계획이 있다면 함께 지켜볼 숫자예요." ] },
      { t:"6) 숫자는 이렇게 읽어요", items:[
        "<mark>수준보다 방향</mark>을 먼저 봐요. 지난달보다 올랐는지 내렸는지, 몇 달째 같은 방향인지가 중요해요.",
        "예상치와도 견줘 봐요. 이번 미국 지수는 예상(47.6)보다 낮아서 실망스러운 숫자로 받아들여졌어요.",
        "심리는 실제 행동과 어긋날 때가 있어요. 불안하다고 답하면서도 실제로는 돈을 쓰는 경우도 있어서, 소매판매 같은 실제 소비 숫자와 함께 보는 게 좋아요. 미국 9월 소매판매는 15일에 나와요." ],
        box:{ label:"기사에서 볼 세 가지", text:"<b>방향</b>: 지난달보다 올랐나요, 내렸나요? <b>나눠 보기</b>: 현재 평가와 앞으로의 기대 중 어느 쪽이 움직였나요? <b>물가 예상</b>: 기대 인플레이션은 몇 %인가요? 이번에는 '내림', '현재 평가가 급락', '4.7%로 상승'이었어요." } },
      { t:"7) 어디서 직접 확인할 수 있나요?", items:[
        "<b>미국 소비자심리지수</b>: 미시간대 소비자 조사 누리집에서 매달 잠정치와 확정치를 볼 수 있어요. <a href='https://www.sca.isr.umich.edu/' target='_blank' rel='noopener'>sca.isr.umich.edu →</a>",
        "<b>한국 소비자심리·주택가격전망지수</b>: 한국은행 경제통계시스템(ECOS)에서 '소비자동향조사'를 찾으면 달마다의 숫자를 볼 수 있어요. <a href='https://ecos.bok.or.kr' target='_blank' rel='noopener'>ecos.bok.or.kr →</a>" ],
        arrow:"심리지수를 보면 '사람들이 지금 어떤 기분인가'를, 다음 달 소비 통계를 보면 '그 기분이 행동으로 이어졌나'를 확인할 수 있어요." }
    ]

    { tag:"미국 · 기업", title:"오픈AI 연환산 매출 500억 달러 보도, 알려진 것보다 200억 달러 적어",
      body:"영국 파이낸셜타임스는 8일 오픈AI가 투자자들에게 알린 9월 말 연환산 매출이 약 500억 달러라고 보도했어요. 지난달 여러 매체가 전한 약 700억 달러보다 200억 달러 적어요. 오픈AI는 이 보도에 답하지 않았어요. 같은 날 월스트리트저널은 브로드컴이 오픈AI와 함께 개발하는 맞춤형 칩을 위해 500억 달러 넘는 자금 조달을 추진하고, 오라클도 사모펀드 등과 큰 규모의 자금 조달을 논의하고 있다고 전했어요. 오라클은 5.48%, 브로드컴은 4.35% 내렸어요.",
      more:"차이는 매출을 세는 방법에서 나왔어요. 보도에 따르면 오픈AI는 경쟁사와 견주기 쉽도록 클라우드 협력사를 거쳐 팔린 금액까지 넣어 숫자를 높여 잡은 적이 있고, 여기에 성장률을 곱한 약 700억 달러가 퍼졌어요. 회사가 직접 내놓은 숫자는 500억 달러에 가까웠어요. 오픈AI는 기업가치 1조 4,000억 달러로 300억 달러 이상을 새로 투자받으려 하고 있어요. 매출이 500억 달러면 기업가치가 매출의 28배, 700억 달러면 20배예요. 한편 오라클은 최근 2년 동안 장기 부채가 거의 두 배로 늘어 1,600억 달러를 넘었고, 6~8월 석 달 동안 설비에 쓴 돈만 285억 달러예요.",
      why:"AI 관련 주식은 올해 시장을 끌어올린 주인공이에요. 그 기대의 바탕이 되는 매출 숫자가 흔들리면 칩, 서버, 데이터센터 회사까지 함께 영향을 받아요. 삼성전자와 SK하이닉스도 이 흐름 안에 있어요.",
      url:"https://www.g-enews.com/article/Securities/2026/10/202610090609005142e250e8e188_1", src:"글로벌이코노믹" },
    { tag:"거시경제 · 원자재", title:"중동 긴장에 허리케인까지, 브렌트유 4% 뛰어 104달러",
      body:"8일 국제 유가가 크게 올랐어요. WTI는 3.21달러(3.64%) 오른 배럴당 91.49달러, 브렌트유는 4.08달러(4.07%) 오른 104.28달러로 마감했어요. 브렌트유는 9월 29일 이후 가장 높아요. 이란이 호르무즈 해협을 지나는 유조선 공격을 늘렸고, 예멘 후티 반군은 사우디아라비아 공항에 미사일을 쐈어요. 여기에 허리케인 이사이아스가 미국 멕시코만으로 다가오면서 이 지역 원유 생산의 62.9%, 하루 약 130만 배럴이 멈췄어요.",
      more:"유가는 공급이 줄어들 거라는 걱정만으로도 올라요. 호르무즈 해협은 중동 원유가 바다로 나가는 좁은 길목이에요. 지난주 이곳을 지난 원유는 하루 평균 950만 배럴로 전쟁 전보다 30%쯤 적었어요. 멕시코만은 미국 바다 유전이 모여 있는 곳이라 허리케인이 오면 회사들이 미리 생산을 멈추고 사람을 대피시켜요. 다만 트럼프 대통령이 11월 3일 중간선거 전에는 이란을 공격하지 않겠다고 밝히면서, 장중 5달러 넘게 올랐던 유가는 오름폭을 일부 내줬어요.",
      why:"우리나라는 원유를 거의 다 수입해요. 유가가 오르면 주유소 기름값과 전기·가스 요금, 물건값이 시차를 두고 따라 올라요. 물가가 오르면 금리를 내리기도 어려워져요.",
      url:"https://www.newspim.com/news/view/20261009000020", src:"뉴스핌" },
    { tag:"한국 · 부동산", title:"다음 주 전국 8개 단지 1,829가구 청약, 경기도에 몰렸어요",
      body:"부동산 조사 업체 리얼투데이에 따르면 10월 셋째 주(12~16일)에 전국 8개 단지에서 1,829가구가 청약을 받아요. 오피스텔을 포함하고 행복주택은 뺀 숫자예요. 경기도 물량이 많아요. 화성 향남역 그로브 스위첸(933가구)과 양평 쌍용 더 플래티넘 한강(333가구)이 13일 1순위 청약을 받아요. 지방에서는 대구 중구 더샵 동인센트리스(314가구) 등이 나와요. 16일에는 충남 아산과 충북 청주에서 1,000가구가 넘는 대단지 견본주택이 문을 열어요.",
      more:"청약은 새로 짓는 아파트를 분양받겠다고 신청하는 절차예요. 청약통장 가입 기간, 무주택 기간, 부양가족 수 등으로 점수를 매기거나 추첨해서 당첨자를 뽑아요. 1순위는 통장 가입 기간과 납입 조건을 채운 사람이 먼저 신청하는 차례예요. 어제 전한 대로 서울 아파트값은 87주째 오르고 있고, 수요가 서울 외곽과 경기도로 옮겨 가는 모습이에요. 이번 주 분양 물량이 경기도에 몰린 것도 같은 흐름에서 볼 수 있어요.",
      why:"청약은 2030이 내 집을 마련하는 대표적인 길 가운데 하나예요. 당장 신청하지 않더라도 어느 지역에 얼마나 공급되는지, 1순위 조건이 무엇인지 알아 두면 나중에 준비하기 쉬워요. 단지마다 조건이 다르니 입주자 모집 공고를 직접 확인해야 해요.",
      url:"https://fnnews.com/news/202610090305498887", src:"파이낸셜뉴스" }
  ],
  term: {
    name: "연환산 매출, 한 달 성적에 12를 곱한 '예상 연봉' 읽는 법",
    card: { eyebrow:"경제 상식 한 조각 · 2026.10.09", title:"같은 회사 매출이<br><span>왜 500억도 되고 700억도 될까</span>", sub:"연환산 매출 숫자가 만들어지고 주가로 이어지는 순서",
      steps: [ { k:"최근 매출", x:"한 달이나 한 분기 매출을 재요" }, { k:"곱하기", x:"1년 치로 늘려서 계산해요" }, { k:"기업가치", x:"이 숫자에 몇 배를 곱해 값을 매겨요" }, { k:"주변 회사", x:"거래하는 회사의 기대도 함께 움직여요" } ] },
    note: "<b>이 코너는 특정 상품 추천이 아니라 경제 기본 지식을 공부하는 자료예요.</b> 본문에 나오는 사이트 이름은 숫자를 직접 확인하는 방법을 설명하기 위한 예시예요.",
    intro: "오늘 미국 반도체 주식을 끌어내린 건 '연환산 매출'이라는 낯선 말이었어요. 실제로 번 돈과 무엇이 다른지, 왜 같은 회사인데 숫자가 둘이 나왔는지 차례로 풀어볼게요.",
    points: [
      { t:"1) 연환산 매출이 뭐예요?", items:[
        "연환산 매출은 <mark>최근 짧은 기간의 매출을 1년 치로 늘려 계산한 숫자</mark>예요. 지난달에 10억 원을 팔았다면 12를 곱해 연환산 매출 120억 원이라고 말하는 식이에요.",
        "아르바이트 첫 달에 200만 원을 받고 '내 연봉은 2,400만 원쯤 되겠네' 하고 어림하는 것과 같아요. 실제로 1년 동안 받은 돈이 아니라, 지금 속도가 이어진다면 받게 될 돈이에요.",
        "영어로는 런레이트(run-rate)라고 부르고, 매달 요금을 받는 구독 서비스 회사는 ARR(연간 반복 매출)이라는 말을 써요." ] },
      { t:"2) 왜 이런 숫자를 쓰나요?", items:[
        "빠르게 크는 회사는 지난 1년 매출이 지금의 크기를 잘 보여주지 못해요. 1월에 1억 원을 팔던 회사가 12월에 10억 원을 판다면, 1년 합계보다 12월 숫자가 지금 모습에 더 가까워요.",
        "그래서 새로 생긴 회사나 AI 회사처럼 성장이 빠른 곳은 연환산 매출로 자기 크기를 알려요. 투자자도 이 숫자를 보고 회사의 값을 매겨요." ],
        box:{ label:"실제 매출과의 차이", text:"실제 매출은 정해진 기간에 이미 번 돈이에요. 회계 기준에 따라 계산하고, 상장한 회사는 외부 회계법인의 확인을 받아 공시해요. 연환산 매출은 회사가 스스로 계산해 알리는 숫자예요. 어느 달을 기준으로 삼을지, 무엇까지 매출에 넣을지 정해진 규칙이 없어요." } },
      { t:"3) 왜 숫자가 사람마다 다르게 나오나요?", items:[
        "<mark>무엇을 매출로 세느냐</mark>에 따라 달라져요. 다른 회사를 거쳐 판 금액을 전부 넣는지, 내 몫만 넣는지에 따라 숫자가 크게 벌어져요.",
        "기준으로 삼는 기간도 영향을 줘요. 유난히 잘 팔린 달에 12를 곱하면 숫자가 부풀고, 여기에 예상 성장률까지 곱하면 더 커져요.",
        "이번 오픈AI가 그런 경우였어요. 보도에 따르면 협력사를 거친 판매까지 넣어 높여 잡은 숫자에 성장률이 더해져 약 700억 달러가 퍼졌고, 회사가 투자자에게 알린 숫자는 약 500억 달러였어요." ],
        arrow:"회사가 200억 달러를 잃은 게 아니라, 같은 장사를 두 가지 방법으로 센 거예요." },
      { t:"4) 그런데 왜 주가가 크게 움직였나요?", items:[
        "성장하는 회사의 값은 흔히 매출의 몇 배로 매겨요. 오픈AI는 기업가치 1조 4,000억 달러로 투자를 받으려 하는데, 매출이 700억 달러면 20배, 500억 달러면 28배예요. 같은 값이 훨씬 비싸 보이게 돼요.",
        "오픈AI는 상장하지 않은 회사예요. 그래서 걱정은 오픈AI에 칩과 서버를 대는 상장 회사로 옮겨 갔어요. 8일 필라델피아 반도체지수가 3.39%, 오라클이 5.48% 내린 이유예요.",
        "같은 날 이 회사들이 큰돈을 빌리려 한다는 보도도 나왔어요. 버는 돈은 생각보다 적을 수 있는데 쓰는 돈은 계속 는다는 점이 겹쳐 보인 거예요." ] },
      { t:"5) 우리에게는 어떤 영향이 있나요?", items:[
        "삼성전자와 SK하이닉스가 만드는 메모리 반도체는 AI 데이터센터에 들어가요. AI 회사들이 돈을 덜 쓸 거라는 걱정이 커지면 두 회사 주가도 영향을 받아요.",
        "8일 뉴욕에 상장된 SK하이닉스 주식예탁증서도 4.35% 내렸어요. 코스피에서 반도체가 차지하는 비중이 커서, 지수를 따라가는 펀드나 연금에도 이어져요.",
        "다만 연환산 매출을 세는 방법이 달랐다는 것과 AI 수요가 실제로 줄었다는 것은 다른 이야기예요. 이달 나오는 반도체 회사들의 실적 발표에서 주문이 어떤지 확인할 수 있어요." ] },
      { t:"6) 숫자는 이렇게 읽어요", items:[
        "기사에서 매출 숫자를 보면 <mark>이미 번 돈인지, 늘려서 계산한 돈인지</mark>부터 가려요. '연환산', '연율', '런레이트' 같은 말이 붙어 있으면 늘려 계산한 숫자예요.",
        "누가 말한 숫자인지도 봐요. 회사가 공시한 숫자, 회사가 투자자에게 알린 숫자, 언론이 계산한 숫자는 믿을 수 있는 정도가 달라요.",
        "매출과 이익도 달라요. 매출은 판 금액이고 이익은 쓴 돈을 빼고 남은 금액이에요. 매출이 커도 쓰는 돈이 더 크면 손해를 봐요." ],
        box:{ label:"기사에서 볼 세 가지", text:"<b>종류</b>: 실제 매출인가요, 연환산인가요? <b>범위</b>: 협력사를 거친 판매까지 넣었나요? <b>출처</b>: 공시인가요, 보도인가요? 이번에는 '연환산', '범위가 달랐음', '보도'였어요. 세 가지 모두 숫자가 흔들리기 쉬운 쪽이었어요." } },
      { t:"7) 어디서 직접 확인할 수 있나요?", items:[
        "<b>국내 상장사의 실제 매출</b>: 금융감독원 전자공시시스템(DART)에서 회사 이름을 검색하면 분기보고서와 사업보고서의 손익계산서를 볼 수 있어요. <a href='https://dart.fss.or.kr' target='_blank' rel='noopener'>dart.fss.or.kr →</a>",
        "<b>미국 상장사의 실제 매출</b>: 미국 증권거래위원회(SEC)의 공시 시스템 에드가(EDGAR)에서 분기보고서(10-Q)와 연간보고서(10-K)를 찾을 수 있어요. <a href='https://www.sec.gov/edgar/search/' target='_blank' rel='noopener'>sec.gov/edgar →</a>",
        "오픈AI처럼 상장하지 않은 회사는 이런 공시 의무가 없어요. 그래서 숫자가 보도를 거쳐 전해지고, 이번처럼 엇갈리는 일이 생겨요." ],
        arrow:"매출 숫자를 만나면 '이건 성적표인가요, 예상 점수인가요?' 하고 한 번 물어보세요." }
    ]
  },
  calendarIntro: "오늘 밤 미국 증시는 평소처럼 열리고, 허리케인 이사이아스가 미국 멕시코만 연안에 닿을 것으로 예보돼 있어요. 국내 증시는 12일(월)에 다시 열려요. 다음 주는 미국 물가와 은행 실적이 한꺼번에 나와요. 날짜는 현지 기준이에요.",

    { tag:"한국 · 기업", title:"삼성전자 3분기 영업이익 107조 4,000억 원, 국내 첫 '분기 100조'",
